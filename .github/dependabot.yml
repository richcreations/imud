# Two ecosystems apply here: github-actions, and docker for the two pinned
# Debian bases in devbox/Dockerfile.  imud itself is C, and its dependencies
# are Debian system libraries (libgpiod, libmosquitto) resolved by
# debian/control — Dependabot has no ecosystem for those.
#
# Everything is grouped into a single PR so a routine v4 -> v5 bump is one
# review, not six.
#
# Action refs are pinned to full commit SHAs with a `# vX.Y.Z` comment.
# Dependabot understands that convention: it bumps the SHA and rewrites the
# comment to the new version, so the PR still reads as "v7.0.1 -> v7.1.0"
# even though the diff is a hash.  A tag is a moving pointer — pinning the
# SHA is what makes a re-run of an old workflow reproducible, and it is what
# Scorecard's Pinned-Dependencies check asks for.  Do not "tidy" these back
# into @v7.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: []

  # devbox/Dockerfile pins both Debian bases by manifest-list digest.  Unlike
  # the actionlint tarball — a curl'd binary with no ecosystem, bumped by hand
  # — a digest on a FROM line is exactly what this ecosystem maintains, so the
  # pin stays fresh without anyone having to remember it.  Same grouping and
  # prefix as the actions, so a bump is one review either way.
  #
  # This ecosystem reads FROM lines and nothing else, so a `container:` image
  # or a `docker run` argument in a workflow is invisible to it.  The
  # workflows therefore do NOT carry digests of their own: ci.yml's `bases`
  # job reads them out of this Dockerfile and publishes them as outputs, and
  # build-debs.yml — reachable from two callers, so it cannot depend on a job
  # in either — reads the same line itself.
  #
  # That is deliberate, and the requirement it satisfies is that a Dependabot
  # PR merges and simply works.  Copying the digests into the workflows as
  # well would leave every bump half-applied, so a routine base update would
  # stop being a merge and start being a chore — with a checker to catch the
  # half that was forgotten, which is a worse design than not being able to
  # forget it.
  - package-ecosystem: docker
    directory: /devbox
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: []
