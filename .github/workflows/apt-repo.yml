# Publish the self-hosted apt repository to GitHub Pages.
#
# This workflow regenerates the signed apt index and redeploys the Pages site.
# It is deliberately SEPARATE from release.yml (which builds debs and attaches
# them to a GitHub Release) — that is the build step; this is the publish gate.
#
# The .deb files do NOT live on main.  They live on the orphan `apt-pool`
# branch, rebuilt as a single root commit by apt-publish.yml, and are checked
# out here into pool-src/.  Keeping binaries off the default branch is what
# lets main stay a source tree: it took the repository from 75 MB to 5.5 MB,
# took the `make dist` tarball from 4.9 MB to 0.8 MB, and cleared OpenSSF
# Scorecard's Binary-Artifacts check, which had been 0 with 114 findings.
#
# Served layout (https://richcreations.github.io/imud/):
#   /            ← web/                                (root site)
#   /apt/        ← apt/ + apt-pool:pool/ + generated dists/
#
# One-time setup: Settings → Pages → Source = GitHub Actions, and add the
# ASCII-armored private signing key as the secret APT_GPG_PRIVATE_KEY
# (its public half is committed at apt/KEY.gpg and served for users).
name: apt repo

on:
  push:
    branches: [main]
    paths:
      - 'apt/**'          # KEY.gpg / index.html — the pool is not here
      - 'web/**'
      - '.github/workflows/apt-repo.yml'
  workflow_dispatch:
    inputs:
      pool_ref:
        description: 'Branch holding pool/<suite>/*.deb'
        default: apt-pool

# Default is read-only; the Pages scopes are granted to the deploy job
# alone.  The build job is the one that handles the private signing key,
# so it gets no write scope of any kind.
permissions:
  contents: read

# Never let two Pages deploys race; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The pool lives on its own orphan branch, not here.  Sparse + depth 1
      # because that branch is deliberately a single commit holding nothing
      # but pool/.
      - name: Check out the deb pool
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.pool_ref || 'apt-pool' }}
          path: pool-src
          sparse-checkout: pool
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install apt-ftparchive + gpg
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::secret APT_GPG_PRIVATE_KEY is not set — see apt/README" >&2
            exit 1
          fi
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          echo "Signing fingerprint: $FPR"
          echo "FPR=$FPR" >> "$GITHUB_ENV"

      - name: Build signed repository into site/
        run: |
          set -euo pipefail

          # --- assemble the served tree -------------------------------------
          rm -rf site
          mkdir -p site
          cp -a web/. site/                 # root site
          mkdir -p site/apt
          cp -a pool-src/pool site/apt/pool # debs from the apt-pool branch
          cp    apt/KEY.gpg apt/index.html site/apt/

          # A pool that arrived empty means the checkout above silently got
          # the wrong ref; publishing that would take every package offline.
          if ! ls site/apt/pool/*/*.deb >/dev/null 2>&1; then
            echo "::error::no .deb files found in the pool — refusing to publish an empty repository" >&2
            exit 1
          fi

          cd site/apt

          # --- per-suite, per-arch index --------------------------------
          # The pool mixes arm64/armhf/all debs in one directory;
          # `apt-ftparchive --arch X` picks out *_X.deb + *_all.deb by
          # filename, so every arch index carries the arch:all packages.
          for suite in bookworm trixie; do
            if ! ls pool/"$suite"/*.deb >/dev/null 2>&1; then
              echo "no debs for $suite — skipping"
              continue
            fi
            echo "==> indexing $suite"
            for arch in arm64 armhf; do
              mkdir -p "dists/$suite/main/binary-$arch"

              apt-ftparchive --arch "$arch" packages "pool/$suite" \
                > "dists/$suite/main/binary-$arch/Packages"
              gzip -9kf "dists/$suite/main/binary-$arch/Packages"
            done

            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="imud" \
              -o APT::FTPArchive::Release::Label="imud" \
              -o APT::FTPArchive::Release::Suite="$suite" \
              -o APT::FTPArchive::Release::Codename="$suite" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Architectures="arm64 armhf" \
              release "dists/$suite" > "dists/$suite/Release"

            gpg --batch --yes --local-user "$FPR" \
                --clearsign -o "dists/$suite/InRelease" "dists/$suite/Release"
            gpg --batch --yes --local-user "$FPR" \
                -abs -o "dists/$suite/Release.gpg" "dists/$suite/Release"

            # fail loudly if the signature we just wrote does not verify
            gpg --verify "dists/$suite/InRelease" >/dev/null 2>&1 \
              || { echo "::error::InRelease failed to verify for $suite" >&2; exit 1; }
            echo "    signed + verified $suite"
          done

          echo "==> site tree:"
          find . -maxdepth 6 -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # TWO conditions, and both matter.
    #
    #   github.ref == main   — workflow_dispatch accepts any ref, so this stops
    #                          a scratch branch's copy of this workflow from
    #                          deploying.
    #   pool_ref == apt-pool — the pool is now an INPUT, so running on main is
    #                          no longer sufficient: a rehearsal dispatched as
    #                          `--ref main -f pool_ref=apt-pool-rehearsal`
    #                          would otherwise publish the rehearsal pool to
    #                          the live site. That is the whole point of
    #                          rehearsing, so guard it here.
    #
    # The build above still runs for every ref and every pool, which is the
    # useful half of a rehearsal: it proves the index builds, signs and verifies.
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.pool_ref || 'apt-pool') == 'apt-pool'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write     # publish the Pages deployment
      id-token: write  # OIDC token deploy-pages exchanges
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
