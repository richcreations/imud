# Static analysis via CodeQL — the axis the rest of CI does not cover.
#
# ci.yml is entirely DYNAMIC (ASan/UBSan, TSan, libFuzzer, hardening-check):
# it can only find bugs on paths the tests actually execute.  CodeQL reads
# the code instead, so it reaches the error paths and edge cases the suite
# never reaches.  Results land in the repo's Security → Code scanning tab.
#
# Requires a public repo (or GitHub Advanced Security on a private one).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach old code even in a quiet week.
    - cron: '43 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two languages, and they need opposite treatment: c-cpp has to be built for
  # CodeQL to see it, python must NOT be (build-mode: none) — so a matrix with
  # per-language build steps rather than one job doing both.
  #
  # The Python is not incidental: lib/imud_client.py is a SHIPPED public client,
  # the third independent copy of the wire format, and tools/check-*.py are what
  # ci.yml's version-consistency job runs to gate a release.  Both were
  # unanalysed while the C had two static analysers, CodeQL and six fuzzers.
  #
  # fail-fast: false — a finding in one language should not cancel the other
  # language's analysis before it uploads.
  analyze:
    name: Analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write  # upload the SARIF results
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpiod-dev libmosquitto-dev

      # build-mode: manual, not autobuild — `make` alone would miss the
      # bridges, which are deliberately outside the `all` target, and they
      # are half the C in the tree.
      # security-extended, NOT security-and-quality: the latter adds CodeQL's
      # maintainability queries (commented-out code, long functions, unused
      # statics, implicit conversions), which produced ~196 alerts on the
      # first run and buried the security findings.  security-extended keeps
      # the deeper security queries — the ones that matter for a daemon
      # parsing config files, JSON, wire packets and captures — without the
      # style backlog.  Switch back deliberately if you ever want a
      # maintainability sweep, and expect the noise again.
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build (daemon, utils, bridges)
        if: matrix.language == 'c-cpp'
        run: |
          make
          make bridges

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
