# Deep fuzzing on a schedule: one hour per harness (vs. 60 s on push),
# 4-way fork mode to use the whole runner, and the evolved corpus cached
# between nights so coverage compounds instead of restarting from the
# seeds.  Push CI keeps its fast smoke run; this is the one that digs.
#
# Note: GitHub pauses scheduled workflows after ~60 days without repo
# activity; the workflow_dispatch trigger allows manual runs any time.
name: Fuzz (nightly)

# Least-privilege token: reads the repo, uploads artifacts (no write scope
# needed; the corpus cache uses the actions scope, granted by default).
permissions:
  contents: read

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily (off the top-of-hour rush)
  workflow_dispatch:

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [config, json, packet, capture, wmm, cal, argv]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resume from the previous night's evolved corpus; fall back to the
      # committed seeds on first run or cache eviction.
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus-${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Build harness
        id: build
        run: |
          case "${{ matrix.target }}" in
            config)  DEPS="src/config.c src/log.c src/influx_line.c" ;;
            json)    DEPS="src/position.c src/wmm.c src/log.c" ;;
            packet)  DEPS="" ;;
            capture) DEPS="src/capture.c" ;;
            wmm)     DEPS="src/wmm.c src/log.c" ;;
            cal)     DEPS="src/cal.c src/imu_math.c src/log.c" ;;
            argv)    DEPS="src/cli.c" ;;
          esac
          # shellcheck disable=SC2086  # $DEPS is a deliberate word-split list
          clang -g -O1 -fsanitize=fuzzer,address,undefined \
                -D_GNU_SOURCE -DIMUD_CLIENT_ALLOW_DEPRECATED -Iinclude \
                fuzz/fuzz_${{ matrix.target }}.c $DEPS \
                -o fuzz_${{ matrix.target }} -lm

      - name: Fuzz (1 h, 4-way fork)
        id: fuzz
        run: |
          mkdir -p "corpus-${{ matrix.target }}"
          ./fuzz_${{ matrix.target }} \
              -fork=4 -max_total_time=3600 -timeout=10 -rss_limit_mb=1024 \
              -close_fd_mask=3 \
              "corpus-${{ matrix.target }}" "test/fuzz/corpus/${{ matrix.target }}"

      # Writes what actually went wrong, for `notify` to read.  A reclaimed
      # runner kills the job mid-step and runs nothing after it, so the file
      # exists only when a step genuinely failed — which is the distinction
      # job status alone cannot make.
      - name: Record the verdict
        if: failure()
        run: |
          mapfile -t repro < <(ls -1 crash-* timeout-* oom-* 2>/dev/null || true)
          {
            echo "target: ${{ matrix.target }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "fuzz: ${{ steps.fuzz.outcome }}"
            if [ ${#repro[@]} -gt 0 ]; then
              echo "reproducers:"
              printf '  %s\n' "${repro[@]}"
            else
              echo "reproducers: none"
            fi
            echo   # separates the blocks when notify cats them together
          } > "verdict-${{ matrix.target }}.txt"
          cat "verdict-${{ matrix.target }}.txt"

      - name: Save verdict and reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-nightly-failure-${{ matrix.target }}
          path: |
            verdict-${{ matrix.target }}.txt
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # A scheduled run that goes red is invisible: nobody is watching the
  # Actions tab at 06:17 UTC, and the reproducers expire with the artifact
  # retention window.  Raise an issue so a crash cannot be missed, reusing
  # one issue for consecutive failures rather than filing a new one nightly.
  #
  # Gate this on a verdict file, not on job status: a reclaimed runner fails
  # the job too, and filing on that alone raises an issue pointing at an
  # artifact that was never created.
  notify:
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read   # download-artifact reads this run's own artifacts
    steps:
      - name: Collect the verdicts
        continue-on-error: true   # no artifacts at all is the quiet case
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-nightly-failure-*
          path: verdicts

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job deliberately does not check out the repo, so gh has no
          # git remote to infer the repository from and every call fails with
          # "fatal: not a git repository".  GH_REPO supplies it directly.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `|| true` because the step runs under `bash -e` and the quiet
          # case is exactly the one where `verdicts/` was never created.
          summary=$(find verdicts -name 'verdict-*.txt' -exec cat {} + 2>/dev/null || true)
          if [ -z "$summary" ]; then
            echo "No verdict file: every failed job died before it could"
            echo "report one, which means a reclaimed runner or a"
            echo "cancellation rather than a finding.  Not filing."
            exit 0
          fi

          title="Nightly fuzz failure"
          body="A scheduled fuzz run failed. Verdicts and any reproducers are attached to \
          the run as \`fuzz-nightly-failure-<target>\` artifacts (they expire — download \
          them before then).

          \`\`\`
          $summary
          \`\`\`

          Run: $RUN_URL"

          existing=$(gh issue list --state open --search "\"$title\" in:title" \
                       --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$title" --body "$body"
          fi
