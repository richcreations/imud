# Promote a published GitHub Release into the apt pool.
#
# This is the automated half of what used to be a hand routine (download the
# debs from the draft release, sort 38 files into the pool by eye, commit,
# push).  The human gate did not go away — it MOVED: clicking "Publish" on the
# draft release is now the gate.  Nothing reaches users until you do that.
#
#   git tag v1.8 && git push --tags
#     → release.yml       builds 4× debs, opens a DRAFT release
#     → [you review, click Publish]            ← THE GATE
#     → apt-publish.yml   routes debs into the pool branch, prunes, commits
#     → apt-repo.yml      regenerates the signed index, deploys Pages
#
# THE POOL IS NOT ON MAIN.  It lives on the orphan branch `apt-pool` as a
# single root commit, rebuilt and force-pushed by this workflow every time.
# main therefore never accumulates binaries: the branch holds exactly today's
# pool and no history of it.  Pruned debs stay attached to their GitHub
# Release, which is now the only archive of them.
#
# To rehearse safely, run this by hand with a `pool_branch` other than
# apt-pool: it rebuilds that branch instead, and apt-repo.yml's deploy gate
# refuses to publish any pool but apt-pool, so the live site is untouched.
name: Publish to apt

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.8)'
        required: true
      pool_branch:
        description: 'Orphan branch to rebuild with the pool'
        default: apt-pool
      keep:
        description: 'How many upstream versions to keep per suite'
        default: '3'

permissions:
  contents: read

concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  publish:
    # Pre-releases are for testing; they never reach the apt pool.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # commit the pool change
      actions: write   # dispatch apt-repo.yml (see the last step)
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      POOL_BRANCH: ${{ inputs.pool_branch || 'apt-pool' }}
      KEEP: ${{ inputs.keep || '3' }}
    steps:
      # Check out the POOL branch, not main and not the release tag: the
      # existing pool is what we merge the new debs into and prune.  depth 1
      # is all there is — the branch is rebuilt as a single root commit each
      # time, so it has no history to fetch.
      #
      # A first run (or a fresh rehearsal branch) has nothing to check out, so
      # this is allowed to fail and the pool starts empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: pool
        continue-on-error: true
        with:
          ref: ${{ inputs.pool_branch || 'apt-pool' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start from an empty pool if the branch does not exist yet
        if: steps.pool.outcome == 'failure'
        run: |
          echo "::notice::$POOL_BRANCH does not exist yet — starting an empty pool"
          git init -q .
          mkdir -p pool

      - name: Download release .debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release download "$TAG" --pattern '*.deb' --dir incoming --repo "$GITHUB_REPOSITORY"
          echo "downloaded $(find incoming -name '*.deb' | wc -l) .deb file(s) from $TAG"

      - name: Route into the pool and prune old versions
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # NEVER trust a downloaded asset's filename.  GitHub sanitizes '~'
          # to '.' when a release asset is uploaded, so a package built as
          #   imud_1.6.2-1~bookworm1_arm64.deb
          # comes back from `gh release download` as
          #   imud_1.6.2-1.bookworm1_arm64.deb
          # The bytes are identical (verified by sha256 against the pool) —
          # only the name is mangled.  So read the real identity out of the
          # control file and rebuild the canonical Debian filename, which is
          # what the pool has held since 1.5.  Routing on the downloaded name
          # instead would fail to match every single deb.
          dropped=0
          added=0

          for f in incoming/*.deb; do
            [ -e "$f" ] || continue

            pkg="$(dpkg-deb -f "$f" Package)"
            ver="$(dpkg-deb -f "$f" Version)"
            arch="$(dpkg-deb -f "$f" Architecture)"

            # --- exclude automatic dbgsym packages ------------------------
            # debian/rules sets no --no-automatic-dbgsym, so dh_strip emits
            # one dbgsym .deb per binary package (8 per suite per arch, 32
            # per release) and they ride onto the Release as ordinary .deb
            # files.  Debian keeps debug symbols in a SEPARATE archive
            # (deb.debian.org/debian-debug) so the main archive is not
            # bloated by them; same policy here.  They stay attached to the
            # GitHub Release — that is where you fetch them from to
            # symbolize a crash report — and never enter the pool.
            case "$pkg" in
              *-dbgsym) rm -f "$f"; dropped=$((dropped + 1)); continue ;;
            esac

            # Catches "tagged v1.7 but debian/changelog still says 1.6.2".
            # Strip any epoch, then the Debian revision: 1:1.6.2-1~x → 1.6.2
            up="${ver#*:}"
            up="${up%%-*}"
            if [ "$up" != "$VERSION" ]; then
              echo "::error::$pkg has version '$ver' but tag $TAG implies '$VERSION'" >&2
              exit 1
            fi

            # The ~<suite>1 suffix comes from build-debs.yml's `dch --local`.
            case "$ver" in
              *~bookworm1) suite=bookworm ;;
              *~trixie1)   suite=trixie ;;
              *)
                echo "::error::cannot route $pkg $ver — no ~bookworm1/~trixie1 suffix" >&2
                exit 1
                ;;
            esac

            # Canonical pool name.  An epoch is written %3a per Debian
            # convention; imud has never used one, but the encoding is a
            # single substitution and getting it wrong would be silent.
            base="${pkg}_${ver//:/%3a}_${arch}.deb"

            mkdir -p "pool/$suite"
            cp "$f" "pool/$suite/$base"
            added=$((added + 1))
          done

          echo "dbgsym packages excluded from the pool: $dropped"
          echo "debs added to the pool: $added"

          if [ "$added" -eq 0 ]; then
            echo "::error::$TAG carried no publishable .debs — nothing to do" >&2
            exit 1
          fi

          # Pool filenames are canonical (written just above), so field 2
          # split on '_' — minus any epoch, truncated at the first '-' — is
          # the upstream version.  Debian package names cannot contain '_'.
          deb_version() {
            local n="${1##*/}"
            n="${n#*_}"; n="${n%%_*}"; n="${n#*%3a}"
            printf '%s' "${n%%-*}"
          }

          # --- prune to the newest $KEEP upstream versions per suite ------
          # The pool branch is rebuilt as a single root commit, so this is no
          # longer about git history growing — it bounds the Pages payload and
          # the size of the generated apt index instead.  Anyone pinned to a
          # pruned version loses their install source: that is the deliberate
          # trade, and their debs are still on the GitHub Release, which is
          # now the ONLY archive of them.
          shopt -s nullglob
          for suite in bookworm trixie; do
            pool=("pool/$suite"/*.deb)
            [ "${#pool[@]}" -gt 0 ] || continue

            versions=""
            for f in "${pool[@]}"; do
              versions="$versions$(deb_version "$f")"$'\n'
            done
            keep="$(printf '%s' "$versions" | sort -u -V | tail -n "$KEEP")"
            echo "$suite: keeping $(printf '%s' "$keep" | tr '\n' ' ')"

            for f in "${pool[@]}"; do
              v="$(deb_version "$f")"
              if ! printf '%s\n' "$keep" | grep -qxF "$v"; then
                rm -f "$f"
                echo "  pruned ${f##*/}"
              fi
            done
          done

      # Rebuild the branch as a single ROOT commit and force-push it.  Not a
      # normal commit on top: that would accumulate ~1.5 MB of deb blobs per
      # release forever, which is exactly the problem moving the pool off main
      # was meant to solve — it would just relocate the growth.  This way the
      # branch holds today's pool and nothing else, permanently bounded.
      #
      # Nothing to rebase against: the `apt-publish` concurrency group
      # serialises this workflow, and no human commits to the pool branch.
      - name: Rebuild the pool branch and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(find pool -name '*.deb' | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::pool ended up empty — refusing to push" >&2
            exit 1
          fi
          echo "pool now holds $n .deb file(s)"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the directories present even when a suite has no packages.
          for suite in bookworm trixie; do
            mkdir -p "pool/$suite" && touch "pool/$suite/.gitkeep"
          done

          git checkout -q --orphan rebuilt
          git rm -rq --cached . 2>/dev/null || true
          git add -A pool
          git commit -qm "apt pool @ ${TAG#v}"

          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$POOL_BRANCH"

      # REQUIRED, not belt-and-braces: a push made with GITHUB_TOKEN does
      # not trigger other workflows, so apt-repo.yml's `push` trigger will
      # NOT fire for the commit above.  workflow_dispatch is the documented
      # exception that does work with GITHUB_TOKEN — hence this explicit
      # kick.  Run unconditionally so re-running this workflow is also a
      # way to force an index rebuild.
      #
      # --ref is ALWAYS main, never the pool branch: apt-repo.yml's deploy
      # gate keys off github.ref, so dispatching the pool branch would build
      # the index and then silently skip deployment.  Which pool to read is
      # passed as an input instead — and that input is the other half of the
      # gate, so a rehearsal builds but does not publish.
      - name: Trigger the signed index rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run apt-repo.yml \
             --ref main \
             -f pool_ref="$POOL_BRANCH" \
             --repo "$GITHUB_REPOSITORY"
