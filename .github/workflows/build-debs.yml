# Reusable .deb build: arm64 + armhf × bookworm + trixie.
#
# Called by ci.yml (rot-detection on every push, lintian advisory) and by
# release.yml (on a version tag, artifacts feed the GitHub Release).  It
# lives in one file so the two callers cannot drift — they did before, and
# the release workflow carried a stale "amd64 + arm64" comment for it.
#
# Binary-only builds: the source-package/orig dance is a Debian-archive
# concern, not a GitHub-release one.  arm64 + armhf only — the daemon needs
# I2C hardware and the bridges live on the daemon's machine, so amd64 debs
# have no real audience (an x86 imud-mon user builds from source; amd64
# COMPILATION is still covered by ci.yml's build-and-test and the
# sanitizer/fuzz jobs).  armhf serves 32-bit Raspberry Pi OS (ARMv7, Pi 2
# and later).  The bookworm build doubles as continuous coverage of the
# libgpiod v1 API path (bookworm ships 1.6; trixie ships 2.x — the Makefile
# auto-detects).
#
# The containers are driven with explicit `docker run` instead of the
# workflow `container:` key: GitHub's arm runners (Neoverse N2) execute
# armhf natively (AArch32 at EL0, no QEMU), but `container:` mounts the
# runner's arm64 node binary into the container for JS actions like
# checkout, and that binary cannot run in an armhf rootfs.  So checkout and
# artifact upload happen on the host; only the build runs inside.
name: build-debs

on:
  workflow_call:
    inputs:
      lintian:
        description: 'Run lintian after the build (advisory, never fails the job)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  debs:
    strategy:
      # One bad CDN node must not cost the other three legs.  At v1.8.2 a
      # truncated download in bookworm/arm64 cancelled the remaining three
      # 20 seconds in, so a re-run had to redo all four; with fail-fast off a
      # flake costs one job and `gh run rerun --failed` redoes only that one.
      fail-fast: false
      matrix:
        dist: [bookworm, trixie]
        arch: [arm64, armhf]
        include:
          - arch: arm64
            platform: linux/arm64
            binary_flag: -b   # arch-dep + arch:all (imud-wmm-data)
          - arch: armhf
            platform: linux/arm/v7
            binary_flag: -B   # arch-dep only: arch:all is built once, on arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      # persist-credentials: false — the workspace is bind-mounted into a
      # container that apt-gets from the network; no token belongs in
      # .git/config for that.  Nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Suffix the version per distribution (1.5-1~bookworm1) so packages
      # for different dists never collide as filenames/release assets, and
      # dpkg orders upgrades correctly (~ sorts before the bare revision;
      # bookworm < trixie alphabetically matches the upgrade path).  The
      # arch needs no suffix: it is already in the .deb filename.
      #
      # apt-publish.yml routes debs into the pool by this exact ~<dist>1
      # suffix, so changing the dch --local string breaks publishing.
      - name: Build packages (${{ matrix.dist }}/${{ matrix.arch }})
        env:
          LINTIAN: ${{ inputs.lintian }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$GITHUB_WORKSPACE:/work/src" -w /work/src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEBEMAIL=richcreations@gmail.com \
            -e "DEBFULLNAME=Richard Simpson" \
            -e "LINTIAN=$LINTIAN" \
            debian:${{ matrix.dist }} bash -euo pipefail -c '
              # Two different fetch failures, two different mitigations, and
              # they are NOT interchangeable.
              #
              # Acquire::Retries covers CONNECTION-level failure — refused,
              # timed out.  Measured against a dead port: Retries=0 makes one
              # attempt, Retries=3 makes three.  Same config devbox carries.
              printf "%s\n" "Acquire::Retries \"5\";" \
                            "Acquire::http::Timeout \"60\";" \
                            "Acquire::https::Timeout \"60\";" \
                  > /etc/apt/apt.conf.d/99retries

              # It does NOT cover what broke the v1.8.2 release build, which
              # was a COMPLETED transfer of the wrong bytes: deb.debian.org
              # served a 22 KB truncation of a 1 MB font package, and apt said
              # "File has unexpected size (22732 != 1067728). Mirror sync in
              # progress?" then exited 100.  apt treats a size/hash mismatch as
              # a corrupt mirror rather than a transient error, so Retries never
              # engages — reproduced with a deliberately truncated .deb, and
              # Retries=5 and Retries=0 both issue exactly ONE GET.
              #
              # A fresh apt-get DOES issue a new request (3 GETs across 3
              # invocations, same test), and a new request is what can reach a
              # different CDN edge.  So the retry that matters has to be out
              # here, around the whole command.
              apt_retry() {
                  for i in 1 2 3; do
                      "$@" && return 0
                      echo "apt attempt $i failed; retrying in $((i * 10))s" >&2
                      sleep $((i * 10))
                  done
                  return 1
              }
              apt_retry apt-get update
              # devscripts is for dch below — CI tooling, not a build
              # dependency of the package, so it is named here.
              apt_retry apt-get install -y devscripts
              # The build dependencies themselves come from debian/control, and
              # are deliberately NOT restated here.  They used to be, and the
              # copy drifted: `docs: ship the manual as an Info page` added
              # texinfo to Build-Depends for debian/imud.info, this list was
              # not touched, and all four matrix legs died in
              # dpkg-checkbuilddeps before compiling a line.  Nothing compared
              # the two, because there was nothing to compare — one of them was
              # a hand copy.  build-dep also pulls build-essential.
              apt_retry apt-get build-dep -y ./
              if [ "$LINTIAN" = "true" ]; then apt_retry apt-get install -y lintian; fi
              dch --local "~${{ matrix.dist }}" \
                  "Automated CI build for Debian ${{ matrix.dist }}."
              dpkg-buildpackage -us -uc ${{ matrix.binary_flag }}
              # Advisory only: lintian findings gate archive submission, not CI.
              if [ "$LINTIAN" = "true" ]; then lintian --info ../*.changes || true; fi
              mkdir -p dist-debs && mv ../*.deb dist-debs/
            '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debs-${{ matrix.dist }}-${{ matrix.arch }}
          path: dist-debs/*.deb
