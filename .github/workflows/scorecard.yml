# OpenSSF Scorecard: an outside assessment of this repository's supply-chain
# posture (branch protection, token permissions, pinned dependencies, signed
# releases, fuzzing, SAST, ...).  Findings land in the Security tab like any
# other code-scanning result, and the badge in README.md reflects the latest
# score.
#
# It grades the REPOSITORY, not the C code — think of it as lint for the
# things ci.yml cannot see.  Expect it to have opinions about unpinned
# action tags; that is a deliberate choice, documented in dependabot.yml.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '19 5 * * 2'   # weekly, Tuesday 05:19 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write  # publish the signed result for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every action in this repo is SHA-pinned (see .github/dependabot.yml).
      # Worth knowing about this one specifically: ossf/scorecard-action
      # publishes NO floating major tag, so if you ever unpin it, `@v2` will
      # not resolve — it needs an exact vX.Y.Z.  Verify any new action ref
      # with `git ls-remote --tags --refs https://github.com/<repo>` rather
      # than assuming a major tag exists.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishes the result so the README badge can resolve it. Requires
          # a public repo; harmless to leave on, the step just no-ops if not.
          publish_results: true

      # The SARIF is kept as a downloadable artifact, but deliberately NOT
      # uploaded to code scanning.  Doing so put 158 Scorecard rows into the
      # Security tab alongside CodeQL's — 154 of them a single check,
      # Binary-Artifacts, firing once per committed .deb in apt/pool/, and it
      # buried the 20 real CodeQL findings at 8:1.
      #
      # That finding is now FIXED rather than merely noisy: the pool moved to
      # the orphan `apt-pool` branch, so the default branch carries no
      # binaries and Binary-Artifacts scores 10.  The upload stays off anyway
      # — posture results belong on the badge and the scorecard.dev viewer,
      # and the Security tab should stay a queue of actual code defects.
      #
      # Scorecard's posture results belong on the README badge and the
      # scorecard.dev viewer, which publish_results above still feeds.  The
      # Security tab stays a queue of actual code defects.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5
