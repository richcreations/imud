# OpenSSF Scorecard: an outside assessment of this repository's supply-chain
# posture (branch protection, token permissions, pinned dependencies, signed
# releases, fuzzing, SAST, ...).  Findings land in the Security tab like any
# other code-scanning result, and the badge in README.md reflects the latest
# score.
#
# It grades the REPOSITORY, not the C code — think of it as lint for the
# things ci.yml cannot see.  Expect it to have opinions about unpinned
# action tags; that is a deliberate choice, documented in dependabot.yml.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '19 5 * * 2'   # weekly, Tuesday 05:19 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write  # publish the signed result for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to an EXACT version on purpose: unlike actions/* and
      # github/*, ossf/scorecard-action publishes no floating major tag, so
      # `@v2` does not resolve.  Dependabot bumps this line like any other.
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishes the result so the README badge can resolve it. Requires
          # a public repo; harmless to leave on, the step just no-ops if not.
          publish_results: true

      # The SARIF is kept as a downloadable artifact, but deliberately NOT
      # uploaded to code scanning.  Doing so put 158 Scorecard rows into the
      # Security tab alongside CodeQL's — 154 of them a single check,
      # Binary-Artifacts, firing once per committed .deb in apt/pool/.  Those
      # debs ARE the apt repository; the finding is correct-by-design and
      # unfixable, and it buried the 20 real CodeQL findings at 8:1.
      #
      # Scorecard's posture results belong on the README badge and the
      # scorecard.dev viewer, which publish_results above still feeds.  The
      # Security tab stays a queue of actual code defects.
      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5
