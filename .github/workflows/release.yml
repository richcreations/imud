# Release pipeline: on a version tag, build the .debs for amd64 + arm64 and
# the dist tarball, then open a DRAFT GitHub release with everything
# attached — the maintainer reviews and publishes it by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Same docker-run container build as ci.yml's debs job (see the comments
  # there for why `container:` cannot host the armhf image): bookworm +
  # trixie × arm64 + armhf, so the release carries installable packages
  # for stock Raspberry Pi OS (bookworm, 64- and 32-bit) and current
  # Debian (trixie).  armhf builds pass -B so the arch:all imud-wmm-data
  # deb is built exactly once per dist, on arm64.
  debs:
    strategy:
      matrix:
        dist: [bookworm, trixie]
        arch: [arm64, armhf]
        include:
          - arch: arm64
            platform: linux/arm64
            binary_flag: -b
          - arch: armhf
            platform: linux/arm/v7
            binary_flag: -B
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Suffix the version per distribution (1.5-1~bookworm1) so packages
      # for different dists never collide as filenames/release assets, and
      # dpkg orders upgrades correctly (~ sorts before the bare revision;
      # bookworm < trixie alphabetically matches the upgrade path).
      - name: Build packages (${{ matrix.dist }}/${{ matrix.arch }})
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$GITHUB_WORKSPACE:/work/src" -w /work/src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e DEBEMAIL=richcreations@gmail.com \
            -e "DEBFULLNAME=Richard Simpson" \
            debian:${{ matrix.dist }} bash -euo pipefail -c '
              apt-get update
              apt-get install -y build-essential debhelper devscripts \
                                 pkgconf libgpiod-dev libmosquitto-dev
              dch --local "~${{ matrix.dist }}" \
                  "Automated CI build for Debian ${{ matrix.dist }}."
              dpkg-buildpackage -us -uc ${{ matrix.binary_flag }}
              mkdir -p dist-debs && mv ../*.deb dist-debs/
            '

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.dist }}-${{ matrix.arch }}
          path: dist-debs/*.deb

  release:
    needs: debs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist tarball
        run: make dist

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
             --title "imud $GITHUB_REF_NAME" \
             --notes "Draft — see the NEWS file for user-visible changes." \
             imud-*.tar.gz artifacts/*.deb
