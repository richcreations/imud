# Release pipeline: on a version tag, build the .debs (arm64 + armhf ×
# bookworm + trixie, via the reusable build-debs workflow) and the dist
# tarball, then open a DRAFT GitHub release with everything attached — the
# maintainer reviews and publishes it by hand.
#
# Publishing the draft is the gate: it fires apt-publish.yml, which routes
# the packages into apt/pool/ and triggers the signed index rebuild.
name: Release

on:
  push:
    tags: ['v*']

# Least-privilege default; only the release job widens, and only for itself.
permissions:
  contents: read

jobs:
  # Fail in seconds rather than after 45 minutes of arm container builds if
  # the tag and the canonical version disagree.  ci.yml checks that
  # version.h agrees with the changelogs and man pages; this is the one
  # check that can only happen at tag time.
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read      # read ci.yml's run history for this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches include/version.h
        run: |
          ver=$(sed -n 's/^#define IMUD_VERSION_STR *"\(.*\)"/\1/p' include/version.h)
          tag=${GITHUB_REF_NAME#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version '$tag' but include/version.h says '$ver'" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches include/version.h ($ver)"

      # A tag is not evidence that anything passed.  ci.yml triggers on pushes
      # to main, this workflow triggers on tags, and nothing joined the two: a
      # tag placed on a commit whose CI went red still built 32 .debs and
      # opened a draft release, and the only thing standing between that and
      # the apt pool was the maintainer remembering.  GitHub has no
      # cross-workflow `needs:`, so ask the API instead.
      #
      # docs/RELEASING.md step 4 already says to tag only once CI is green.
      # This makes that step mechanical rather than remembered.
      #
      # Tags do not match ci.yml's `push: branches: [main]`, so the run found
      # here is always the main-push run for this commit, never a run of this
      # workflow.
      - name: CI is green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh api \
                  "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
                  --jq '.workflow_runs | sort_by(.run_started_at) | last // empty')
          if [ -z "$run" ]; then
            echo "::error::no CI run exists for $SHA — push the commit to main and let CI finish before tagging" >&2
            exit 1
          fi

          status=$(printf '%s' "$run" | jq -r '.status')
          concl=$(printf '%s' "$run" | jq -r '.conclusion')
          url=$(printf '%s' "$run" | jq -r '.html_url')
          echo "CI run for $SHA: status=$status conclusion=$concl"
          echo "$url"

          # Three distinct failure modes, named separately: "never ran",
          # "still running" and "failed" need different things from the
          # maintainer, and a single "CI not green" would hide which.
          if [ "$status" != "completed" ]; then
            echo "::error::CI is still '$status' for $SHA — wait for it to finish, then re-run this workflow" >&2
            exit 1
          fi
          if [ "$concl" != "success" ]; then
            echo "::error::CI concluded '$concl' for $SHA — fix it and move the tag; see $url" >&2
            exit 1
          fi
          echo "CI is green on $SHA"

  debs:
    needs: check-tag
    uses: ./.github/workflows/build-debs.yml

  release:
    needs: debs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # gh release create
      attestations: write  # record build provenance
      id-token: write      # sign the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build dist tarball
        run: make dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Signed, verifiable provenance for every published artifact:
      #   gh attestation verify <file> --repo <owner>/imud
      # Complements the GPG-signed apt index — that proves the index came
      # from the maintainer; this proves each deb came from this workflow
      # at this commit.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            imud-*.tar.gz
            artifacts/*.deb

      # The step above records the attestation in GitHub's attestation store,
      # which is what `gh attestation verify` reads.  Nothing that sees only
      # the release can find it there — including OpenSSF Scorecard's
      # Signed-Releases check, which looks for a *.intoto.jsonl (or *.asc /
      # *.sig) release ASSET and scored this project 0 while the provenance
      # existed the whole time.  Attach the same bundle as an asset: identical
      # bytes, second delivery route, verifiable offline with
      #   gh attestation verify <file> --bundle imud-X.Y.intoto.jsonl
      - name: Attach the provenance bundle to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          bundle=$BUNDLE
          if [ -z "$bundle" ] || [ ! -s "$bundle" ]; then
            echo "::error::attest-build-provenance produced no bundle" >&2
            exit 1
          fi
          cp "$bundle" "imud-${GITHUB_REF_NAME#v}.intoto.jsonl"

      # Draft, not published: the maintainer reviews, writes the notes, and
      # publishes — and that publish is what promotes these debs to apt.
      # Automatic dbgsym packages ride along as release assets (useful for
      # symbolizing a crash report); apt-publish.yml filters them out of
      # the apt pool, matching Debian's separate debian-debug archive.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
             --title "imud $GITHUB_REF_NAME" \
             --notes "Draft — see the NEWS file for user-visible changes." \
             imud-*.tar.gz imud-*.intoto.jsonl artifacts/*.deb
