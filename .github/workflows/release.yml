# Release pipeline: on a version tag, build the .debs for amd64 + arm64 and
# the dist tarball, then open a DRAFT GitHub release with everything
# attached — the maintainer reviews and publishes it by hand.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Same container build as ci.yml's debs job: bookworm + trixie on both
  # architectures, so the release carries installable packages for stock
  # Raspberry Pi OS (bookworm) and current Debian (trixie).
  debs:
    strategy:
      matrix:
        dist: [bookworm, trixie]
    # arm64 only: the daemon needs I2C hardware and the bridges live on the
    # daemon's machine, so amd64 debs have no real audience (an x86 imud-mon
    # user builds from source).  amd64 COMPILATION is still covered by
    # build-and-test + the sanitizer/fuzz jobs.
    runs-on: ubuntu-24.04-arm
    container: debian:${{ matrix.dist }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper devscripts lintian \
                             pkgconf libgpiod-dev libmosquitto-dev

      # Suffix the version per distribution (1.5-1~bookworm1) so packages
      # for different dists never collide as filenames/release assets, and
      # dpkg orders upgrades correctly (~ sorts before the bare revision;
      # bookworm < trixie alphabetically matches the upgrade path).
      - name: Stamp distribution into the version
        env:
          DEBEMAIL: richcreations@gmail.com
          DEBFULLNAME: Richard Simpson
        run: |
          dch --local "~${{ matrix.dist }}" \
              "Automated CI build for Debian ${{ matrix.dist }}."

      - name: Build packages
        run: dpkg-buildpackage -us -uc -b

      - name: Collect packages
        run: mkdir -p dist-debs && mv ../*.deb dist-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.dist }}-${{ runner.arch }}
          path: dist-debs/*.deb

  release:
    needs: debs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist tarball
        run: make dist

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
             --title "imud $GITHUB_REF_NAME" \
             --notes "Draft — see the NEWS file for user-visible changes." \
             imud-*.tar.gz artifacts/*.deb
