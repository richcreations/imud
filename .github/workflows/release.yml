# Release pipeline: on a version tag, build the .debs (arm64 + armhf ×
# bookworm + trixie, via the reusable build-debs workflow) and the dist
# tarball, then open a DRAFT GitHub release with everything attached — the
# maintainer reviews and publishes it by hand.
#
# Publishing the draft is the gate: it fires apt-publish.yml, which routes
# the packages into apt/pool/ and triggers the signed index rebuild.
name: Release

on:
  push:
    tags: ['v*']

# Least-privilege default; only the release job widens, and only for itself.
permissions:
  contents: read

jobs:
  # Fail in seconds rather than after 45 minutes of arm container builds if
  # the tag and the canonical version disagree.  ci.yml checks that
  # version.h agrees with the changelogs and man pages; this is the one
  # check that can only happen at tag time.
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches include/version.h
        run: |
          ver=$(sed -n 's/^#define IMUD_VERSION_STR *"\(.*\)"/\1/p' include/version.h)
          tag=${GITHUB_REF_NAME#v}
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version '$tag' but include/version.h says '$ver'" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches include/version.h ($ver)"

  debs:
    needs: check-tag
    uses: ./.github/workflows/build-debs.yml

  release:
    needs: debs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # gh release create
      attestations: write  # record build provenance
      id-token: write      # sign the provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build dist tarball
        run: make dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Signed, verifiable provenance for every published artifact:
      #   gh attestation verify <file> --repo <owner>/imud
      # Complements the GPG-signed apt index — that proves the index came
      # from the maintainer; this proves each deb came from this workflow
      # at this commit.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            imud-*.tar.gz
            artifacts/*.deb

      # The step above records the attestation in GitHub's attestation store,
      # which is what `gh attestation verify` reads.  Nothing that sees only
      # the release can find it there — including OpenSSF Scorecard's
      # Signed-Releases check, which looks for a *.intoto.jsonl (or *.asc /
      # *.sig) release ASSET and scored this project 0 while the provenance
      # existed the whole time.  Attach the same bundle as an asset: identical
      # bytes, second delivery route, verifiable offline with
      #   gh attestation verify <file> --bundle imud-X.Y.intoto.jsonl
      - name: Attach the provenance bundle to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          bundle=$BUNDLE
          if [ -z "$bundle" ] || [ ! -s "$bundle" ]; then
            echo "::error::attest-build-provenance produced no bundle" >&2
            exit 1
          fi
          cp "$bundle" "imud-${GITHUB_REF_NAME#v}.intoto.jsonl"

      # Draft, not published: the maintainer reviews, writes the notes, and
      # publishes — and that publish is what promotes these debs to apt.
      # Automatic dbgsym packages ride along as release assets (useful for
      # symbolizing a crash report); apt-publish.yml filters them out of
      # the apt pool, matching Debian's separate debian-debug archive.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
             --title "imud $GITHUB_REF_NAME" \
             --notes "Draft — see the NEWS file for user-visible changes." \
             imud-*.tar.gz imud-*.intoto.jsonl artifacts/*.deb
