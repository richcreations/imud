name: CI

# Least-privilege token: every job only reads the repo (artifact upload
# does not need contents:write).
permissions:
  contents: read

# push is filtered to main: without the filter a same-repo PR branch runs
# the whole suite twice per push (once for push, once for pull_request).
on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are pointless and this workflow is expensive (four
# containerised arm deb builds among ~10 jobs), so cancel the previous run
# for a ref when a new commit lands on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `run:` steps get bash everywhere, containers included.
#
# On a host runner GitHub defaults to bash; inside a `container:` it defaults to
# sh, and Debian's sh is dash.  Moving the gates into containers therefore
# re-interpreted every existing step under a different shell — arrays,
# `set -o pipefail` and `<(...)` all stop being syntax.  The first run after the
# move failed nine jobs on exactly that, with dash reporting
# `Syntax error: "(" unexpected`.
#
# Pinning the shell here keeps a step's meaning independent of where it runs,
# which is what makes moving a job between host and container safe.  bash is
# Essential in Debian, so it is present in every image used below.
defaults:
  run:
    shell: bash

jobs:
  # The Debian base digests, read out of devbox/Dockerfile and published as
  # outputs.
  #
  # devbox/Dockerfile is the ONLY place a digest is written, because it is the
  # only place Dependabot can maintain one: its docker ecosystem reads FROM
  # lines, and a `container:` image or a `docker run` argument in a workflow is
  # invisible to it.  Hard-coding the digests here as well would mean every
  # Dependabot bump landed half-applied and had to be finished by hand — so a
  # routine base bump would stop being a merge and start being a chore.
  #
  # Deriving them instead costs one ~10 s job that every containerised gate
  # waits on, and makes a Dependabot PR merge and simply work.
  bases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bookworm: ${{ steps.pins.outputs.bookworm }}
      trixie: ${{ steps.pins.outputs.trixie }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned bases from devbox/Dockerfile
        id: pins
        run: |
          set -euo pipefail
          for d in bookworm trixie; do
            digest=$(sed -n "s|^FROM debian:$d@\(sha256:[0-9a-f]\{64\}\).*|\1|p" \
                         devbox/Dockerfile | head -1)
            if [ -z "$digest" ]; then
              echo "::error file=devbox/Dockerfile::no pinned digest for debian:$d" >&2
              exit 1
            fi
            echo "$d=$digest" >> "$GITHUB_OUTPUT"
            echo "debian:$d -> $digest"
          done

  # The canonical version lives in include/version.h and everything else is
  # hand-propagated across ~28 files at release time (docs/RELEASING.md).
  # This is the guard that catches a half-finished bump before it is tagged.
  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version strings agree with include/version.h
        run: |
          ver=$(sed -n 's/^#define IMUD_VERSION_STR *"\(.*\)"/\1/p' include/version.h)
          [ -n "$ver" ] || { echo "::error::cannot parse include/version.h" >&2; exit 1; }
          echo "include/version.h = $ver"
          rc=0

          # debian/changelog drives the .deb version; packaging/README
          # requires it to match version.h at release time.  Strip the
          # Debian revision (1.7-1 -> 1.7).
          deb=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
          if [ "${deb%%-*}" != "$ver" ]; then
            echo "::error file=debian/changelog::head stanza is '$deb', expected upstream version '$ver'" >&2
            rc=1
          fi

          # The core package always changes in a release, so its changelog
          # must be current.  Bridges only get a stanza when they change
          # (docs/RELEASING.md), so they may legitimately lag — they must
          # merely never be AHEAD of version.h.  imud-wmm-data is exempt:
          # it tracks the WMM epoch (2025.0), not the imud version.
          core=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' packaging/imud/changelog)
          if [ "$core" != "$ver" ]; then
            echo "::error file=packaging/imud/changelog::head stanza is '$core', expected '$ver'" >&2
            rc=1
          fi
          for f in packaging/*/changelog; do
            case "$f" in */imud-wmm-data/*) continue ;; esac
            v=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' "$f")
            if ! dpkg --compare-versions "$v" le "$ver"; then
              echo "::error file=$f::head stanza '$v' is ahead of include/version.h ($ver)" >&2
              rc=1
            fi
          done

          # Every man page footer must name this release ('\" t preambles
          # mean .TH is not always line 1, so grep rather than head -1).
          # man3/man5 only: the man1/man8 pages are generated by help2man
          # and stamped from include/version.h by tools/man-postprocess.py, so
          # a stale .TH there IS a stale regeneration — which the
          # check-generated-man step in build-and-test catches instead.
          for f in man/man3/*.3 man/man5/*.5; do
            th=$(grep -m1 '^\.TH' "$f" | sed 's/.*"\(imud [0-9][0-9.]*\)".*/\1/')
            if [ "$th" != "imud $ver" ]; then
              echo "::error file=$f::.TH says '$th', expected 'imud $ver'" >&2
              rc=1
            fi
          done

          [ "$rc" -eq 0 ] && echo "all version strings agree ($ver)"
          exit "$rc"

      # The wire revision is a different number from the release version and
      # moves on a different schedule, so the check above does not cover it.
      # Three copies exist because the two client libraries are standalone by
      # design; a consumer reading a stale one silently rejects every packet.
      - name: Wire revision agrees across the C and Python clients
        run: |
          h=$(sed -n 's/^#define IMUD_VERSION  *\([0-9][0-9]*\).*/\1/p' include/types.h)
          c=$(sed -n 's/^#define IMUD_VERSION  *\([0-9][0-9]*\).*/\1/p' lib/imud_client.h)
          p=$(sed -n 's/^IMUD_VERSION *= *\([0-9][0-9]*\).*/\1/p' lib/imud_client.py)
          echo "types.h=$h imud_client.h=$c imud_client.py=$p"
          for v in "$h" "$c" "$p"; do
            [ -n "$v" ] || { echo "::error::a wire revision could not be parsed" >&2; exit 1; }
          done
          if [ "$h" != "$c" ] || [ "$h" != "$p" ]; then
            echo "::error::IMUD_VERSION disagrees: types.h=$h imud_client.h=$c imud_client.py=$p" >&2
            exit 1
          fi
          echo "wire revision $h agrees across all three"

      # The same bug turned up twice: a key that parses and works but
      # never reached the shipped template or the bridge manual.  Nothing
      # checked it, so nothing complained.
      - name: Every parsed config key reached its docs
        run: make check-docs

      # A real defect once: the shipped config named a gpiochip the shipped
      # unit forbade, so no combination of the two was correct on any board.
      # systemd-analyze verify passes either way — the mismatch only bites at
      # device-open time on real hardware, which no CI job has.
      - name: Every configured device node is allowed by the unit
        run: make check-devices

      # Same reasoning as the wire revision above, one field over: four
      # independent copies of the flags word. A drifted flag fails quietly —
      # the packet still parses and the wrong bit is read under the right
      # name — which is indistinguishable from a sensor misreporting.
      - name: Packet flag bits agree across all four definitions
        run: make check-flags

      # check-docs above proves a config key REACHED its surfaces.  These nine
      # prove the surfaces are telling the truth: spec.md's wire table against
      # include/types.h, the driver rate lists against the ops structs, the
      # MQTT topic tree against the publisher, every --help flag against the
      # parser that accepts it, every link against what `make install` lays
      # down.  Run against the tree before this change they found 81
      # disagreements — including a spec.md packet table three wire revisions
      # stale and seven tools whose --help was undocumented.  Text only; this
      # job compiles nothing.
      - name: Documentation agrees with the code it documents
        run: make check-generated-text

      # The man-page list lives in $(MAN_ALL) for the Makefile's install and
      # uninstall rules, and a third time in debian/*.install, which cannot
      # read a make variable: dh_install reads it from the source package
      # before any Makefile runs.  Nothing else compares the two — the mandoc
      # lint and the .TH check both glob man/, so a page that is written,
      # linted, versioned and installed by nothing passes both.
      - name: Makefile and Debian install the same man pages
        run: make check-manpages

      # And the checkers themselves: each is a regex over source, so one that
      # has quietly stopped matching is indistinguishable from a clean tree.
      # This breaks one fact at a time in a copy of the tree and asserts the
      # relevant checker notices.
      - name: The documentation checkers still detect drift
        run: make test-tools

      # Size of the tree, by role rather than by language, into the run summary
      # — visible per-run without downloading anything.  A REPORT, not a gate:
      # the tool exits non-zero only on its own structural errors (a category
      # matching nothing, or files unaccounted for), never on the numbers, so
      # this can tell you the suite shrank without being able to veto it.  Same
      # reasoning as the coverage job's deliberate lack of a threshold.
      - name: Line count
        run: python3 tools/loc.py --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # The sign-off is a contributor's legal assertion that they may submit the
  # code (CONTRIBUTING.md#developer-certificate-of-origin), so an unsigned
  # commit is not mergeable.  A DCO that nothing checks drifts to fiction
  # within a release, which is why this is a gate and not a report.
  #
  # Pull requests only: a push has no base..head range to walk, and the
  # sign-off is about accepting code from someone else in the first place.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — the default shallow clone has no history to diff the
      # base against, and a deep PR would silently walk a truncated range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          n=0
          # --no-merges: a merge commit contributes no code of its own, and
          # demanding a sign-off on one only teaches people to forge them.
          while read -r sha; do
            [ -n "$sha" ] || continue
            n=$((n + 1))
            name=$(git show -s --format='%an' "$sha")
            email=$(git show -s --format='%ae' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            signoff=$(git show -s --format='%B' "$sha" \
              | grep -iE '^Signed-off-by: .+ <.+@.+>' || true)

            if [ -z "$signoff" ]; then
              echo "::error::$sha (\"$subject\") has no Signed-off-by line — rerun with 'git commit -s --amend', or 'git rebase --signoff $BASE' for a branch" >&2
              rc=1
            elif ! printf '%s\n' "$signoff" | grep -qiF "$name" \
              && ! printf '%s\n' "$signoff" | grep -qiF "$email"; then
              # Name OR email is enough.  Requiring both is a false-positive
              # machine: Dependabot authors from a noreply address and signs
              # off from another, and humans legitimately sign a work commit
              # with a personal address.  Neither matching is the real smell,
              # and even that only annotates — a patch forwarded on someone
              # else's behalf is exactly what DCO clause (c) is for.
              echo "::warning::$sha is authored by $name <$email> but signed off by someone else"
            fi
          done < <(git rev-list --no-merges "$BASE".."$HEAD")

          echo "checked $n non-merge commit(s)"
          exit "$rc"

  # Runs on amd64 and arm64: the target hardware is a Raspberry Pi, so the
  # packed wire struct and the full test suite must prove out on arm.
  # Three legs, not two.  amd64 and arm64 cover the architectures; bookworm
  # covers the libgpiod **v1** API path, which `GPIOD_V2` guards at four sites
  # in src/imu.c and which no job ran the suite against before — bookworm's
  # debs were built and installed, but never tested.  trixie ships libgpiod 2.x
  # and so does Ubuntu, so every green run used to be evidence about v2 only.
  build-and-test:
    needs: bases
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            dist: trixie
          - runner: ubuntu-24.04-arm
            dist: trixie
          - runner: ubuntu-latest
            dist: bookworm
    runs-on: ${{ matrix.runner }}
    container:
      # Indexed by the leg's dist, so the digests stay in devbox/Dockerfile.
      image: debian:${{ matrix.dist }}@${{ needs.bases.outputs[matrix.dist] }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host and owned by a
          # different uid than root-in-container, so git refuses it with
          # "detected dubious ownership".  actions/checkout marks it safe for
          # its own use, under a temporarily overridden HOME, so the setting
          # does not survive into later steps — and `make dist` is
          # `git archive HEAD`, which then fails with git's exit 128.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          . .github/ci-setup.sh
          # systemd is for `systemd-analyze verify/security` in the unit-lint
          # step.  It is present on the GitHub runner images and is NOT in a
          # Debian base, so it only became a dependency when this job moved
          # into a container — devbox/Dockerfile installs it for the same
          # reason.  systemd is never PID 1 here; only the offline analyser is
          # used.
          apt_setup devscripts mandoc help2man texinfo systemd

      - name: Build (imud, imud-cal, imud-status, imud-mon)
        run: make

      # Bridges are out of `all` (own deps/config/service, per-bridge packaging).
      # Build them here so they don't bit-rot. imud-mqtt needs libmosquitto-dev
      # (installed above); imud-signalk is pure C.
      - name: Build bridges
        run: make bridges

      # make test builds and runs all host-side test binaries; it must run
      # from the repo root (test_wmm loads data/WMM.COF by relative path).
      - name: Test
        run: make test

      # Importing the Python client runs its struct-size assertion, catching
      # wire-format drift in the pure-Python parser too.
      - name: Python client self-check
        run: python3 -c "import sys; sys.path.insert(0, 'lib'); import imud_client; print('imud_client.py OK')"

      # ── Debian-readiness guards ──────────────────────────────────────────

      # dpkg-buildflags injection must reach every compile and link: rebuild
      # with the Debian hardening flags and verify with hardening-check
      # (the shared library too; PIE does not apply to a .so, and neither
      # does the fortify heuristic: every fortifiable call in libimud.c has
      # compile-time-provable bounds, so glibc emits no __*_chk imports and
      # hardening-check misreads that as an unfortified build).
      - name: Hardening flags respected
        run: |
          make clean
          export DEB_BUILD_MAINT_OPTIONS="hardening=+all"
          eval "$(dpkg-buildflags --export=sh)"
          make imud imud-cal imud-imutest imud-status imud-mon && make bridges
          # Branch Protection is AArch64's BTI/PAC — the architecture-specific
          # sibling of the control-flow protection waived above.  Debian's
          # hardening-check tests it and Ubuntu's did not, which is why it
          # surfaced only when this job moved.
          #
          # Waived on x86-64 ONLY, where it can never be satisfied because the
          # architecture has CET instead and there is nothing to find.  The
          # arm64 leg keeps the check and passes it: Debian's hardening=+all
          # does emit branch protection there, which is the architecture every
          # shipped .deb is built for.  Waiving it unconditionally would drop a
          # real, currently-passing check on the arch that matters.
          # Gated on the option EXISTING as well as on the architecture:
          # bookworm's older hardening-check has no --nobranchprotection and
          # does not test branch protection at all (no "branch" in its --help),
          # so passing the flag there is `Unknown option` and an immediate
          # failure.  Only trixie both tests it and can waive it.
          #
          # An `if` rather than `[ … ] && bp=(…)`: both are safe here, but the
          # && form is only safe because another command follows it.  As the
          # last line of a step it would take the step's exit status from a
          # false test, under the `bash -e -o pipefail` these run with.  The
          # `if` does not depend on what comes after it.
          # Captured into a variable and matched with `case`, not piped into
          # grep: these steps run under `bash -o pipefail`, so a pipeline takes
          # its status from ANY member, and `hardening-check --help` exiting
          # non-zero would then hide a match grep did make.  That is what went
          # wrong on the first attempt — the option was there, the probe said
          # it was not, and amd64 kept failing on Branch Protection.
          bp=()
          if [ "$(uname -m)" = "x86_64" ]; then
            hc_help=$(hardening-check --help 2>&1 || true)
            case "$hc_help" in
              *--nobranchprotection*) bp=(--nobranchprotection) ;;
            esac
          fi
          hardening-check --nocfprotection "${bp[@]}" \
                          imud imud-signalk imud-influxdb imud-prometheus
          hardening-check --nocfprotection "${bp[@]}" \
                          --nopie --nofortify libimud.so.0.0

      # libimud must export exactly the public API (version script honored)
      # and the bridges must actually link it.
      - name: libimud ABI surface
        run: |
          # The version script makes nm list the version node (IMUD_0) as an
          # absolute symbol and append @@IMUD_0 to every export; drop both
          # before comparing against the public API.
          nm -D --defined-only libimud.so.0.0 | awk '$2 != "A" {print $3}' \
              | sed 's/@.*$//' | grep -v '^$' > syms.txt
          if grep -v '^imud_' syms.txt; then echo "unexpected exported symbols"; exit 1; fi
          grep -q '^imud_connect_stream$' syms.txt
          grep -q '^imud_data$' syms.txt
          LD_LIBRARY_PATH=. ldd imud-signalk | grep -q 'libimud.so.0'
          echo "ABI surface OK"

      # Staged install must be a pure file copy into the packaging layout:
      # correct paths, no useradd, no systemctl.
      - name: Staged install layout
        run: |
          # install-info-doc is deliberately NOT a prerequisite of `install`
          # (a source install must work without texinfo), so it is named here
          # exactly as debian/rules names it.
          make install install-utils install-wmm-data install-signalk install-mqtt \
               install-influxdb install-mavlink install-prometheus install-info-doc \
               DESTDIR="$PWD/stage" PREFIX=/usr SVCDIR=/lib/systemd/system \
               UDEVDIR=/usr/lib/udev/rules.d
          test -x stage/usr/bin/imud
          test -x stage/usr/bin/imud-mavlink
          test -x stage/usr/bin/imud-prometheus
          test -f stage/lib/systemd/system/imud-prometheus.service
          test -f stage/usr/share/man/man8/imud-prometheus.8.gz
          test -f stage/lib/systemd/system/imud.service
          grep -q '^ExecStart=/usr/bin/imud ' stage/lib/systemd/system/imud.service
          test -f stage/usr/share/doc/imud/changelog.gz
          test -f stage/usr/share/doc/imud-mqtt/copyright
          # The doc tree MIRRORS the source tree — docs/ keeps its directory
          # rather than being flattened — because every one of these documents
          # links to the others by relative path.  Flattening docs/manual.md
          # to manual.md broke every `docs/...` link the moment it installed
          # while leaving it correct on GitHub.  tools/check-links.py proves
          # the links; these prove the layout it assumes is what ships.
          test -f stage/usr/share/doc/imud/docs/manual.md
          test -f stage/usr/share/doc/imud/docs/capture.md
          test -f stage/usr/share/doc/imud/docs/math.md
          test -f stage/usr/share/doc/imud/README.md
          # Shipped solely because README.md/CONTRIBUTING.md link to them by
          # relative path: a link to a file no package installs is a dead link.
          test -f stage/usr/share/doc/imud/LICENSE
          test -f stage/usr/share/doc/imud/SECURITY.md
          test -f stage/usr/share/doc/imud/CODE_OF_CONDUCT.md
          test -f stage/usr/share/doc/imud/devbox/README.md
          # INSTALL is build-from-source guidance and Debian rejects it in a
          # binary package; nothing installed links to it.
          test ! -e stage/usr/share/doc/imud/INSTALL
          test -f stage/usr/share/man/man8/imud.8.gz
          # Uncompressed: dh_compress owns /usr/share/info/*.info and runs
          # after dh_install, so compressing here would ship a .info.gz.gz.
          test -f stage/usr/share/info/imud.info
          test ! -e stage/usr/share/info/imud.info.gz
          test -f stage/etc/imud/imud.conf
          # The udev rule is what makes the gpio/i2c groups useful on a distro
          # that ships no equivalent of Pi OS's 99-com.rules.
          test -f stage/usr/lib/udev/rules.d/60-imud.rules
          # Configs that can hold a broker password / API token must not stage
          # world-readable.  dh_fixperms would undo this; debian/rules excludes
          # them.  Modes only — a staged install deliberately does no chgrp.
          test "$(stat -c%a stage/etc/imud/imud-mqtt.conf)"     = 640
          test "$(stat -c%a stage/etc/imud/imud-influxdb.conf)" = 640
          # ...while imud.conf and the pristine doc examples stay 0644.
          test "$(stat -c%a stage/etc/imud/imud.conf)" = 644
          test "$(stat -c%a stage/usr/share/doc/imud-mqtt/examples/imud-mqtt.conf)" = 644
          test "$(stat -c%a stage/usr/share/doc/imud-influxdb/examples/imud-influxdb.conf)" = 644
          test -f stage/usr/lib/libimud.so.0.0
          test -L stage/usr/lib/libimud.so.0
          test -L stage/usr/lib/libimud.so
          test -f stage/usr/include/imud.h
          test ! -e stage/usr/include/imud_client.h
          test -f stage/usr/lib/pkgconfig/libimud.pc
          # imud-mon and imud-imutest ship in imud-utils, not the core package
          test -x stage/usr/bin/imud-mon
          test -x stage/usr/bin/imud-imutest
          test -f stage/usr/share/doc/imud-utils/copyright
          test -f stage/usr/share/man/man1/imud-mon.1.gz
          test -f stage/usr/share/man/man8/imud-imutest.8.gz
          # WMM data is its own package: /usr/share only, never /etc
          test -f stage/usr/share/imud/WMM.COF
          test -f stage/usr/share/doc/imud-wmm-data/copyright
          test ! -e stage/etc/imud/WMM.COF
          if id -u imud >/dev/null 2>&1; then echo "useradd ran under DESTDIR"; exit 1; fi
          echo "staged layout OK"

      # The units are generated from etc/*.service.in, so the staged copies are
      # what ships.  `verify` is a hard gate: systemd only *warns* about an
      # unknown or misspelled directive at runtime, in a log nobody reads, so a
      # typo in the hardening block would silently un-harden a unit.
      #
      # `security` is printed, not thresholded — it mis-scores units that use
      # more than one SystemCallFilter= line (systemd#23663), which is exactly
      # imud.service's shape (it re-allows adjtimex after ~@privileged).  What
      # actually proves those filters is running the daemon on real hardware.
      - name: systemd unit lint
        run: |
          systemd-analyze --version | head -1

          # --root= searches the compiled-in unit path, /usr/lib/systemd/system.
          # The staged tree puts units in /lib/systemd/system because that is
          # where the Debian packages place them, and on a real system /lib is
          # a symlink to /usr/lib — but DESTDIR has no such symlink, so
          # systemd-analyze finds nothing there.  Assemble a root that looks
          # like an installed system instead.  The binaries come along because
          # verify resolves ExecStart= under --root too.
          root="${RUNNER_TEMP:-/tmp}/unitlint"
          rm -rf "$root"
          mkdir -p "$root/usr/lib/systemd" "$root/usr/bin" "$root/bin"
          cp -r stage/lib/systemd/system "$root/usr/lib/systemd/system"
          cp    stage/usr/bin/*          "$root/usr/bin/"

          # ExecReload=/bin/kill needs to resolve too.  Our own binaries are
          # the staged, real ones, so "does ExecStart point at something we
          # actually install" stays a genuine check; /bin/kill is a base-system
          # utility this repo neither ships nor controls, so a stub is enough.
          # A typo'd path still fails — it would not match this path either.
          printf '#!/bin/sh\n' > "$root/bin/kill"
          chmod +x "$root/bin/kill"

          units=$(cd "$root/usr/lib/systemd/system" && echo *.service)
          echo "checking: $units"
          echo "lint root:"; (cd "$root" && find . -mindepth 1 | sort | sed 's/^/  /')

          # --recursive-errors=no keeps this about our units, not about
          # network-online.target and friends being absent on a runner.  It
          # still fails on a syntax warning in the units named here, which is
          # the misspelled-directive case this gate exists for.
          # --man=no skips resolving Documentation=, whose man pages are staged
          # under DESTDIR rather than installed.
          # shellcheck disable=SC2086  # $units is a deliberate word-split list
          systemd-analyze verify --root="$root" \
                                 --recursive-errors=no --man=no $units

          for u in $units; do
            systemd-analyze security --offline=true --root="$root" "$u" || true
          done

      # A third-party consumer must build against the staged tree using only
      # pkg-config — proves header, .pc, and link path end to end.
      - name: pkg-config consumer compile
        run: |
          cat > consumer.c <<'EOF'
          #include <imud.h>
          #include <stdio.h>
          int main(void)
          {
              printf("libimud %s\n", imud_lib_version());
              imud_t *h = imud_connect_udp(0, NULL);
              if (!h) return 1;
              const imud_data_t *d = imud_data(h);
              (void)d;
              imud_free(h);
              return 0;
          }
          EOF
          export PKG_CONFIG_PATH="$PWD/stage/usr/lib/pkgconfig"
          FLAGS=$(pkg-config --cflags libimud | sed "s|-I/usr/include|-I$PWD/stage/usr/include|")
          # shellcheck disable=SC2086  # $FLAGS is a deliberate word-split list
          gcc -Wall -Wextra $FLAGS -I"$PWD/stage/usr/include" consumer.c \
              -L"$PWD/stage/usr/lib" -limud -o consumer
          LD_LIBRARY_PATH="$PWD/stage/usr/lib" ./consumer
          echo "consumer OK"

      # The release tarball must contain the release and nothing repo-only:
      # no .github, no bytecode, no OS litter, no vendor datasheets, and above
      # all NO BINARIES.  The apt pool used to ride along in here — every
      # release shipped the previous three releases' .debs inside its own
      # source tarball, which is how imud-1.7.tar.gz reached 6.1 MB from
      # 1.86 MB at v1.6.  The pool now lives on the apt-pool branch; this
      # guard and the size ceiling below stop it (or anything like it)
      # creeping back.
      - name: Dist tarball content
        run: |
          make dist

          # List ONCE into a file, then match the file.
          #
          # This step used four `tar … | grep -q` pipelines and exited 141 —
          # 128 + SIGPIPE — on two legs after the move into containers, having
          # passed on the Ubuntu runner.  grep -q leaves at its first match, so
          # tar can take SIGPIPE, and `-o pipefail` then reports the pipeline
          # as failed even though the assertion it was making succeeded.  Which
          # of the four raced, and why the timing differs between runner and
          # container, is NOT established: the race does not reproduce locally.
          # What is certain is that these pipelines are the only SIGPIPE source
          # in the step, and that matching a file has no pipeline to poison.
          # It also runs tar once rather than four times.
          tar tzf imud-*.tar.gz > /tmp/dist-list.txt

          grep -q 'LICENSE' /tmp/dist-list.txt
          grep -q 'include/version.h' /tmp/dist-list.txt

          # `if grep; then exit 1; fi`, NOT `! tar ... | grep ...`.  The
          # negated form could not fail: a `run:` block is `bash -e {0}`, and
          # errexit is ignored for a pipeline beginning with `!` (POSIX), so a
          # match returned 1, the shell carried on, and the step exited with
          # the status of the final `echo` — 0.  This guard silently passed on
          # a tarball full of .debs for as long as it has existed.  Adding
          # `-o pipefail` does not fix it; only losing the `!` does.
          if grep -E '\.gitignore|\.gitattributes|\.pyc|\.DS_Store|\.dSYM|datasheets/|apt/pool|\.deb$' \
                  /tmp/dist-list.txt; then
            echo "::error::dist tarball contains repo-only files (listed above)" >&2
            exit 1
          fi

          # .github/ MUST be present, which is the opposite of what this guard
          # used to assert.  GitHub's source tarball honours export-ignore and
          # Scorecard analyses that tarball, so hiding the workflows from the
          # archive hid them from Scorecard too — see .gitattributes.
          grep -q '\.github/workflows/ci\.yml' /tmp/dist-list.txt

          # A source tarball for this project is well under a megabyte; an
          # order-of-magnitude jump means something binary got committed.
          bytes=$(stat -c%s imud-*.tar.gz)
          echo "tarball is $bytes bytes"
          if [ "$bytes" -gt 2000000 ]; then
            echo "::error::dist tarball is ${bytes} bytes (>2 MB) — something binary is being shipped" >&2
            exit 1
          fi
          echo "dist content OK"

      # Man pages must lint clean (warnings fail).
      - name: Man page lint
        run: |
          mandoc -Tlint -Wwarning man/man1/*.1 man/man3/*.3 man/man5/*.5 man/man8/*.8
          echo "man lint OK"

      # The 10 man1/man8 pages are generated from each tool's own --help, so a
      # flag cannot be added to a parser and forgotten in its man page — the
      # two are the same text.  The pages are COMMITTED (make dist is
      # `git archive HEAD`, and a packager must not need help2man), so this
      # asserts what is committed is what regenerating produces.
      #
      # It needs the built binaries: help2man runs them.  Output is made
      # reproducible by tools/man-postprocess.py, which rewrites help2man's
      # self-identifying banner and its "August 2026" date to the ISO date in
      # include/version.h — without that this would fail on any runner with a
      # different help2man, and again on the first of every month.
      - name: Man pages regenerate to what is committed
        run: make check-generated-man

      # docs/imud.texi is generated from docs/manual.md and committed, but
      # deliberately NOT diff-gated: pandoc 3.10 (dev box) and 3.1.11
      # (container) do not emit identical Texinfo from the same markdown, so
      # a regenerate-and-diff would be red on whichever runner did not match
      # whoever last ran `make docs-texi`.  makeinfo is the half of the gate
      # that IS version-stable — it either builds a valid Info manual or it
      # does not — and check-generated-text runs the other half
      # (tools/check-texi.py: every heading has a node, the version matches,
      # every cross-reference resolves) with no pandoc at all.
      - name: The Info manual builds
        run: |
          make imud.info
          test -s imud.info
          grep -q '^INFO-DIR-SECTION System administration' imud.info
          grep -q '^\* imud: (imud)\.' imud.info
          echo "info manual OK"

  # Extracted from build-and-test when that job moved into a Debian container:
  # this check needs systemd as PID 1 (systemd-run, systemctl, journalctl), and
  # no container provides it.  So it stays on the GitHub runner, which is
  # Ubuntu — the one gate here that is not Debian, because the alternative is a
  # privileged systemd-in-container rig for a check about syscall NAMES, which
  # glibc resolves the same way on both distributions.
  #
  # Both architectures, for the reason the step's own comment gives: the arm64
  # leg is the one with teeth.
  seccomp-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpiod-dev libmosquitto-dev

      - name: Build (the check runs the daemon it just built)
        run: make

      # The daemon under its own seccomp filter, on a real kernel.
      #
      # THIS IS THE ONLY CHECK THAT CATCHES THE 1.9.0 RC BUG. SystemCallFilter=
      # takes syscall NAMES resolved against the running architecture, and
      # glibc's adjtimex() is adjtimex on x86-64 but clock_adjtime on arm64 and
      # clock_adjtime64 on armhf. A unit naming only "adjtimex" therefore
      # allows nothing on ARM, ~@privileged keeps clock_adjtime blocked, and
      # the daemon is SIGSYS-killed before fusing a sample. Every other test in
      # this repo runs the binary with NO seccomp at all, and the x86 leg gets
      # the right syscall by accident — so nothing saw it until a Pi 5 did.
      #
      # The filter lines are READ OUT OF THE SHIPPED UNIT, never retyped: a
      # copy here would drift from the thing it is supposed to guard, and would
      # then pass while the unit was broken.
      #
      # Runs on both matrix legs. The arm64 leg is the one with teeth; the
      # amd64 leg proves the wider list did not regress the architecture that
      # already worked.
      - name: Daemon starts under its own SystemCallFilter
        run: |
          set -euo pipefail
          # Generate rather than reuse: the .service is not built by `all`, and
          # a stale one would let this pass against a unit nobody ships.
          make etc/imud.service
          # The sim driver needs no hardware; int_gpio = 0 uses the timer path.
          cat > /tmp/seccomp-sim.conf <<'EOF'
          [imu]
          driver   = "sim"
          int_gpio = 0
          [mag]
          driver   = "sim"
          int_gpio = 0
          [stream]
          socket   = "/tmp/imud-seccomp-test.sock"
          [logging]
          level    = "info"
          EOF
          props=()
          while IFS= read -r line; do
              props+=(--property="$line")
          done < <(grep '^SystemCallFilter=' etc/imud.service)
          echo "Applying ${#props[@]} filter line(s) from etc/imud.service:"
          printf '  %s\n' "${props[@]}"

          sudo systemd-run --unit=imud-seccomp-test --collect \
               "${props[@]}" \
               "$PWD/imud" --config /tmp/seccomp-sim.conf
          sleep 5

          result=$(systemctl show imud-seccomp-test -p Result --value || true)
          status=$(systemctl show imud-seccomp-test -p ExecMainStatus --value || true)
          journalctl -u imud-seccomp-test --no-pager | tail -20 || true
          sudo systemctl stop imud-seccomp-test 2>/dev/null || true

          # status 31 is SIGSYS — the seccomp kill. Anything else that stopped
          # it is also a failure here, but name the seccomp case explicitly
          # because that is the regression this step exists for.
          if [ "$status" = "31" ]; then
              echo "::error::imud was SIGSYS-killed under its own SystemCallFilter=." \
                   "A syscall the daemon issues on $(uname -m) is not re-allowed." \
                   "See the SystemCallFilter= comment in etc/imud.service.in."
              exit 1
          fi
          if [ "$result" != "success" ] && [ -n "$result" ]; then
              echo "::error::imud did not survive 5 s under its own filter (Result=$result, status=$status)"
              exit 1
          fi
          echo "OK: daemon ran 5 s under the shipped SystemCallFilter= on $(uname -m)"

  # The build with no libgpiod, which is what the BSD and macOS ports need
  # (#43).  Nothing else covers it: every other job installs libgpiod-dev, so
  # src/imu_gpio_null.c would rot unnoticed the first time a signature changed.
  #
  # libgpiod-dev is deliberately NOT installed rather than passing NO_GPIOD=1,
  # so this also proves the pkg-config fallback picks the null backend on a
  # host that simply does not have the library — the case a porter actually
  # meets.  The guard below fails the job if the runner image ever ships it,
  # since the build would then silently be testing nothing.
  no-gpiod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm libgpiod is absent
        run: |
          if pkg-config --exists libgpiod; then
            echo "libgpiod is installed on this image — this job would test nothing" >&2
            exit 1
          fi
          echo "OK: no libgpiod, auto-detect must select the null backend"

      - name: Build
        run: make

      - name: No libgpiod in any binary
        run: |
          for b in imud imud-cal imud-imutest; do
            if ldd "$b" | grep -qi gpiod; then
              echo "FAIL: $b links libgpiod" >&2; exit 1
            fi
          done
          echo "OK: imud, imud-cal and imud-imutest link no libgpiod"

      - name: The null backend's own suite
        run: make test_imu_gpio_null && ./test_imu_gpio_null

      # The claim that matters: not that it links, but that it runs.  The sim
      # driver sets int_gpio = 0 for both sensors, which is the path a host
      # with no GPIO takes, so the whole pipeline runs on the timer fallback.
      - name: Run the daemon against the sim driver
        run: |
          # sim.conf names no stream socket, so it takes the /run/imud default
          # that only root can create; point it somewhere writable.
          cp config/sim.conf /tmp/sim.conf
          printf '\n[stream]\nenabled = true\nsocket  = "/tmp/imud-nogpiod.sock"\n' \
            >> /tmp/sim.conf
          timeout 10 ./imud --config /tmp/sim.conf > /tmp/imud.log 2>&1 || true
          cat /tmp/imud.log
          grep -q 'running' /tmp/imud.log || { echo "daemon never started" >&2; exit 1; }
          # The <N> is journald's priority prefix. A GitHub runner's agent is
          # systemd-managed, so INVOCATION_ID reaches the job environment and
          # src/main.c correctly selects LOG_STYLE_JOURNAL — which a bare ^\[
          # anchor then misses, reporting a daemon that fused 8300 samples as
          # one that never ran.
          grep -qE '^(<[0-9]>)?\[stats\]' /tmp/imud.log || { echo "fusion never ran" >&2; exit 1; }
          echo "OK: imud fused samples with no libgpiod"

  # The suite on 32-bit ARM.  armhf .debs are built and published, but until
  # now nothing ever RAN the tests there: build-and-test covers amd64 and
  # arm64 only.  32-bit is where the packed wire struct, time_t width and
  # pointer size actually differ — test_drivers wraps __ioctl_time64, a
  # symbol that only exists on 32-bit glibc with 64-bit time_t.
  #
  # Same explicit `docker run` as build-debs.yml, for the same reason: the
  # `container:` key cannot host an armhf rootfs on an arm64 runner.
  #
  # RASPBIAN, not Debian, and for the same reason build-debs.yml builds the
  # armhf packages there: Debian armhf is ARMv7-A while the packages ship at
  # Raspbian's ARMv6 baseline.  Testing on Debian would exercise a different
  # instruction set and a different VFP revision from the one that ships —
  # correct-looking coverage of a binary nobody runs.
  test-armhf:
    runs-on: ubuntu-24.04-arm
    # Two full build+test passes now (plain, then UBSan).  The plain pass
    # takes ~3 min; instrumented builds and runs are slower, so the budget
    # goes up rather than turning a slow day into a red run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same script build-debs.yml bootstraps with, so the rootfs the suite
      # runs in and the rootfs the packages are built in cannot drift apart.
      - name: Bootstrap Raspbian rootfs (trixie/armhf)
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap
          sudo tools/bootstrap-raspbian.sh trixie rootfs.tar
          docker import --platform linux/arm/v6 rootfs.tar imud-raspbian:trixie

      - name: Build and test under 32-bit armhf (Raspbian trixie, ARMv6)
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$GITHUB_WORKSPACE:/work/src" -w /work/src \
            -e DEBIAN_FRONTEND=noninteractive \
            -e UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            imud-raspbian:trixie \
            bash -euo pipefail -c '
              # Acquire::Retries for connection failures, apt_retry for a
              # truncated download — Retries does not cover the latter.  The
              # reasoning, and the measurements behind it, are in build-debs.yml.
              printf "%s\n" "Acquire::Retries \"5\";" \
                            "Acquire::http::Timeout \"60\";" \
                            "Acquire::https::Timeout \"60\";" \
                  > /etc/apt/apt.conf.d/99retries
              apt_retry() {
                  for i in 1 2 3; do
                      "$@" && return 0
                      echo "apt attempt $i failed; retrying in $((i * 10))s" >&2
                      sleep $((i * 10))
                  done
                  return 1
              }
              apt_retry apt-get update
              apt_retry apt-get install -y build-essential pkgconf libgpiod-dev \
                                          libmosquitto-dev python3
              uname -m
              make clean
              make
              make bridges
              make test

              # Second pass under UBSan, and the ONLY sanitizer run this
              # project does on a 32-bit target.  Alignment is the reason:
              # the wire packet is a __attribute__((packed)) struct
              # (include/types.h), unaligned loads are free on x86-64 and
              # arm64, and armv7 is where one actually traps.
              # -fsanitize=undefined includes -fsanitize=alignment, so this
              # covers the bug class the amd64 sanitizers job structurally
              # cannot see — it is not a duplicate of that job on slower
              # hardware.
              #
              # UBSan alone, not ASan: ASan wants control over the ASLR
              # entropy its shadow mapping needs (vm.mmap_rnd_bits), which
              # under docker means --privileged or a host sysctl.  UBSan
              # needs nothing from the container.
              make clean
              make test \
                CFLAGS="-O1 -g -fsanitize=undefined -fno-omit-frame-pointer -Wall -Wextra" \
                LDFLAGS="-fsanitize=undefined"
            '

  # Static analysis: the one axis the rest of CI does not cover.  Everything
  # else here is dynamic (sanitizers, fuzzers) and so only sees paths the
  # tests execute; these read the code instead.  CodeQL runs separately in
  # codeql.yml — it is slower and reports into the Security tab.
  static-analysis:
    runs-on: ubuntu-latest
    needs: bases
    container:
      # Digest from devbox/Dockerfile, via the `bases` job.  It is a
      # manifest-list digest, so it resolves on both the amd64 and arm64
      # runners.
      image: debian:trixie@${{ needs.bases.outputs.trixie }}
    timeout-minutes: 20
    steps:
      - name: Bootstrap
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host and owned by a
          # different uid than root-in-container, so git refuses it with
          # "detected dubious ownership".  actions/checkout marks it safe for
          # its own use, under a temporarily overridden HOME, so the setting
          # does not survive into later steps — and `make dist` is
          # `git archive HEAD`, which then fails with git's exit 128.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          . .github/ci-setup.sh
          apt_setup cppcheck clang-tools pyflakes3

      # Blocking: the tree is clean under these checks today.  The single
      # known false positive is suppressed inline at its site with the
      # reason, so new findings are real findings.
      # --check-level=exhaustive analyses every branch instead of bailing out
      # of the deeply-nested ones.  Debian's cppcheck 2.17 reports that it
      # limited itself (normalCheckLevelMaxBranches), which --error-exitcode=1
      # turns into a failure even though the note is informational rather than
      # a finding; Ubuntu's older build never said so, which is why this only
      # appeared when the job moved.  Asking for the fuller analysis answers
      # the note at its cause rather than suppressing it, and the tree is clean
      # under it: measured at ~4 min for src + lib, against this job's 20 min.
      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr --std=c11 -Iinclude \
                   --suppress=missingIncludeSystem \
                   --check-level=exhaustive \
                   --error-exitcode=1 --quiet src lib
          echo "cppcheck clean"

      # scan-build injects its analyzer by exporting CC, and the Makefile
      # only defaults CC when $(origin CC) is `default` — so an environment
      # CC wins and plain `scan-build make` is analysed correctly.
      #
      # Blocking as of 1.8, like cppcheck above.  It had two findings at 1.7,
      # both triaged and cleared: a dead store in imu.c's capture drain (which
      # was really an ineffective break — the write-error flag never gated the
      # outer loop) and a garbage-value read in cal_main.c's mag fit (a false
      # positive that went away with the real bug at the same site).  Run
      # 30685512158 on b1c134c reported "No bugs found", so a finding here is
      # now a new finding.
      #
      # --status-bugs makes scan-build exit non-zero when it reports a bug;
      # note that it then does NOT report the build's own exit status, which
      # is fine because every other job builds this tree anyway.  On a clean
      # run scan-build deletes its output directory, so the upload below is
      # a no-op (if-no-files-found: ignore) and only failures leave a report.
      - name: clang static analyzer
        run: |
          make clean
          scan-build -o scan-out --status-bugs --keep-going make all bridges
          echo "scan-build clean"

      # The Python had no analyser at all while the C had two, CodeQL and six
      # fuzzers — and it is not scratch code: lib/imud_client.py is a SHIPPED
      # public client and the third independent copy of the wire format, and
      # tools/check-*.py are what version-consistency runs to gate a release.
      # An undefined name on a branch none of them takes today would sit there
      # silently until the day that branch runs.
      #
      # pyflakes rather than a style linter: it reports undefined names, unused
      # imports and shadowed definitions — real defects — and has no opinion
      # about formatting, so it will not start failing over a house-style
      # disagreement.  From apt, so the distro pins the version and a new
      # upstream release cannot turn CI red on its own.
      - name: pyflakes
        run: |
          pyflakes3 lib/imud_client.py tools/*.py test/test_checkers.py
          echo "pyflakes clean"

      - name: Save scan-build report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-build-report
          path: scan-out
          if-no-files-found: ignore

  # Static analysis of CI ITSELF.  The jobs above read the C; nothing read the
  # ~1500 lines of YAML and embedded shell that decide whether the C is even
  # checked — and a broken guard here is worse than a broken test, because it
  # fails open and reports success.  The first run of this found exactly that:
  # the dist tarball's forbidden-content check began with `!`, which makes
  # bash ignore errexit, so it could not fail (SC2251).
  #
  # actionlint validates the workflow schema, `runs-on` labels, `needs` graphs
  # and ${{ }} expressions, and pipes every `run:` block through shellcheck.
  # Blocking, on the cppcheck model: the tree is clean today and the three
  # deliberate word-splits are suppressed inline at their sites with the
  # reason, so a new finding is a real finding.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by version AND checksum, the same reasoning as the SHA-pinned
      # actions (.github/dependabot.yml): a tag is a moving pointer.  The
      # tradeoff is that Dependabot has no ecosystem for a curl'd binary, so
      # unlike the actions this one does NOT get bumped automatically —
      # refresh the version and the checksum together, by hand, from
      # https://github.com/rhysd/actionlint/releases.
      # shellcheck is preinstalled on the runner image and actionlint finds it
      # on PATH by itself.  ASSERT that rather than reinstalling it: `apt-get
      # update` reaches the Ubuntu archive on every run, and a slow mirror
      # takes the whole workflow down with it.  On 2026-08-18 it stalled for
      # 4.5 minutes, the 5-minute timeout above killed the job, and the run
      # reported `cancelled` with all sixteen other jobs green — including the
      # static-analysis fix that push existed to land.  The check keeps the
      # dependency from being luck, which is why the install was here, and it
      # fails loudly and instantly if the image ever drops the tool.
      #
      # The curl stays: actionlint genuinely is not preinstalled.  It is
      # checksum-pinned, and fetches from GitHub rather than a distro mirror.
      - name: Install actionlint, and require shellcheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          if ! command -v shellcheck >/dev/null; then
            echo 'shellcheck is not on PATH: the runner image dropped it.' >&2
            echo 'Reinstate an install step here - actionlint silently skips' >&2
            echo 'its shell checks when shellcheck is missing.' >&2
            exit 1
          fi
          shellcheck --version
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -version

      # No arguments: actionlint finds .github/workflows itself and checks
      # every file in it, so a workflow added later is covered with no edit
      # here.
      - name: Lint the workflows
        run: |
          ./actionlint -oneline
          echo "workflow lint clean"

  # The full test suite under AddressSanitizer + UBSan: memory errors and
  # undefined behavior fail the build. The Makefile respects external
  # CFLAGS/LDFLAGS by design, so the flags flow through every test binary.
  # (TSan + fuzzers run as their own jobs below.)
  sanitizers:
    runs-on: ubuntu-latest
    # Debian, for the reason given on `coverage` below: the gates should run on
    # the distribution this project ships packages for.
    #
    # ASan needs vm.mmap_rnd_bits low enough for its shadow mapping.  That
    # sysctl is NOT namespaced, so the container reads the host runner's value
    # — the same value this job already passes with today.  If it ever does
    # trip here, the fix is `options: --privileged` on the container, not a
    # move back to Ubuntu.
    needs: bases
    container:
      # Digest from devbox/Dockerfile, via the `bases` job.  It is a
      # manifest-list digest, so it resolves on both the amd64 and arm64
      # runners.
      image: debian:trixie@${{ needs.bases.outputs.trixie }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host and owned by a
          # different uid than root-in-container, so git refuses it with
          # "detected dubious ownership".  actions/checkout marks it safe for
          # its own use, under a temporarily overridden HOME, so the setting
          # does not survive into later steps — and `make dist` is
          # `git archive HEAD`, which then fails with git's exit 128.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          . .github/ci-setup.sh
          # This gate needs nothing beyond the base set; SC2119 reads the
          # bare call as a forgotten "$@" forward, which it is not.
          # shellcheck disable=SC2119
          apt_setup

      - name: Test under ASan + UBSan
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make test \
            CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra" \
            LDFLAGS="-fsanitize=address,undefined"

  # The whole suite again under ThreadSanitizer: the reader/fusion/output/
  # capture thread model must be C11-clean (all cross-thread flags are
  # _Atomic), and test_ring exercises the ring handshake directly.
  tsan:
    runs-on: ubuntu-latest
    needs: bases
    container:
      # Digest from devbox/Dockerfile, via the `bases` job.  It is a
      # manifest-list digest, so it resolves on both the amd64 and arm64
      # runners.
      image: debian:trixie@${{ needs.bases.outputs.trixie }}
    timeout-minutes: 30
    steps:
      - name: Bootstrap
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host and owned by a
          # different uid than root-in-container, so git refuses it with
          # "detected dubious ownership".  actions/checkout marks it safe for
          # its own use, under a temporarily overridden HOME, so the setting
          # does not survive into later steps — and `make dist` is
          # `git archive HEAD`, which then fails with git's exit 128.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          . .github/ci-setup.sh
          # This gate needs nothing beyond the base set; SC2119 reads the
          # bare call as a forgotten "$@" forward, which it is not.
          # shellcheck disable=SC2119
          apt_setup

      - name: Test under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          make test \
            CFLAGS="-O1 -g -fsanitize=thread -Wall -Wextra" \
            LDFLAGS="-fsanitize=thread"

  # Line/function/branch coverage over the WHOLE suite, which is the point:
  # test_ring, test_concurrency, test_drivers, test_drivers_registry and
  # test_imutest cannot build on the macOS dev box, so imu.c, ring.c and the
  # twelve drivers can only be measured here.  A local run on the portable
  # subset alone reports ~92% and is silent about those files entirely.
  #
  # Deliberately NOT gated on a threshold.  A coverage floor mostly produces
  # tests written to move a number, and the useful signal — "which functions
  # have never been executed" — is in the report, not in the percentage. The
  # job still fails if the build or a test fails, because that is a real
  # failure; it just never fails for being a few tenths lower than yesterday.
  coverage:
    runs-on: ubuntu-latest
    # Runs in Debian, not on the Ubuntu runner.  Ubuntu's lcov reports 0.0%
    # function coverage for EVERY file and a line rate an order of magnitude
    # low; Debian's reports the same tree correctly, on the same upstream
    # versions (both say "LCOV version 2.0-1", both gcov 13.3.0), so the
    # difference is Ubuntu's patchset rather than a version to pin.  Reduced
    # to one source file and one test binary, Ubuntu says 16.4%/0.0% where
    # Debian says 100%/100%.
    #
    # Every lcov call has to be in here, the summary below included: running
    # the capture in Debian and the summary on the host would put the wrong
    # numbers back in the job summary.
    needs: bases
    container:
      # Digest from devbox/Dockerfile, via the `bases` job.  It is a
      # manifest-list digest, so it resolves on both the amd64 and arm64
      # runners.
      image: debian:trixie@${{ needs.bases.outputs.trixie }}
    timeout-minutes: 30
    steps:
      # Before checkout, which uses git when it is present and falls back to a
      # slower tarball download when it is not.
      - name: Bootstrap
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host and owned by a
          # different uid than root-in-container, so git refuses it with
          # "detected dubious ownership".  actions/checkout marks it safe for
          # its own use, under a temporarily overridden HOME, so the setting
          # does not survive into later steps — and `make dist` is
          # `git archive HEAD`, which then fails with git's exit 128.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          . .github/ci-setup.sh
          apt_setup lcov

      - name: Build and run the suite with coverage
        run: make coverage

      # Put the totals in the run summary so the number is visible without
      # downloading anything, and list whatever still has never been executed.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            if [ -f coverage.info ]; then
              echo '```'
              lcov --summary coverage.info 2>&1 | grep -E 'lines|functions|branches' || true
              echo '```'
              echo
              echo "<details><summary>Per-file</summary>"
              echo
              echo '```'
              lcov --list coverage.info 2>/dev/null | tail -n +2
              echo '```'
              echo
              echo "</details>"
            else
              echo "No coverage.info was produced — see the step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html
          if-no-files-found: ignore
          retention-days: 14

  # libFuzzer over the six parsers of untrusted input — the config file, the
  # gpsd/Signal K JSON, the wire packet decode, the .imucap capture reader,
  # cal.json and WMM.COF — plus argv, which crosses no trust boundary and is
  # fuzzed for its conversions (see SECURITY.md).  Seed corpora live in
  # test/fuzz/corpus/; -close_fd_mask silences the parsers' own error logging
  # so the runs stay fast.
  fuzz:
    runs-on: ubuntu-latest
    needs: bases
    container:
      # Digest from devbox/Dockerfile, via the `bases` job.  It is a
      # manifest-list digest, so it resolves on both the amd64 and arm64
      # runners.
      image: debian:trixie@${{ needs.bases.outputs.trixie }}
    # Seven harnesses now: ~7 min of fuzzing plus seven ASan+UBSan builds.
    timeout-minutes: 22
    steps:
      - name: Bootstrap
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates
          # The workspace is bind-mounted from the host and owned by a
          # different uid than root-in-container, so git refuses it with
          # "detected dubious ownership".  actions/checkout marks it safe for
          # its own use, under a temporarily overridden HOME, so the setting
          # does not survive into later steps — and `make dist` is
          # `git archive HEAD`, which then fails with git's exit 128.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # clang is preinstalled on the GitHub runner images and is NOT in a
      # Debian base, so this step exists only because the job moved into a
      # container.  The libFuzzer runtime has to come with it, or
      # -fsanitize=fuzzer links against nothing.
      - name: Install dependencies
        run: |
          . .github/ci-setup.sh
          apt_setup clang
          rt=$(clang_rt_package)
          if [ -z "$rt" ]; then
            echo "no libclang-rt-*-dev in the archive; -fsanitize=fuzzer will fail" >&2
            exit 1
          fi
          echo "fuzzer runtime: $rt"
          apt_retry apt-get install -y --no-install-recommends "$rt"

      - name: Build fuzz harnesses
        run: |
          FZ="clang -g -O1 -fsanitize=fuzzer,address,undefined \
              -D_GNU_SOURCE -DIMUD_CLIENT_ALLOW_DEPRECATED -Iinclude"
          $FZ fuzz/fuzz_config.c  src/config.c src/log.c              -o fuzz_config  -lm
          $FZ fuzz/fuzz_json.c    src/position.c src/wmm.c src/log.c  -o fuzz_json    -lm
          $FZ fuzz/fuzz_packet.c                                      -o fuzz_packet  -lm
          $FZ fuzz/fuzz_capture.c src/capture.c                       -o fuzz_capture -lm
          # fuzz_json links wmm.c but only ever drives pos_json_double —
          # wmm_load itself was unfuzzed until this harness.  Both of these
          # go on to exercise the math the parsed values feed (field
          # evaluation / apply_*_cal), not just the parse.
          $FZ fuzz/fuzz_wmm.c     src/wmm.c src/log.c                 -o fuzz_wmm     -lm
          $FZ fuzz/fuzz_cal.c     src/cal.c src/imu_math.c src/log.c  -o fuzz_cal     -lm
          # argv crosses no trust boundary; it is fuzzed for the conversions
          # and fixed-buffer copies the five front-ends do on arbitrary
          # strings, and because parse_int's ERANGE guard is ABI-conditional.
          $FZ fuzz/fuzz_argv.c    src/cli.c                            -o fuzz_argv    -lm

      # -max_total_time is only checked BETWEEN inputs; -timeout caps a
      # single input (default is 1200 s!) so a hang-inducing input fails
      # the run in seconds and gets dumped as a timeout-* reproducer.
      - name: Run fuzzers (60 s each)
        run: |
          for t in config json packet capture wmm cal argv; do
            echo "=== fuzz_$t ==="
            ./fuzz_$t -max_total_time=60 -timeout=10 -rss_limit_mb=1024 \
                      -close_fd_mask=3 "test/fuzz/corpus/$t"
          done

      # crash-* / timeout-* / oom-* files are the reproducers — keep them.
      - name: Save reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-reproducers
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore

  # Build the real .debs on every push so packaging cannot rot between
  # releases, with lintian advisory.  release.yml calls the same reusable
  # workflow without lintian — one definition, no drift.
  debs:
    uses: ./.github/workflows/build-debs.yml
    with:
      lintian: true

  # Actually INSTALL what `debs` just built.  Until now nothing ever did: the
  # packages were compiled, lintian-ed advisory, published, and the first
  # machine to run a maintainer script was a user's.
  #
  # This is not a duplicate of build-and-test's "Staged install layout" step.
  # That one checks the FILE LAYOUT of `make install DESTDIR=...`, and it
  # deliberately asserts that no useradd ran — a staged install is a pure file
  # copy.  Everything in debian/*.postinst is therefore unexecuted by CI: the
  # imud system user, the gpio/i2c groups the units refuse to start without,
  # the ldconfig trigger, and the conffile-mode repair that is the substance
  # of the entire 1.8.1 changelog.
  #
  # arm64 debs on an arm64 runner, so this is a native install with no
  # emulation.  The armhf debs are not installed here — that would need a
  # second container for no new signal, since maintainer scripts are
  # architecture-independent shell.
  install-test:
    needs: [debs, bases]
    strategy:
      fail-fast: false
      matrix:
        dist: [bookworm, trixie]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debs-${{ matrix.dist }}-arm64
          path: debs

      - name: Install, verify, reconfigure and purge (${{ matrix.dist }}/arm64)
        env:
          BASE: debian:${{ matrix.dist }}@${{ needs.bases.outputs[matrix.dist] }}
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/debs:/debs:ro" \
            -e DEBIAN_FRONTEND=noninteractive \
            "$BASE" \
            bash -euo pipefail -c '
              # This job fetches from the archive too: apt-get install of a
              # local .deb still resolves its shlibs dependencies over the
              # network.  Same two mitigations, same reasoning as build-debs.yml.
              printf "%s\n" "Acquire::Retries \"5\";" \
                            "Acquire::http::Timeout \"60\";" \
                            "Acquire::https::Timeout \"60\";" \
                  > /etc/apt/apt.conf.d/99retries
              apt_retry() {
                  for i in 1 2 3; do
                      "$@" && return 0
                      echo "apt attempt $i failed; retrying in $((i * 10))s" >&2
                      sleep $((i * 10))
                  done
                  return 1
              }
              apt_retry apt-get update
              mkdir -p /tmp/d
              cp /debs/*.deb /tmp/d/
              # dbgsym packages belong to a separate archive (Debian keeps
              # them out of the main one; apt-publish.yml filters them out of
              # the pool for the same reason).  They are not what an operator
              # installs, so they are not what this job installs.
              rm -f /tmp/d/*-dbgsym_*.deb
              ls -1 /tmp/d

              # ── install ───────────────────────────────────────────────────
              # apt, not dpkg -i: only apt resolves the shlibs dependencies
              # (libgpiod, libmosquitto) out of the archive.
              echo "=== install ==="
              apt_retry apt-get install -y /tmp/d/*.deb

              # Every binary package in debian/control must end up CONFIGURED,
              # not merely unpacked — a postinst that exits non-zero leaves the
              # package half-installed and apt still exits 0 in some paths.
              for p in imud imud-utils libimud0 libimud-dev imud-wmm-data \
                       imud-signalk imud-mqtt imud-influxdb imud-mavlink \
                       imud-prometheus; do
                dpkg -s "$p" | grep -q "^Status: install ok installed" \
                  || { echo "::error::$p is not configured"; exit 1; }
                echo "  configured: $p"
              done

              # ── what the units require, postinst must have created ────────
              # Read the names back out of the shipped units rather than
              # hard-coding them, so a new SupplementaryGroups= entry cannot be
              # added without a maintainer script learning to create it.
              echo "=== users and groups ==="
              ls /usr/lib/systemd/system/imud*.service >/dev/null
              for u in /usr/lib/systemd/system/imud*.service; do
                user=$(sed -n "s/^User=//p" "$u")
                if [ -n "$user" ] && ! getent passwd "$user" >/dev/null; then
                  echo "::error::$u wants User=$user, which no maintainer script creates"
                  exit 1
                fi
                for g in $(sed -n "s/^Group=//p" "$u") \
                         $(sed -n "s/^SupplementaryGroups=//p" "$u"); do
                  getent group "$g" >/dev/null \
                    || { echo "::error::$u wants group $g, which no maintainer script creates"; exit 1; }
                done
                echo "  ok: $u"
              done

              # ── conffile modes on a REAL install ─────────────────────────
              # The staged test checks these too, but only the mode `make
              # install` wrote.  Here dpkg has unpacked root:root and the
              # postinst has had to fix the group, which is the step that can
              # actually fail on a user machine.
              echo "=== conffile modes ==="
              for c in imud-mqtt imud-influxdb; do
                test "$(stat -c%a /etc/imud/$c.conf)" = 640
                test "$(stat -c%G /etc/imud/$c.conf)" = imud
                echo "  /etc/imud/$c.conf 640 root:imud"
              done
              test "$(stat -c%a /etc/imud/imud.conf)" = 644
              test "$(stat -c%a /usr/share/doc/imud-mqtt/examples/imud-mqtt.conf)" = 644

              # ── the installed binaries actually run ──────────────────────
              # Straight off PATH with no LD_LIBRARY_PATH, which is itself the
              # check: the bridges link libimud, so this passes only if
              # libimud0s ldconfig trigger ran.
              echo "=== binaries ==="
              ldconfig -p | grep -q "libimud.so.0"
              ver=$(dpkg -s imud | sed -n "s/^Version: //p" | cut -d- -f1)
              echo "  package upstream version: $ver"
              for b in imud imud-imutest imud-signalk imud-mqtt imud-influxdb \
                       imud-mavlink imud-prometheus; do
                "$b" --version | grep -qF "$ver" \
                  || { echo "::error::$b --version disagrees with package version $ver"; exit 1; }
                echo "  $b reports $ver"
              done

              # ── the upgrade repair path ─────────────────────────────────
              # imud-mqtt.postinst claims: "Run on every configure, so an
              # upgrade from a release that installed the file 0644 repairs
              # it."  That claim is the substance of the 1.8.1 changelog and
              # nothing has ever tested it.  Recreate the pre-1.8.1 state
              # exactly — 0644 root:root — and reconfigure.
              #
              # Deliberately NOT "install 1.8.1 from the live apt repo, then
              # upgrade": that would make a blocking CI gate depend on what
              # the pool happens to hold today, and the pool prunes to three
              # versions.  dpkg -i over the same version runs preinst upgrade
              # / unpack / postinst configure — the real upgrade code path —
              # offline and deterministically.
              echo "=== upgrade repair ==="
              for c in imud-mqtt imud-influxdb; do
                chown root:root /etc/imud/$c.conf
                chmod 644 /etc/imud/$c.conf
              done
              dpkg -i /tmp/d/imud-mqtt_*.deb /tmp/d/imud-influxdb_*.deb
              for c in imud-mqtt imud-influxdb; do
                test "$(stat -c%a /etc/imud/$c.conf)" = 640
                test "$(stat -c%G /etc/imud/$c.conf)" = imud
                echo "  /etc/imud/$c.conf repaired to 640 root:imud"
              done

              # ── purge ───────────────────────────────────────────────────
              echo "=== purge ==="
              apt-get purge -y imud imud-utils libimud0 libimud-dev \
                               imud-wmm-data imud-signalk imud-mqtt \
                               imud-influxdb imud-mavlink imud-prometheus
              for c in imud imud-mqtt imud-influxdb imud-signalk \
                       imud-mavlink imud-prometheus; do
                test ! -e /etc/imud/$c.conf
              done
              # The imud system user deliberately SURVIVES a purge (Debian
              # convention, spelled out in imud.postinst: system users stay so
              # file ownership never dangles).  Pin it, because a postrm that
              # helpfully tidied up would break that contract silently.
              getent passwd imud >/dev/null
              echo "  conffiles gone, imud user retained"

              echo "install / reconfigure / purge OK"
            '
