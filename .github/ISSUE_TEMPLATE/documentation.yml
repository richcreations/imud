name: Documentation
description: Something in the manual, a man page, the spec or the website is wrong, missing or unclear.
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: >-
        Several surfaces are generated — man1/man8 from each binary's `--help`,
        the config and driver tables from `docs/config-keys.toml` and
        `src/drivers.c`, `spec.md`'s packet layout from `include/types.h`. Say
        what is wrong; the fix goes in the source.

  - type: input
    id: where
    attributes:
      label: Where
      description: The file and section, the man page, or the URL.
      placeholder: docs/manual.md §4, mag.declination_deg
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What it says, and what imud actually does — or what is missing.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: What it should say
      description: Optional.
