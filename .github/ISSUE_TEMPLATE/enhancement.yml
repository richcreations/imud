name: Feature or enhancement
description: Something imud should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Say what you are trying to do, not only what to add — the use case
        usually decides the shape of the answer. Already covered?
        [manual §4](https://github.com/richcreations/imud/blob/main/docs/manual.md)
        for config,
        [spec.md](https://github.com/richcreations/imud/blob/main/spec.md) for
        the output formats,
        [ROADMAP](https://github.com/richcreations/imud/blob/main/docs/ROADMAP.md)
        for what is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where imud stops short of it today.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you tried
      description: The config, stream or bridge you reached for, and why it fell short.

  - type: textarea
    id: shape
    attributes:
      label: What it might look like
      description: >-
        Optional, and a guess is fine. For support for a part, name it and link
        the datasheet.
