name: Bug report
description: imud does something it should not, or does not do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Security vulnerabilities go to
        [private reporting](https://github.com/richcreations/imud/security/advisories/new),
        not here.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        The command, the config keys that differ from the defaults, or the input
        file. Say if it is intermittent.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or error text
      description: "`journalctl -u imud -n 50 --no-pager`, `imud-status`, or the terminal output."
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: "`imud --version`, or the tool that misbehaved."
      placeholder: imud 1.9.1
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Board, OS and release, 32- or 64-bit, and kernel (`uname -srm`).
      placeholder: Raspberry Pi 4, Pi OS bookworm 64-bit, Linux 6.12.87 aarch64
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Sensors and bus
      description: >-
        Both driver names, I2C or SPI, and whether the interrupt lines are
        wired. Blank if no hardware is involved.
      placeholder: ism330dhcx + mmc5983ma, SPI (spidev0.0 / 0.1), INT on GPIO 17 and 27

  - type: dropdown
    id: component
    attributes:
      label: Where it happens
      options:
        - imud (the daemon)
        - A bridge (imud-signalk, -mqtt, -influxdb, -mavlink, -prometheus)
        - A tool (imud-cal, imud-imutest, imud-status, imud-mon)
        - The client library (libimud or imud_client.py)
        - Packaging, the apt repository, or installing
        - Building or the test suite
        - Not sure

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - apt repository
        - .deb from a GitHub release
        - Built from source
        - Other
