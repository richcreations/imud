name: Bug report
description: imud does something it should not, or does not do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Three things make a report actionable: what happened, how to reproduce
        it, and the version, platform and driver it happened on. A theory about
        the cause is welcome at the end, but it is not needed — and a report
        without one is not a lesser report.

        Not here: security vulnerabilities. Use
        [private reporting](https://github.com/richcreations/imud/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/richcreations/imud/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The observed behaviour in a sentence or two, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        The command, the config keys that differ from the defaults, or the input
        file. If it is intermittent, say how often it happens and what it takes
        to catch it.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output or error text
      description: >-
        Log lines, terminal output, `imud-status`, or the last of
        `journalctl -u imud -n 50 --no-pager`. Raise `logging.level` to `debug`
        if the default is quiet about it.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        `imud --version`, or the version of whichever tool misbehaved
        (`imud-cal`, `imud-imutest`, `imud-status`, `imud-mon`, a bridge).
      placeholder: imud 1.9.1
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Board, OS and release, 32- or 64-bit, and kernel (`uname -srm`).
      placeholder: Raspberry Pi 4, Pi OS bookworm 64-bit, Linux 6.12.87 aarch64
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Sensors and bus
      description: >-
        IMU driver, magnetometer driver, I2C or SPI, and whether the interrupt
        lines are wired or the driver is polling. Leave blank if no hardware is
        involved — the `sim` driver, a replay, a bridge, or the docs.
      placeholder: ism330dhcx + mmc5983ma, SPI (spidev0.0 / 0.1), INT on GPIO 17 and 27

  - type: dropdown
    id: component
    attributes:
      label: Where it happens
      options:
        - imud (the daemon)
        - A bridge (imud-signalk, -mqtt, -influxdb, -mavlink, -prometheus)
        - A tool (imud-cal, imud-imutest, imud-status, imud-mon)
        - The client library (libimud or imud_client.py)
        - Packaging, the apt repository, or installing
        - Building or the test suite
        - Not sure

  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - apt repository
        - .deb from a GitHub release
        - Built from source
        - Other
