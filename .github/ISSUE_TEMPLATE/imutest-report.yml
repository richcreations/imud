name: imutest report
description: An imud-imutest run against real silicon — this is what clears a driver's experimental flag.
title: "imutest report: "
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Two things decide whether a report can clear an experimental flag:

        - **The daemon was stopped** — `sudo systemctl stop imud`. Both drain
          the same FIFO.
        - **The run was on a terminal.** `--all` over a pipe, or over ssh with
          no tty, implies `--non-interactive` and runs the passive checks only,
          skipping the three guided phases that prove the axis remap. A
          passive-only report is still worth filing — say so below.

        `man 8 imud-imutest` has the rest.

  - type: input
    id: parts
    attributes:
      label: Parts
      description: Both driver names, and the breakout board if it differs.
      placeholder: icm20948 + ak09916 (Adafruit 4554)
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Board, OS and release, 32- or 64-bit, and kernel (`uname -srm`).
      placeholder: Raspberry Pi 4, Pi OS bookworm 64-bit, Linux 6.12.87 aarch64
    validations:
      required: true

  - type: input
    id: wiring
    attributes:
      label: Bus and wiring
      description: >-
        I2C or SPI, the device node and addresses, and the interrupt GPIOs —
        or `int_gpio = 0` if it polled.
      placeholder: I2C on /dev/i2c-1, IMU 0x68, mag 0x0C, INT on GPIO 17, no mag INT
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "`imud-imutest --version`."
      placeholder: imud-imutest 1.9.1
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: The report
      description: >-
        Attach the Markdown file it wrote, or paste it whole. Please do not
        summarise — the inline thresholds and the raw appendix are what a
        reviewer reads.
    validations:
      required: true

  - type: textarea
    id: bench
    attributes:
      label: What the report cannot know
      description: >-
        Anything that explains a WARN or a FAIL — an unlevel surface, a board
        that moved, magnetic clutter, a busy machine. And how many times you ran
        it.

  - type: checkboxes
    id: conditions
    attributes:
      label: The run
      options:
        - label: >-
            All three guided phases prompted me and I did them. Leave unticked
            for a passive-only run.
        - label: The daemon was stopped, or `--force` was used.
