# imud — driver PROSE
#
# The driver table in docs/manual.md §5 is GENERATED by tools/gen-drivers.py
# from src/drivers.c and the *_ops initialisers, and so are the driver-name
# and supported-rate lists in the [imu] and [mag] config-key documentation.
#
# From the code: the name a config file writes, whether the driver is
# registered as an IMU, a magnetometer or both, whether it is experimental,
# and the SPI mode and clock it offers.  Not from the code, and therefore
# here: which physical part it drives, the I2C address range, which GPIO the
# reference wiring uses, WHY a part is not offered on SPI, and the notes.
#
# Keyed by driver name — the name a config file writes — because that is what
# the table is a list of.  `sim` is registered in both registries and appears
# once, typed from that membership rather than from a field here.
#
# `notes` does NOT carry the *Experimental.* prefix: that comes from
# .experimental in the ops initialiser, which is the fact rather than a
# restatement of it.
#
# Adding a driver: write src/drivers/<part>.c, register it in src/drivers.c,
# add an entry here, run `make docs-tables`.


[drivers.ism330dhcx]
chip = 'ST ISM330DHCX'
i2c_addr = '0x6A–0x6B'
gpio = 'BCM 17 · pin 11'
spi_override = ''
notes = 'Primary reference IMU. FIFO + hardware timestamp. ODR 12–6664 Hz.'

[drivers.icm20948]
chip = 'TDK ICM-20948'
i2c_addr = '0x68–0x69'
gpio = 'BCM 17 · pin 11'
spi_override = 'no — AKM compass behind the bypass'
notes = 'Includes a built-in AK09916 mag via I²C master. No hardware timestamp.'

[drivers.icm42688p]
chip = 'TDK ICM-42688-P'
i2c_addr = '0x68–0x69'
gpio = 'BCM 17 · pin 11'
spi_override = ''
notes = 'Best-in-class noise floor. FIFO + hardware timestamp. ODR 12–32000 Hz — **16000 and 32000 will not run on a Pi**, see below.'

[drivers.lsm6dso]
chip = 'ST LSM6DSO'
i2c_addr = '0x6A–0x6B'
gpio = 'BCM 17 · pin 11'
spi_override = ''
notes = 'Near-clone of ISM330DHCX. ODR 12–6664 Hz.'

[drivers.lsm6dsox]
chip = 'ST LSM6DSOX'
i2c_addr = '0x6A–0x6B'
gpio = 'BCM 17 · pin 11'
spi_override = ''
notes = 'LSM6DSO with ML core; same driver.'

[drivers.mpu9250]
chip = 'TDK MPU-9250'
i2c_addr = '0x68–0x69'
gpio = 'BCM 17 · pin 11'
spi_override = 'no — AKM compass behind the bypass'
notes = 'Includes an AK8963 mag via I²C bypass. No hardware timestamp; 512-byte FIFO. NRND.'

[drivers.mpu9255]
chip = 'TDK MPU-9255'
i2c_addr = '0x68–0x69'
gpio = 'BCM 17 · pin 11'
spi_override = 'no — as `mpu9250`'
notes = 'MPU-9250 with a different `WHO_AM_I`; same driver.'

[drivers.sim]
chip = '—'
i2c_addr = '—'
gpio = 'none'
spi_override = 'n/a'
notes = 'Software simulation of a small boat under way. No hardware. Set `int_gpio = 0` on both.'

[drivers.mmc5983ma]
chip = 'MEMSIC MMC5983MA'
i2c_addr = '0x30'
gpio = 'BCM 27 · pin 13'
spi_override = ''
notes = 'Primary reference mag. 18-bit, SET/RESET coil. Do not set the IMU spi_speed_hz below 2.5 MHz while this part shares the controller — it stops measuring.'

[drivers.ak09916]
chip = 'AKM AK09916'
i2c_addr = '0x0C'
gpio = 'none (polling)'
spi_override = 'no — part has no SPI port'
notes = 'Used via the ICM-20948 I²C bypass; no external INT pin.'

[drivers.ak8963]
chip = 'AKM AK8963'
i2c_addr = '0x0C'
gpio = 'none (polling)'
spi_override = 'no — part has no SPI port'
notes = 'The MPU-9250/9255 compass, via I²C bypass. Applies the factory fuse-ROM sensitivity correction. Not the same part as AK09916.'

[drivers.lis3mdl]
chip = 'ST LIS3MDL'
i2c_addr = '0x1C–0x1E'
gpio = 'BCM 27 · pin 13'
spi_override = ''
notes = '''
Popular standalone mag. ±4 G fixed. ODR 1–155 Hz; the part's 300/560/1000 Hz modes need a lower-performance setting and are not offered, see below.'''

[drivers.lis2mdl]
chip = 'ST LIS2MDL'
i2c_addr = '0x1E'
gpio = 'BCM 27 · pin 13'
spi_override = 'no — 4-wire costs data-ready'
notes = 'LIS3MDL successor. Fixed ±50 G.'

[drivers.rm3100]
chip = 'PNI RM3100'
i2c_addr = '0x20–0x23'
gpio = 'BCM 27 · pin 13'
spi_override = ''
notes = '''
Magneto-inductive, not AMR: no SET/RESET coil, so `set_period_s` does nothing here. ODR 1–600 Hz, but the top two rungs cost resolution — the cycle count sets both gain and rate ceiling, and the driver drops it from 200 to 100 above 150 Hz and to 50 above 300 Hz. Three separate coils plus an ASIC, so the axis assignment is your wiring: the driver assumes the manual's NED layout.'''
