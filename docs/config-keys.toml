  names = ["stats_hz"]
  fields = ["log_stats_hz"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 1'
  scope = ""
  man_style = "tight"
  man = '''
Rate of the
.B [stats]
heartbeat line.
Only visible at
.B info
or
.B debug
level.'''
  md_type = 'int'
  md_default = '`1`'
  desc = 'Rate of the `[stats]` heartbeat log line. Only visible at `level = "info"` or `"debug"`.'

[[section]]
