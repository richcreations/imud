  fields = ["pos_signalk_port"]
  macros = ["NEED_PORT"]
  type = 'int'
  default = 'default:\ 3000'
  scope = ""
  man_style = "tight"
  man = 'HTTP port of the SignalK server.'
  md_type = 'int'
  md_default = '`3000`'
