md_groups = [["declination_deg", "lat_deg", "lon_deg", "wmm_file"], ["gpsd_enabled", "gpsd_host", "gpsd_port"], ["signalk_enabled", "signalk_host", "signalk_port", "signalk_path"], ["fix_max_age_h"]]

