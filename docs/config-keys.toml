# imud — config-key registry
#
# THE single source for every key src/config.c parses: 150 keys across 12
# core sections and 5 bridges.  tools/gen-config-docs.py renders the man5
# .TP blocks, the docs/manual.md tables and test/test_config_defaults.gen.c
# from this file, and tools/check-docs.py asserts this file and apply_kv()
# describe the same set of keys, with the same fields and the same macros,
# in both directions.
#
# The prose was EXTRACTED from the existing pages rather than retyped, and
# the first generator run reproduced them byte for byte.  That identity is
# the evidence the migration preserved the documentation instead of
# paraphrasing it — 150 keys is far past what hand-transcription survives.
# Keep it true: after editing this file the only diff should be the edit.
#
# Strings are TOML LITERAL strings, because roff is mostly backslashes and
# a basic string would eat every escape in the file.
#
# Per entry:
#   names      one entry may document several keys — imud-mqtt's username
#              and password share a type, a default and a description
#   fields     the imud_config_t member each name writes, without the `cfg->`
#   macros     the NEED_* macro apply_kv() applies to it
#              Both are lists PARALLEL TO names, so an entry covering several
#              keys still says which field each one lands in.  [mount]'s three
#              keys are '' in both: they are hand-rolled blocks that set
#              several members at once (mount_set, mount_rot, mount_euler_deg)
#              or, for `preset`, match a name and store nothing.  Everything
#              downstream treats '' as "no single field to assert".
#   type       as written in the docs (int, string, array of 9, ...)
#   default    as written and roff-escaped, or 'unset'
#   scope      hot | restart | ''  (blank where the page states it once
#              per section instead of per key)
#   man        the roff body of the .TP entry
#   desc       the markdown Description cell
#   man_style  the core page writes  .RI (int,\ default:\ 833)
#              the bridges write     .RI ( int ,\ default:\ 5 )\ [hot]
#              Same fact, two spellings.  Preserved so regeneration is a
#              no-op; unifying them is a separate change with a visible
#              diff, which is how it should be.


[[section]]
name = "mount"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["rotation_euler_deg", "preset", "rotation_matrix"]]

  [[section.key]]
  names = ["rotation_euler_deg"]
  fields = [""]
  macros = [""]
  type = 'array'
  default = 'default:\ [0.0,\ 0.0,\ 0.0]'
  scope = ""
  man_style = "tight"
  man = '''
Rotation as [roll, pitch, yaw] in degrees.
Applied as R = Rz(yaw) x Ry(pitch) x Rx(roll).
Only the yaw component is normally non-zero; set it to correct for
the angle between the chip X axis and the vessel bow.
Exactly three values are required; a shorter or longer array is a
fatal configuration error.'''
  md_type = 'array'
  md_default = '`[0.0, 0.0, 0.0]`'
  desc = '`[roll, pitch, yaw]` in degrees. Measure the angle between chip X and the forward axis once (e.g. with a handbearing compass on a vessel); set that as `yaw`.'

  [[section.key]]
  names = ["rotation_matrix"]
  fields = [""]
  macros = [""]
  type = 'array\ of\ 9'
  default = 'unset'
  scope = ""
  man_style = "tight"
  man = '''
Board-to-body rotation given directly, row-major, as
v_body = R x v_board.
An alternative to
.B rotation_euler_deg
for installations whose rotation is known as a matrix.
Validated at load against R^T R = I and det(R) = +1;
a non-orthonormal matrix or a reflection (det = -1, typically a
sign-flipped axis) is a fatal configuration error.'''
  md_type = 'array of 9'
  md_default = '*(unset)*'
  desc = 'Board→body rotation given directly, row-major (`v_body = R · v_board`). Validated at load against `RᵀR = I` and `det(R) = +1`; a non-orthonormal matrix or a reflection is a fatal config error. Whichever mount key appears last wins.'

  [[section.key]]
  names = ["preset"]
  fields = [""]
  macros = [""]
  type = 'string'
  default = 'unset'
  scope = ""
  man_style = "tight"
  man = '''
Named rotation shortcut.
One of:
.BR identity ,
.BR yaw_90 ,
.BR yaw_180 ,
.BR yaw_270 ,
.BR roll_90 ,
.BR roll_270 ,
.BR pitch_90 ,
.BR pitch_270 .
Overrides
.B rotation_euler_deg
when set; whichever mount key appears last in the file wins.
An unrecognised preset name is a fatal configuration error \(em
starting with a silently wrong mount rotation would bias every sample.'''
  md_type = 'string'
  md_default = '*(unset)*'
  desc = 'Named shortcut: `"identity"`, `"yaw_90"`, `"yaw_180"`, `"yaw_270"`, `"roll_90"`, `"roll_270"`, `"pitch_90"`, `"pitch_270"`. Overrides `rotation_euler_deg` when set. An unrecognised name is a fatal config error.'

[[section]]
name = "device"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["i2c_bus", "gpio_chip", "sim_file", "sim_loop", "sim_speed"]]

  [[section.key]]
  names = ["i2c_bus"]
  fields = ["i2c_bus"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq/dev/i2c-1\(dq'
  scope = ""
  man_style = "tight"
  man = 'I2C bus device node.'
  md_type = 'string'
  md_default = '`"/dev/i2c-1"`'
  desc = 'I²C bus device node. Use `/dev/i2c-1` on Pi 4; `/dev/i2c-1` or `/dev/i2c-3` on Pi 5 depending on which header pins are used.'

  [[section.key]]
  names = ["gpio_chip"]
  fields = ["gpio_chip"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dqgpiochip0\(dq'
  scope = ""
  man_style = "tight"
  man = '''
gpiochip device name.
.B Run
.B gpiodetect
and use the chip it lists for the header pins:
the number is assigned by probe order and is not stable across kernels.
.B gpiochip0
is correct on Raspberry Pi 4, and on Raspberry Pi 5 with kernels from
mid-2024 onward, which renumber the RP1 controller to 0 like every other
model.
Earlier Pi 5 kernels exposed it as
.BR gpiochip4 ,
and Raspberry Pi OS keeps a
.B /dev/gpiochip4
symlink for compatibility \(em a symlink, not a second controller, so
either name reaches the same device where it exists.'''
  md_type = 'string'
  md_default = '`"gpiochip0"`'
  desc = 'gpiochip device name. **Run `gpiodetect` and use the chip it lists for the header pins** — the number comes from probe order and is not stable across kernels. `"gpiochip0"` is right on Pi 4, and on Pi 5 with kernels from mid-2024 onward (which renumber the RP1 controller to 0 like every other model). Earlier Pi 5 kernels exposed it as `"gpiochip4"`, and Pi OS keeps a `/dev/gpiochip4` symlink for compatibility — a symlink, not a second controller.'

  [[section.key]]
  names = ["sim_file"]
  fields = ["sim_file"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq\(dq'
  scope = ""
  man_style = "tight"
  man = '''
An .imucap capture for the sim driver to replay (with
.B driver
= \(dqsim\(dq in both
.B [imu]
and
.BR [mag] );
empty selects the built-in synthetic scenario.
.B imud --replay
.I FILE
is the shortcut form.
See
.BR imud (8)
and docs/capture.md.'''
  md_type = 'string'
  md_default = '`""`'
  desc = 'An `.imucap` capture for the sim driver to replay (`driver = "sim"` in both `[imu]` and `[mag]`); empty selects the built-in synthetic scenario. `imud --replay FILE` is the shortcut. See [capture & replay](capture.md).'

  [[section.key]]
  names = ["sim_loop"]
  fields = ["sim_loop"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = ""
  man_style = "tight"
  man = '''
Repeat the capture forever; sequence numbers and timestamps are rebased so
downstream consumers see a continuous stream.
Ignored under
.BR \-\-replay ,
which plays a file once and exits.'''
  md_type = 'bool'
  md_default = '`false`'
  desc = 'Repeat the capture forever; timestamps and sequence numbers are rebased to stay monotonic. Ignored under `--replay`, which plays a file once and exits.'

  [[section.key]]
  names = ["sim_speed"]
  fields = ["sim_speed"]
  macros = ["NEED_FLT"]
  type = 'float'
  default = 'default:\ 1.0'
  scope = ""
  man_style = "tight"
  man = '''
Playback pacing: 2.0 is double speed, 0 delivers as fast as the pipeline
accepts (offline regression runs).'''
  md_type = 'float'
  md_default = '`1.0`'
  desc = 'Playback pacing: `2.0` = double speed, `0` = as fast as the pipeline accepts.'

[[section]]
name = "capture"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["enabled", "dir", "max_mb", "max_files", "flush_s"]]

  [[section.key]]
  names = ["enabled"]
  fields = ["capture_enabled"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = ""
  man_style = "tight"
  man = '''
Record raw samples from both sensors, exactly as the drivers delivered them
(pre-mount, pre-calibration).'''
  md_type = 'bool'
  md_default = '`false`'
  desc = 'Record raw samples from both sensors.'

  [[section.key]]
  names = ["dir"]
  fields = ["capture_dir"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq/var/lib/imud\(dq'
  scope = ""
  man_style = "tight"
  man = 'Destination directory; files are named imud-YYYYMMDD-HHMMSS.imucap (UTC).'
  md_type = 'string'
  md_default = '`"/var/lib/imud"`'
  desc = 'Destination; files are `imud-YYYYMMDD-HHMMSS.imucap` (UTC).'

  [[section.key]]
  names = ["max_mb"]
  fields = ["capture_max_mb"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 256'
  scope = ""
  man_style = "tight"
  man = 'Start a new file when the current one reaches this size.  0 = unlimited.'
  md_type = 'int'
  md_default = '`256`'
  desc = 'Rotate the file at this size. `0` = unlimited.'

  [[section.key]]
  names = ["max_files"]
  fields = ["capture_max_files"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 8'
  scope = ""
  man_style = "tight"
  man = 'Keep at most this many capture files, deleting the oldest.  0 = keep all.'
  md_type = 'int'
  md_default = '`8`'
  desc = 'Keep the newest N files, deleting the oldest. `0` = keep all.'

  [[section.key]]
  names = ["flush_s"]
  fields = ["capture_flush_s"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 5'
  scope = ""
  man_style = "tight"
  man = 'Interval between flushes to storage.'
  md_type = 'int'
  md_default = '`5`'
  desc = 'Flush-to-storage interval, seconds.'

[[section]]
name = "imu"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["driver", "bus", "spi_dev", "spi_speed_hz", "i2c_addr", "int_gpio", "odr_hz", "accel_g", "gyro_dps", "fifo_wm", "int_grace", "poll_ms"]]

  [[section.key]]
  names = ["driver"]
  fields = ["imu_driver"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dqism330dhcx\(dq'
  scope = ""
  man_style = "tight"
  man = '''
Driver name:
.BR ism330dhcx ,
.BR icm20948 ,
.BR icm42688p ,
.BR lsm6dso ,
.BR lsm6dsox ,
.BR mpu9250 ,
.BR mpu9255 ,
or
.B sim
(software simulation, no hardware required).
Drivers other than
.B ism330dhcx
and
.B sim
are experimental (register map verified from datasheet; not yet validated
on hardware).'''
  md_type = 'string'
  md_default = '`"ism330dhcx"`'
  desc = 'Driver to load. See [Supported drivers](#5-supported-drivers).'

  [[section.key]]
  names = ["bus"]
  fields = ["imu_bus_kind"]
  macros = ["NEED_BUS_KIND"]
  type = 'string'
  default = 'default:\ "i2c"'
  scope = ""
  man_style = "tight"
  man = '''
Transport:
.B i2c
or
.BR spi .
SPI is faster per transfer, which is what unlocks the high sample rates and
shortens the FIFO drain.
Not every driver has SPI; the daemon refuses to start on one that does not.
The IMU and the magnetometer choose independently, so a SPI IMU alongside an
I2C compass is a legal rig.'''
  md_type = 'string'
  md_default = '`"i2c"`'
  desc = 'Transport: `"i2c"` or `"spi"`. SPI is faster per transfer, which is what unlocks the high sample rates and shortens the FIFO drain; not every driver has it, and the daemon refuses to start on one that does not (see [Supported drivers](#5-supported-drivers)). The IMU and the magnetometer choose independently.'

  [[section.key]]
  names = ["spi_dev"]
  fields = ["imu_spi_dev"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ ""'
  scope = ""
  man_style = "tight"
  man = '''
spidev node, for example
.IR /dev/spidev0.0 .
Required when
.BR "bus = \(dqspi\(dq" ;
ignored otherwise.
The chip select in the node name does the addressing, so
.B i2c_addr
is unused.'''
  md_type = 'string'
  md_default = '`""`'
  desc = 'spidev node, e.g. `"/dev/spidev0.0"` (CE0). **Required** when `bus = "spi"`; ignored otherwise. The chip select in the node name does the addressing, so `i2c_addr` is unused.'

  [[section.key]]
  names = ["spi_speed_hz"]
  fields = ["imu_spi_speed_hz"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 0'
  scope = ""
  man_style = "tight"
  man = '''
SPI clock in Hz.
.B 0
means the driver's datasheet maximum, which is the useful default.
A request above that maximum is clamped rather than refused, and the daemon
logs the rate it really programmed.
Setting this below 2.5\~MHz while a magnetometer shares the same SPI
controller stops that magnetometer measuring; the daemon warns at startup
when it sees that combination.'''
  md_type = 'int'
  md_default = '`0`'
  desc = '''
SPI clock in Hz. `0` means the driver's datasheet maximum, which is the useful default. A request above that maximum is clamped rather than refused, and the daemon logs what it really programmed. **Do not set this below 2.5 MHz when a magnetometer shares the same SPI controller.** Measured on an ism330dhcx + mmc5983ma pair: driving the IMU below about 2.2 MHz stops the magnetometer completing measurements entirely, and re-running `init()` cannot hold it. The default is unaffected, and the daemon warns at startup when it sees a slow clock alongside a shared-bus magnetometer.'''

  [[section.key]]
  names = ["i2c_addr"]
  fields = ["imu_addr"]
  macros = ["NEED_I2C_ADDR"]
  type = 'int'
  default = 'default:\ 0x6B'
  scope = ""
  man_style = "tight"
  man = '''
I2C address; used only when
.BR "bus = \(dqi2c\(dq" .
ISM330DHCX: 0x6B (SA0 high) or 0x6A (SA0 low).'''
  md_type = 'int'
  md_default = '`0x6B`'
  desc = 'I²C address; used only when `bus = "i2c"`. `0x6B` (SA0 high) or `0x6A` (SA0 low via jumper).'

  [[section.key]]
  names = ["int_gpio"]
  fields = ["imu_int_gpio"]
  macros = ["NEED_GPIO"]
  type = 'int'
  default = 'default:\ 17'
  scope = ""
  man_style = "tight"
  man = '''
BCM GPIO number for the FIFO watermark interrupt.
Set
.B 0
to poll instead.  The polling cadence is then the same
.B fifo_wm
+
.B int_grace
sample periods the interrupt path waits for,
unless
.B poll_ms
overrides it.'''
  md_type = 'int'
  md_default = '`17`'
  desc = 'BCM GPIO number for the FIFO watermark interrupt (board pin 11). Set `0` to poll instead of using a hardware interrupt. The polling cadence is then the same `fifo_wm + int_grace` sample periods the interrupt path waits for, unless `poll_ms` overrides it: a flat cadence under-polls at high ODR, where the FIFO overflows and the effective rate drops below the configured one, and burns reads at low ODR.'

  [[section.key]]
  names = ["odr_hz"]
  fields = ["imu_odr_mhz"]
  values_from = "ism330dhcx.supported_odr_mhz"
  macros = ["NEED_POS_MHZ"]
  type = 'int'
  default = 'default:\ 833'
  scope = ""
  man_style = "tight"
  man = '''
Output data rate in Hz; must be greater than zero.
A rate the chip cannot produce is rounded
.I up
to the next one it can, and the filter is tuned for that actual rate; the
daemon logs both at startup when they differ.
ISM330DHCX supports: {values}.
Rates above 1666 need
.BR "bus = \(dqspi\(dq" .'''
  md_type = 'int'
  md_default = '`833`'
  desc = 'Output data rate in Hz; must be greater than zero. A rate the chip cannot produce is rounded **up** to the next one it can, and the filter is tuned for that actual rate — the daemon logs `requested, N Hz actual` at startup when the two differ. ISM330DHCX supports: {values}. Other drivers differ — see the driver table in [Supported drivers](#5-supported-drivers), and note that the top rates of some parts are beyond what a Raspberry Pi can sustain.'

  [[section.key]]
  names = ["accel_g"]
  fields = ["imu_accel_g"]
  values_from = "ism330dhcx.supported_accel_g"
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 8'
  scope = ""
  man_style = "tight"
  man = '''
Accelerometer full-scale range in g.
ISM330DHCX: {values}.'''
  md_type = 'int'
  md_default = '`8`'
  desc = 'Accelerometer full-scale range in g. ISM330DHCX: {values}.'

  [[section.key]]
  names = ["gyro_dps"]
  fields = ["imu_gyro_dps"]
  values_from = "ism330dhcx.supported_gyro_dps"
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 2000'
  scope = ""
  man_style = "tight"
  man = '''
Gyroscope full-scale range in degrees/second.
ISM330DHCX: {values}.'''
  md_type = 'int'
  md_default = '`2000`'
  desc = 'Gyroscope full-scale range in degrees/second. ISM330DHCX: {values}.'

  [[section.key]]
  names = ["fifo_wm"]
  fields = ["imu_fifo_wm"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 64'
  scope = ""
  man_style = "tight"
  man = '''
FIFO watermark in sample-sets: how deep the chip buffers before
raising its interrupt.
This sets both buffer depth and, with
.BR int_grace ,
sample latency: the reader waits
.RB \(dq fifo_wm\ +\ int_grace \(dq
sample periods, so a watermark of 64 at 833\~Hz batches about 77\~ms.
Earlier releases documented this key as having
.I no
effect on latency, from a bench run that measured the same 33\~ms
residence at every setting.
That measurement was real and its conclusion was wrong: the reader then
used a flat 10\~ms fallback, which drained before the watermark could
assert and, because a level watermark deasserts once a drain empties
the FIFO, suppressed the interrupt entirely at nine of the ten rates.
The key was inert because its own safety net pre-empted it.
On the ST parts a watermark of 8 or more also batches the chip
timestamp into the FIFO, which costs 1.6\~% of the word budget at
32 and above \(en so the same watermark holds about 63 sample-sets
rather than 64.'''

  md_type = 'int'
  md_default = '`64`'
  desc = '''FIFO watermark in sample-sets: how deep the chip buffers before raising its interrupt. This sets **both buffer depth and sample latency** — with `int_grace`, the reader waits `fifo_wm + int_grace` sample periods, so 64 at 833 Hz batches about 77 ms. Earlier releases documented this key as having *no* effect on latency, citing a bench run that measured the same 33 ms residence at every setting. That measurement was real and the conclusion drawn from it was wrong: the reader then used a flat 10 ms fallback, which drained before the watermark could assert — and because a level watermark deasserts as soon as a drain empties the FIFO, the interrupt was suppressed entirely at nine of the ten ISM330DHCX rates. The key was inert because its own safety net pre-empted it. On the ST parts a watermark of 8 or more also batches the chip timestamp into the FIFO (§1.1); at 32 and above that costs 1.6% of the word budget, so the same watermark holds about 63 sample-sets rather than 64.'''
  [[section.key]]
  names = ["int_grace"]
  fields = ["imu_int_grace"]
  macros = ["NEED_POS_INT"]
  type = 'int'
  default = 'default:\ 2'
  scope = ""
  man_style = "tight"
  man = '''
How late the interrupt may be, in SAMPLES, before the reader gives up
and reads anyway.
The wait is
.RB \(dq fifo_wm\ +\ int_grace \(dq
sample periods, so the fallback fires only when the line is genuinely
late \(en never merely because the batch is not ready yet.
Counted in samples rather than milliseconds because a fixed time means
a different thing at every rate: 2\~ms is thirteen samples at
6664\~Hz and three hundredths of one at 13\~Hz.
Ignored when
.B int_gpio
is 0, where there is no expected arrival to be late against.'''
  md_type = 'int'
  md_default = '`2`'
  desc = '''How late the interrupt may be, in **samples**, before the reader gives up and reads anyway. The wait is `fifo_wm + int_grace` sample periods, so the fallback fires only when the line is genuinely *late* — never merely because the batch is not ready yet. Counted in samples rather than milliseconds because a fixed time means a different thing at every rate: 2 ms is thirteen samples at 6664 Hz and three hundredths of one at 13 Hz. Ignored when `int_gpio = 0`, where there is no expected arrival to be late against.'''

  [[section.key]]
  names = ["poll_ms"]
  fields = ["imu_poll_ms"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 0'
  scope = ""
  man_style = "tight"
  man = '''
Polling cadence in milliseconds for an install with
.B no
interrupt line.
0 derives it from the rate and watermark, which is what you want: a
fixed interval under-polls at high ODR \(en the FIFO overflows and the
delivered rate falls below the configured one \(en and burns reads at
low ODR.
Set a value only to force a specific cadence.
Ignored entirely when
.B int_gpio
is non-zero.'''
  md_type = 'int'
  md_default = '`0`'
  desc = '''Polling cadence in milliseconds for an install with **no** interrupt line. `0` derives it from the rate and watermark, which is normally what you want: a fixed interval under-polls at high ODR — the FIFO overflows and the delivered rate falls below the configured one — and burns reads at low ODR. Set a non-zero value only to force a specific cadence. **Ignored entirely when `int_gpio` is non-zero.**'''

[[section]]
name = "mag"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["driver", "bus", "spi_dev", "spi_speed_hz", "i2c_addr", "int_gpio", "odr_hz", "set_period_s", "int_grace", "poll_ms"]]

  [[section.key]]
  names = ["driver"]
  fields = ["mag_driver"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dqmmc5983ma\(dq'
  scope = ""
  man_style = "tight"
  man = '''
Driver name:
.BR mmc5983ma ,
.BR ak09916 ,
.BR ak8963 ,
.BR lis3mdl ,
.BR lis2mdl ,
.BR rm3100 ,
or
.BR sim .
Drivers other than
.B mmc5983ma
and
.B sim
are experimental.'''
  md_type = 'string'
  md_default = '`"mmc5983ma"`'
  desc = 'Driver to load. See [Supported drivers](#5-supported-drivers).'

  [[section.key]]
  names = ["bus"]
  fields = ["mag_bus_kind"]
  macros = ["NEED_BUS_KIND"]
  type = 'string'
  default = 'default:\ "i2c"'
  scope = ""
  man_style = "tight"
  man = '''
Transport:
.B i2c
or
.BR spi .
SPI is faster per transfer, which is what unlocks the high sample rates and
shortens the FIFO drain.
Not every driver has SPI; the daemon refuses to start on one that does not.
The IMU and the magnetometer choose independently, so a SPI IMU alongside an
I2C compass is a legal rig.'''
  md_type = 'string'
  md_default = '`"i2c"`'
  desc = '''
Transport: `"i2c"` or `"spi"`, as for `[imu]` above. The AKM compasses (`ak09916`, `ak8963`) are I²C-only — they have no SPI port and are reached through the host IMU's bypass.'''

  [[section.key]]
  names = ["spi_dev"]
  fields = ["mag_spi_dev"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ ""'
  scope = ""
  man_style = "tight"
  man = '''
spidev node, for example
.IR /dev/spidev0.1 .
Required when
.BR "bus = \(dqspi\(dq" ;
ignored otherwise.
The chip select in the node name does the addressing, so
.B i2c_addr
is unused.'''
  md_type = 'string'
  md_default = '`""`'
  desc = 'spidev node, e.g. `"/dev/spidev0.1"` (CE1 — the IMU usually takes CE0). **Required** when `bus = "spi"`.'

  [[section.key]]
  names = ["spi_speed_hz"]
  fields = ["mag_spi_speed_hz"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 0'
  scope = ""
  man_style = "tight"
  man = '''
SPI clock in Hz.
.B 0
means the driver's datasheet maximum, which is the useful default.
A request above that maximum is clamped rather than refused, and the daemon
logs the rate it really programmed.
This part's own clock is not the hazard: it is the
.B [imu]
clock that stops a shared-bus magnetometer.'''
  md_type = 'int'
  md_default = '`0`'
  desc = '''
SPI clock in Hz; `0` means the driver's datasheet maximum. As for `[imu]`. Note that a magnetometer's *own* clock is not what starves it on a shared controller — a slow `[imu] spi_speed_hz` is. This key can be lowered safely.'''

  [[section.key]]
  names = ["i2c_addr"]
  fields = ["mag_addr"]
  macros = ["NEED_I2C_ADDR"]
  type = 'int'
  default = 'default:\ 0x30'
  scope = ""
  man_style = "tight"
  man = '''
I2C address; used only when
.BR "bus = \(dqi2c\(dq" .
MMC5983MA has a fixed address (0x30).
The AKM compasses are I2C-only: they have no SPI port.
The AKM compasses inside a 9-axis IMU
.RB ( ak09916
in the ICM-20948,
.B ak8963
in the MPU-9250/9255) are reached through the host chip's I2C
.IR bypass ,
not its I2C master, and answer on the host bus at 0x0C.'''
  md_type = 'int'
  md_default = '`0x30`'
  desc = '''
I²C address; used only when `bus = "i2c"`. MMC5983MA has a fixed address. The AKM compasses inside a 9-axis IMU — AK09916 in the ICM-20948, AK8963 in the MPU-9250/9255 — sit behind the host chip's I²C **bypass**, not its I²C master, and answer on the host bus at their own address: set `0x0C` for both.'''

  [[section.key]]
  names = ["int_gpio"]
  fields = ["mag_int_gpio"]
  macros = ["NEED_GPIO"]
  type = 'int'
  default = 'default:\ 27'
  scope = ""
  man_style = "tight"
  man = '''
BCM GPIO for the measurement-done interrupt.
Set
.B 0
to use a polling timer.'''
  md_type = 'int'
  md_default = '`27`'
  desc = 'BCM GPIO number for the measurement-done interrupt (board pin 13). Set `0` to poll on a timer.'


  [[section.key]]
  names = ["int_grace"]
  fields = ["mag_int_grace"]
  macros = ["NEED_POS_INT"]
  type = 'int'
  default = 'default:\ 2'
  scope = ""
  man_style = "tight"
  man = '''
How late the interrupt may be, in SAMPLES, before the reader gives up
and reads anyway.
These magnetometers have no FIFO, so the line signals one finished
conversion and the wait is
.RB \(dq 1\ +\ int_grace \(dq
sample periods, so the fallback fires only when the line is genuinely
late \(en never merely because the batch is not ready yet.
Counted in samples rather than milliseconds because a fixed time means
a different thing at every rate: 2\~ms is thirteen samples at
6664\~Hz and three hundredths of one at 13\~Hz.
Ignored when
.B int_gpio
is 0, where there is no expected arrival to be late against.'''
  md_type = 'int'
  md_default = '`2`'
  desc = '''How late the interrupt may be, in **samples**, before the reader gives up and reads anyway. These magnetometers have no FIFO, so the line signals one finished conversion and the wait is `1 + int_grace` sample periods, so the fallback fires only when the line is genuinely *late* — never merely because the batch is not ready yet. Counted in samples rather than milliseconds because a fixed time means a different thing at every rate: 2 ms is thirteen samples at 6664 Hz and three hundredths of one at 13 Hz. Ignored when `int_gpio = 0`, where there is no expected arrival to be late against.'''

  [[section.key]]
  names = ["poll_ms"]
  fields = ["mag_poll_ms"]
  macros = ["NEED_INT"]
  type = 'int'
  default = 'default:\ 0'
  scope = ""
  man_style = "tight"
  man = '''
Polling cadence in milliseconds for an install with
.B no
interrupt line.
0 derives it from the rate, which is what you want: a
fixed interval under-polls at high ODR \(en the FIFO overflows and the
delivered rate falls below the configured one \(en and burns reads at
low ODR.
Set a value only to force a specific cadence.
Ignored entirely when
.B int_gpio
is non-zero.'''
  md_type = 'int'
  md_default = '`0`'
  desc = '''Polling cadence in milliseconds for an install with **no** interrupt line. `0` derives it from the rate, which is normally what you want: a fixed interval under-polls at high ODR — the FIFO overflows and the delivered rate falls below the configured one — and burns reads at low ODR. Set a non-zero value only to force a specific cadence. **Ignored entirely when `int_gpio` is non-zero.**'''
  [[section.key]]
  names = ["odr_hz"]
  fields = ["mag_odr_mhz"]
  values_from = "mmc5983ma.supported_odr_mhz"
  macros = ["NEED_POS_MHZ"]
  type = 'int'
  default = 'default:\ 100'
  scope = ""
  man_style = "tight"
  man = '''
Output data rate in Hz; must be greater than zero.
Rounded
.I up
to a supported rate as for
.BR [imu]\ odr_hz .
MMC5983MA supports: {values}.'''
  md_type = 'int'
  md_default = '`100`'
  desc = 'Output data rate in Hz; must be greater than zero. Rounded **up** to a supported rate as for `[imu] odr_hz`, and the mag noise variance is sized for that actual rate. MMC5983MA supports: {values}.'

  [[section.key]]
  names = ["set_period_s"]
  fields = ["mag_set_period_s"]
  macros = ["NEED_FLT"]
  type = 'float'
  default = 'default:\ 5.0'
  scope = ""
  man_style = "tight"
  man = '''
Interval in seconds between degauss (SET/RESET) pulses.
Set
.B 0
to disable.'''
  md_type = 'float'
  md_default = '`5.0`'
  desc = 'Interval in seconds between SET/RESET degauss pulses. Prevents gradual magnetisation of the sensor. Set `0` to disable.'

[[section]]
name = "fusion"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["mekf_gyro_noise", "mekf_gyro_bias", "mekf_accel_noise", "mekf_mag_noise", "mekf_wave_accel", "mekf_wave_accel_tau_s", "mekf_mag_dip_sigma_deg", "mag_reject_gauss", "accel_skip_thresh", "mag_yaw_only", "heave_tau_s", "wave_tau_s", "engine_vibration_g2", "engine_accel_skip_thresh"]]

  [[section.key]]
  names = ["mekf_gyro_noise"]
  fields = ["mekf_gyro_noise"]
  macros = ["NEED_POS_DBL"]
  type = 'double'
  default = 'default:\ 0.007'
  scope = ""
  man_style = "tight"
  man = 'Gyro noise density in rad/s/sqrt(Hz).'
  md_type = 'double'
  md_default = '`0.007`'
  desc = 'Gyro noise density in rad/s/√Hz. ISM330DHCX datasheet: 7 mdps/√Hz ≈ 0.000122 rad/s/√Hz.'

  [[section.key]]
  names = ["mekf_gyro_bias"]
  fields = ["mekf_gyro_bias"]
  macros = ["NEED_POS_DBL"]
  type = 'double'
  default = 'default:\ 0.00015'
  scope = ""
  man_style = "tight"
  man = 'In-run gyro bias instability in rad/s.'
  md_type = 'double'
  md_default = '`0.00015`'
  desc = 'In-run gyro bias instability in rad/s. Sets the bias random-walk process noise.'

  [[section.key]]
  names = ["mekf_accel_noise"]
  fields = ["mekf_accel_noise"]
  macros = ["NEED_POS_DBL"]
  type = 'double'
  default = 'default:\ 0.0022'
  scope = ""
  man_style = "tight"
  man = '''
Accelerometer noise density in m/s^2/sqrt(Hz).
This describes SENSOR noise only. Resist the temptation to raise it to
"account for wave acceleration" \(em that is what
.B mekf_wave_accel
below is for.
Across the 12-seed wave benchmark the default is a sharp local optimum for
the marine (yaw-only) configuration, and values in the range 0.003 to 0.03
are substantially worse than either side of it: the gravity correction
weakens, the filter leans on gyro integration, gyro-bias observability
degrades, and the growing errors feed back through the innovation gate.
The
.B nis_accel
field on the wire reports whether the noise model matches reality (1.0 =
consistent); check it against a real capture before changing this.
Must be greater than zero \(em zero or negative is rejected at load, since it
would make the Kalman gain degenerate.'''
  md_type = 'double'
  md_default = '`0.0022`'
  desc = 'Accelerometer **sensor** noise density in m/s²/√Hz. ISM330DHCX: ~186 µg/√Hz × 9.81. Not the knob for rough weather — see `mekf_wave_accel`.'

  [[section.key]]
  names = ["mekf_mag_noise"]
  fields = ["mekf_mag_noise"]
  macros = ["NEED_POS_DBL"]
  type = 'double'
  default = 'default:\ 0.0004'
  scope = ""
  man_style = "tight"
  man = 'Magnetometer noise density in Gauss/sqrt(Hz).'
  md_type = 'double'
  md_default = '`0.0004`'
  desc = 'Magnetometer noise density in Gauss/√Hz. MMC5983MA: 0.4 mGauss RMS.'

  [[section.key]]
  names = ["mekf_wave_accel"]
  fields = ["mekf_wave_accel"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 0.8'
  scope = ""
  man_style = "tight"
  man = '''
Steady-state standard deviation, in m/s^2, of the wave-orbital acceleration
that contaminates the gravity measurement in a seaway. This is the knob for
"the sea is rough", not
.BR mekf_accel_noise .
.IP
The disturbance is correlated over roughly a second rather than white, so it
is modelled as a first-order Gauss\(enMarkov process in the filter state.
Without that, the filter treats 833 strongly correlated samples per second as
833 independent measurements of gravity, collapses its own covariance and
diverges. Set to 0 (or set
.B mekf_wave_accel_tau_s
to 0) to disable the state entirely, which returns the pre\-1.7 six\-state
filter exactly.
.IP
Too small a value is the failure mode that hurts, so round up. Run
.B imud\-cal fit\-ra
on a capture of your worst conditions: it measures the disturbance with the
state disabled and prints a suggested value.'''
  md_type = 'double'
  md_default = '`0.8`'
  desc = 'Steady-state σ, in m/s², of the wave-orbital acceleration contaminating the gravity measurement. **This is the knob for "the sea is rough."** The disturbance is correlated over roughly a second rather than white, so it is carried as a first-order Gauss–Markov state; without it the filter treats 833 strongly correlated samples per second as 833 independent measurements of gravity and diverges. `0` (or `mekf_wave_accel_tau_s = 0`) disables the state and restores the pre-1.7 6-state filter exactly. Too small is the failure mode that hurts, so round up; `imud-cal fit-ra` measures it from a capture.'

  [[section.key]]
  names = ["mekf_wave_accel_tau_s"]
  fields = ["mekf_wave_accel_tau_s"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 0.5'
  scope = ""
  man_style = "tight"
  man = '''
Correlation time, in seconds, of the Gauss\(enMarkov wave-acceleration state.
0 disables the state.
.IP
Not to be confused with
.BR wave_tau_s ,
which is the unrelated sea\-state reporting window.
.IP
Attitude error and wave acceleration are separated only by their dynamics, so
too long a value lets the state absorb genuine tilt: the benchmark's yaw\-only
attitude RMS degrades from 2.3 degrees at 0.5 s to 7.1 degrees at 2 s. Short
is the safe side.'''
  md_type = 'double'
  md_default = '`0.5`'
  desc = 'Correlation time in seconds of the Gauss–Markov wave-acceleration state. `0` disables. **Unrelated to `wave_tau_s`**, which is the sea-state reporting window. Attitude error and wave acceleration are told apart only by their dynamics, so too long a value lets the state absorb genuine tilt: benchmark yaw-only attitude RMS degrades 2.3° at 0.5 s → 7.1° at 2 s. Short is the safe side.'

  [[section.key]]
  names = ["mekf_mag_dip_sigma_deg"]
  fields = ["mekf_mag_dip_sigma_deg"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 1.0'
  scope = ""
  man_style = "tight"
  man = '''
Uncertainty, in degrees, of the magnetic reference's DIP angle.
.IP
Applies only to 3\-D vector fusion
.RB ( mag_yaw_only
= false), where the field's dip is what constrains roll and pitch. The dip of
the reference is fixed once, at alignment, from the tilt estimate available at
that moment; in a seaway that is wrong by around a degree, and in this mode the
error becomes a permanent roll/pitch bias.
.IP
It cannot be corrected in run. The reference's in\-run healing is gated on the
platform being quiescent, deliberately: the accelerometer samples that pass the
motion gate in a seaway are wave\-phase correlated, and learning from that
subset walks the reference away from the truth rather than toward it (measured
over 30 minutes; opening the gate roughly triples the covariance
inconsistency). So the error is admitted into the covariance instead, as a
rank\-1 term along the one direction a dip error acts on.
.IP
The default is the residual measured after a 5 s
.BR align_window_sec ,
rounded up. Set to
.B 0
when a position source supplies WMM field invariants \(em that removes the dip
error at its source and is strictly better. Raising it improves covariance
consistency and lowers the
.B nis_mag
wire field, by design: the dip channel is being trusted less.'''
  md_type = 'double'
  md_default = '`1.0`'
  desc = '''
Uncertainty in degrees of the magnetic reference's **dip** angle. Applies only to 3-D vector fusion (`mag_yaw_only = false`), where the dip constrains roll and pitch — a wrong dip reference therefore biases them, permanently, and the error cannot be learned out at sea. It is admitted into the covariance instead, as a rank-1 anisotropic term in the magnetometer noise. Set `0` when a position source supplies WMM field invariants, which removes the error at its source and is strictly better. Raising it improves covariance consistency and lowers the `nis_mag` wire field by design.'''

  [[section.key]]
  names = ["mag_reject_gauss"]
  fields = ["mag_reject_gauss"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 0.05'
  scope = ""
  man_style = "tight"
  man = '''
Strong-anomaly cutoff: reject magnetometer updates whose post-calibration
residual exceeds this value (Gauss). Fine-grained consistency is handled by
internal chi-squared innovation gates; keep this a coarse threshold
(~10% of the Earth field).'''
  md_type = 'double'
  md_default = '`0.05`'
  desc = 'Strong-anomaly cutoff: reject a magnetometer measurement whose post-calibration residual exceeds this value (Gauss). Guards against nearby iron/magnets. Fine-grained consistency is handled internally by χ² innovation gates that self-scale with filter confidence, so keep this a coarse threshold (~10% of the Earth field).'

  [[section.key]]
  names = ["accel_skip_thresh"]
  fields = ["accel_skip_thresh"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 0.05'
  scope = ""
  man_style = "tight"
  man = '''
Skip accelerometer updates when
.RI |a|\(en1g
exceeds this fraction of g.'''
  md_type = 'double'
  md_default = '`0.05`'
  desc = 'Skip an accelerometer update if `||a| − 1g|` exceeds this fraction of g. Prevents linear acceleration from corrupting the tilt estimate. `0.05` = skip if more than 5% off 1g.'

  [[section.key]]
  names = ["mag_yaw_only"]
  fields = ["mag_yaw_only"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ true'
  scope = ""
  man_style = "tight"
  man = '''
Heading-only magnetometer fusion (marine default): the magnetometer corrects
heading and never pulls on roll/pitch. Set
.B false
for full 3D vector fusion (magnetically clean installs with a true 3D
calibration).'''
  md_type = 'bool'
  md_default = '`true`'
  desc = '''
Heading-only magnetometer fusion (marine default): the mag corrects heading and never pulls on roll/pitch. The swing-circle calibration is structurally 2D, so the field's vertical (dip) channel is its least-calibrated component. Set `false` for full 3D vector fusion — appropriate only for magnetically clean installs with a true 3D calibration.'''

  [[section.key]]
  names = ["heave_tau_s"]
  fields = ["heave_tau_s"]
  macros = ["NEED_FLT"]
  type = 'float'
  default = 'default:\ 12.0'
  scope = ""
  man_style = "tight"
  man = '''
Heave filter time constant, seconds. Vertical displacement from band-passed
double integration of vertical acceleration; feeds the $PASHR heave field
and the binary packet heave_m. Allow ~2 minutes settling after startup.
.B 0
disables.'''
  md_type = 'float'
  md_default = '`12.0`'
  desc = '''
Heave filter time constant in seconds. Heave (vertical displacement) is a band-passed double integration of vertical acceleration; it feeds the `$PASHR` heave field and the binary packet's `heave_m`. The passband covers ~2–15 s wave periods at the default; allow ~2 minutes of settling after startup. `0` disables (heave reads 0.0). Values far above the default are not useful — the passband stops covering waves — and were once actively dangerous: the filter's leak is sized by `dt/heave_tau_s`, and in single precision it stopped working entirely at a high ODR, turning a bounded band-pass into an unbounded double integrator (253 m of "heave" at 32 kHz with a 900 s constant). The accumulators are double precision as of this release, so the whole range now degrades gracefully; see [math.md §1](math.md).'''

  [[section.key]]
  names = ["wave_tau_s"]
  fields = ["wave_tau_s"]
  macros = ["NEED_FLT"]
  type = 'float'
  default = 'default:\ 120.0'
  scope = ""
  man_style = "tight"
  man = '''
Sea-state averaging window, seconds: significant wave height, mean
zero-crossing wave period, and the vessel's roll and pitch periods and
significant single amplitudes are exponentially weighted statistics of the
heave/roll/pitch oscillations over this window. Statistics settle ~2 windows
after the heave estimator itself settles. Requires
.B heave_tau_s
> 0.
.B 0
disables (the packet fields read 0.0).'''
  md_type = 'float'
  md_default = '`120.0`'
  desc = '''
Sea-state averaging window in seconds. Significant wave height (Hs = 4·σ(heave)), mean zero-crossing wave period, and the vessel's roll/pitch periods and significant single amplitudes (2σ) are exponentially weighted statistics of the heave/roll/pitch oscillations over this window (packet fields `wave_height_m`, `wave_period_s`, `roll_period_s`, `roll_amplitude`, `pitch_period_s`, `pitch_amplitude`, gated by the `wave_valid` flag). Stats settle ~2 windows after heave settles. Oceanographic practice is 10–20 minute records, and windows that long are supported — but note they interact with `[imu] odr_hz`, because the statistics' gain is `dt/wave_tau_s`. At 32 kHz with a 1200 s window that gain is 2.6e-8, which single precision cannot accumulate; significant wave height under-read by 18 % while still reporting `wave_valid`. Fixed by double-precision accumulators as of this release. Requires `heave_tau_s` > 0; `0` disables.'''

  [[section.key]]
  names = ["engine_vibration_g2"]
  fields = ["engine_vibration_g2"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 0.0'
  scope = ""
  man_style = "tight"
  man = '''
EMA threshold (m^2/s^4) for engine-vibration detection.
Set
.B 0
to disable.'''
  md_type = 'double'
  md_default = '`0.0`'
  desc = 'EMA threshold (m²/s⁴) for engine-vibration detection. The filter tracks an exponential moving average of `(|a| − g)²`; when it exceeds this value the engine is considered on. Set `0` to disable (default).'

  [[section.key]]
  names = ["engine_accel_skip_thresh"]
  fields = ["engine_accel_skip_thresh"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 0.20'
  scope = ""
  man_style = "tight"
  man = '''
Accelerometer skip threshold override applied while engine vibration is
detected (wider gate; accel noise is additionally inflated 4x).'''
  md_type = 'double'
  md_default = '`0.20`'
  desc = '''
Accelerometer skip threshold applied while engine vibration is detected: wider than `accel_skip_thresh` so the filter isn't starved, while the accel noise is inflated ×4 so the vibration-contaminated samples that pass are trusted proportionally less. Only active when `engine_vibration_g2 > 0`.'''

[[section]]
name = "calibration"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["file", "startup_settle_sec", "align_window_sec", "gyro_bias_sec"]]

  [[section.key]]
  names = ["file"]
  fields = ["cal_file"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq/etc/imud/cal.json\(dq'
  scope = ""
  man_style = "tight"
  man = '''
Path to the calibration file produced by
.BR imud-cal (8).
Supports
.B ~/
expansion.'''
  md_type = 'string'
  md_default = '`"/etc/imud/cal.json"`'
  desc = 'Path to the calibration JSON produced by `imud-cal`. Supports `~/` expansion. If the file does not exist, imud runs uncalibrated (magnetometer readings will be biased).'

  [[section.key]]
  names = ["startup_settle_sec"]
  fields = ["startup_settle_sec"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 5.0'
  scope = ""
  man_style = "tight"
  man = '''
Seconds to discard sensor output after chip initialisation.
Set
.B 0
for the
.B sim
driver.'''
  md_type = 'double'
  md_default = '`5.0`'
  desc = 'Seconds of sensor data to discard after chip initialisation. The ISM330DHCX gyro drifts ~0.02 rad/s for ~5 s after power-on; discarding this window keeps it out of the bias estimate. Set `0` for the `sim` driver.'

  [[section.key]]
  names = ["gyro_bias_sec"]
  fields = ["gyro_bias_sec"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 2.0'
  scope = ""
  man_style = "tight"
  man = '''
Length of the stationary bias-estimation window at startup.
Set
.B 0
to skip.'''
  md_type = 'double'
  md_default = '`2.0`'
  desc = 'Length of the stationary window used to estimate gyro bias at startup. The board must be still for this duration. Skipped if the cal file already has a gyro bias. If motion is detected during the window (gyro std > 0.5 °/s) the window is doubled once and a warning is logged. Set `0` to skip bias estimation.'

  [[section.key]]
  names = ["align_window_sec"]
  fields = ["align_window_sec"]
  macros = ["NEED_DBL"]
  type = 'double'
  default = 'default:\ 5.0'
  scope = ""
  man_style = "tight"
  man = '''
Seconds of accelerometer and magnetometer averaging used for the one\-shot
initial attitude alignment.
.IP
Whatever tilt error survives this window is baked permanently into the magnetic
reference's dip, so in a seaway the length matters. One second \(em the value
hardcoded before 1.7 \(em is about a fifth of a typical roll period, so it
aligns to an arbitrary point in the cycle: measured attitude RMS in the marine
default is 47.7 degrees at a 1 s window against 2.19 degrees at 5 s, flat
beyond. 3\-D vector fusion keeps improving out to roughly 15 s.
.IP
The only cost of a longer window is startup latency before the filter produces
usable attitude, so raising it is worthwhile when starting from a mooring and
not when starting underway.'''
  md_type = 'double'
  md_default = '`5.0`'
  desc = '''
Seconds of accelerometer and magnetometer averaging used for the one-shot initial attitude alignment. Whatever tilt error survives this window is baked permanently into the magnetic reference's dip, so in a seaway the length matters: 1 s (the value hardcoded before 1.7) is about a fifth of a roll period and aligns to an arbitrary point in the cycle — measured attitude RMS in the marine default is 47.7° at 1 s against 2.19° at 5 s, flat beyond. 3-D vector fusion keeps improving out to ~15 s. The only cost of a longer window is startup latency before usable attitude, so raise it when starting from a mooring, not underway.'''

[[section]]
name = "nmea"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["enabled", "rate_hz", "dest_addr", "dest_port", "tcp_enabled", "tcp_bind_addr", "tcp_port"]]

  [[section.key]]
  names = ["enabled"]
  fields = ["nmea_enabled"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = ""
  man_style = "tight"
  man = 'Enable NMEA UDP output.'
  md_type = 'bool'
  md_default = '`false`'
  desc = 'Enable the NMEA UDP output stream.'

  [[section.key]]
  names = ["rate_hz"]
  fields = ["nmea_rate_hz"]
  macros = ["NEED_POS_INT"]
  type = 'int'
  default = 'default:\ 10'
  scope = ""
  man_style = "tight"
  man = 'Output rate in Hz (shared by UDP and TCP).'
  md_type = 'int'
  md_default = '`10`'
  desc = 'Output rate in Hz (shared by UDP and TCP); must be greater than zero. Hot-reloadable.'

  [[section.key]]
  names = ["dest_addr"]
  fields = ["nmea_dest_addr"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq255.255.255.255\(dq'
  scope = ""
  man_style = "tight"
  man = 'Destination IP address (broadcast, unicast, or multicast).'
  md_type = 'string'
  md_default = '`"255.255.255.255"`'
  desc = 'Destination IP address. `255.255.255.255` = broadcast; use a unicast or multicast address to target a specific host.'

  [[section.key]]
  names = ["dest_port"]
  fields = ["nmea_dest_port"]
  macros = ["NEED_PORT"]
  type = 'int'
  default = 'default:\ 10110'
  scope = ""
  man_style = "tight"
  man = 'Destination UDP port.'
  md_type = 'int'
  md_default = '`10110`'
  desc = 'Destination UDP port. Standard NMEA-over-UDP port is 10110.'

  [[section.key]]
  names = ["tcp_enabled"]
  fields = ["nmea_tcp_enabled"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = ""
  man_style = "tight"
  man = '''
Enable the NMEA-over-TCP listener.
Chartplotter apps (OpenCPN, Navionics, phone/tablet nav apps) connect as TCP
clients and each receives every sentence burst; up to 8 clients, slow clients
skip bursts rather than stalling the daemon.'''
  md_type = 'bool'
  md_default = '`false`'
  desc = 'NMEA-over-TCP listener. Chartplotter apps (OpenCPN, Navionics, phone/tablet nav apps) connect as TCP clients and each receives every sentence burst; up to 8 clients, slow clients skip bursts rather than stalling the daemon.'

  [[section.key]]
  names = ["tcp_bind_addr"]
  fields = ["nmea_tcp_bind_addr"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq0.0.0.0\(dq'
  scope = ""
  man_style = "tight"
  man = '''
Listener bind address (numeric IPv4).
Set
.B 127.0.0.1
to keep the listener host-local.'''
  md_type = 'string'
  md_default = '`"0.0.0.0"`'
  desc = 'Listener bind address (numeric IPv4). `127.0.0.1` keeps it host-local.'

  [[section.key]]
  names = ["tcp_port"]
  fields = ["nmea_tcp_port"]
  macros = ["NEED_PORT"]
  type = 'int'
  default = 'default:\ 10110'
  scope = ""
  man_style = "tight"
  man = '''
Listener TCP port (the de-facto NMEA-over-TCP port).
.PP
Sentences emitted:
.BR $PASHR ,
.BR $HCHDM ,
.BR $HCHDG ,
.BR $TIROT ,
.BR $IIXDR .
When declination is configured,
.B $HCHDT
(true heading) is added and
.B $HCHDG
carries the variation fields.'''
  md_type = 'int'
  md_default = '`10110`'
  desc = 'Listener TCP port (the de-facto NMEA-over-TCP port).'

