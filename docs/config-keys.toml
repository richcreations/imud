[[section]]
name = "imud-signalk"
man_file = "man/man5/imud-signalk.conf.5"
md_file = "docs/imud-signalk/manual.md"
md_groups = [["enabled", "socket", "udp_enabled", "dest_addr", "dest_port", "rate_hz", "source_label", "publish_heave", "tcp_enabled", "tcp_bind_addr", "tcp_port"]]

  [[section.key]]
  names = ["enabled"]
  fields = ["sk_enabled"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = "restart"
  man_style = "spaced"
  man = '''
Run the Signal K bridge daemon.  With it true and every output off the daemon
runs but sends nothing; set it false to not run the bridge at all (it exits
cleanly, so systemd does not restart it).
The shipped configuration file sets it true; false is what applies when
the key is absent altogether.'''
  md_type = 'bool'
  md_default = '`false`'
  desc = 'Run the bridge daemon. With it true and every output off the daemon runs but sends nothing; set false to not run the bridge at all (it exits cleanly, so systemd does not restart it). The shipped configuration file sets it true; `false` is what applies when the key is absent altogether.'

  [[section.key]]
  names = ["socket"]
  fields = ["stream_socket"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq/run/imud/imud-stream.sock\(dq'
  scope = "restart"
  man_style = "spaced"
  man = '''
imud stream socket to read (match
.I imud.conf
if you changed it there).'''
  md_type = 'string'
  md_default = '`"/run/imud/imud-stream.sock"`'
  desc = 'imud stream socket to read (match `imud.conf` if you changed it there).'

  [[section.key]]
  names = ["udp_enabled"]
  fields = ["sk_udp_enabled"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = "restart"
  man_style = "spaced"
  man = '''
Emit deltas over UDP to
.IR dest_addr : dest_port .'''
  md_type = 'bool'
  md_default = '`false`'
  desc = 'Emit deltas over UDP to `dest_addr`:`dest_port`.'

  [[section.key]]
  names = ["dest_addr"]
  fields = ["sk_dest_addr"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq127.0.0.1\(dq'
  scope = "hot"
  man_style = "spaced"
  man = '''
Signal K server host: a hostname, a numeric IPv4 or IPv6 address, or a
broadcast address.  Resolved with
.BR getaddrinfo (3).
Before 1.7 this key accepted numeric IPv4 only.'''
  md_type = 'string'
  md_default = '`"127.0.0.1"`'
  desc = 'Signal K server host: a hostname, a numeric IPv4 or IPv6 address, or a broadcast address. Resolved with `getaddrinfo(3)`, as in the other bridges. Before 1.7 this key accepted numeric IPv4 only.'

  [[section.key]]
  names = ["dest_port"]
  fields = ["sk_dest_port"]
  macros = ["NEED_PORT"]
  type = 'int'
  default = 'default:\ 10113'
  scope = "hot"
  man_style = "spaced"
  man = '''
UDP port; must match the Signal K server's UDP input connection.'''
  md_type = 'int'
  md_default = '`10113`'
  desc = '''
UDP port — must match the Signal K server's UDP input connection.'''

  [[section.key]]
  names = ["rate_hz"]
  fields = ["sk_rate_hz"]
  macros = ["NEED_POS_INT"]
  type = 'int'
  default = 'default:\ 10'
  scope = "hot"
  man_style = "spaced"
  man = 'Delta emit rate in Hz; must be greater than zero.'
  md_type = 'int'
  md_default = '`10`'
  desc = 'Delta emit rate in Hz; must be greater than zero.'

  [[section.key]]
  names = ["source_label"]
  fields = ["sk_source_label"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dqimud\(dq'
  scope = "hot"
  man_style = "spaced"
  man = '''
Signal K delta
.B source.label
value.'''
  md_type = 'string'
  md_default = '`"imud"`'
  desc = 'Signal K delta `source.label` value.'

  [[section.key]]
  names = ["publish_heave"]
  fields = ["publish_heave"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ true'
  scope = "hot"
  man_style = "spaced"
  man = '''
Emit
.B environment.heave
(set false if imud's heave estimator is off).'''
  md_type = 'bool'
  md_default = '`true`'
  desc = '''
Emit `environment.heave`, withheld until the estimator settles (~10·τ) so no startup transient is sent (set false if imud's heave estimator is off).'''

  [[section.key]]
  names = ["tcp_enabled"]
  fields = ["sk_tcp_enabled"]
  macros = ["NEED_BOOL"]
  type = 'bool'
  default = 'default:\ false'
  scope = "restart"
  man_style = "spaced"
  man = '''
Serve the same deltas (newline-framed JSON, one delta per line) on a TCP
listener; the Signal K server consumes it as a TCP client data connection.
