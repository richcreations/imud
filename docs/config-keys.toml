[[section]]
name = "logging"
man_file = "man/man5/imud.conf.5"
md_file = "docs/manual.md"
md_groups = [["level", "file", "stats_hz"]]

  [[section.key]]
  names = ["level"]
  fields = ["log_level"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dqwarn\(dq'
  scope = ""
  man_style = "tight"
  man = '''
Log verbosity:
.BR debug ,
.BR info ,
.BR warn ,
or
.BR error .
.B warn
is recommended for production (SD card friendly).
.B info
adds lifecycle messages and a periodic
.B [stats]
heartbeat.
Applied live on SIGHUP.'''
  md_type = 'string'
  md_default = '`"warn"`'
  desc = 'Log verbosity: `"debug"`, `"info"`, `"warn"`, or `"error"`. `"warn"` is recommended for production (SD-card friendly). `"info"` adds lifecycle messages and a periodic `[stats]` heartbeat. Applied live on SIGHUP.'

  [[section.key]]
  names = ["file"]
  fields = ["log_file"]
  macros = ["NEED_STR"]
  type = 'string'
  default = 'default:\ \(dq\(dq'
  scope = ""
  man_style = "tight"
  man = '''
Log destination.
Empty = write to stderr; under systemd, lines carry sd-daemon priority
prefixes so journald records real priorities.
Set an absolute path to redirect to a timestamped log file; the file is
reopened on SIGHUP, so logrotate can rotate it
.RB ( "postrotate: systemctl reload imud" ).
Repeated identical messages are suppressed and logged as a count.'''
  md_type = 'string'
  md_default = '`""`'
  desc = 'Log destination. Empty = stderr; under systemd, lines carry sd-daemon priority prefixes so journald records real priorities (`journalctl -p warning` filters work). Set an absolute path for a timestamped log file; it is reopened on SIGHUP so logrotate can rotate it (`postrotate: systemctl reload imud`).'

