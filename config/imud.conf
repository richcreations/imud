# imud.conf — IMU daemon configuration
# Copy to /etc/imud/imud.conf or ~/.config/imud/imud.conf
#
# Keys marked [restart] require a daemon restart to take effect.
# Keys marked [hot]     can be reloaded with SIGHUP at runtime.

[device]
i2c_bus        = "/dev/i2c-1"
gpio_chip      = "gpiochip4"     # Raspberry Pi 5 (RP1) — use "gpiochip0" on Pi 4

# Sim-driver playback (see docs/capture.md).  When sim_file names an .imucap
# capture and driver = "sim" (both sections), the recording is replayed
# through the full pipeline; `imud --replay FILE` is the shortcut form.
# Empty sim_file = the built-in synthetic scenario.
#sim_file      = ""              # .imucap to replay; "" = synthesize
#sim_loop      = false           # repeat forever (timing kept monotonic)
#sim_speed     = 1.0             # pacing; 2.0 = double speed, 0 = fastest

[runtime]
# [restart]
# The daemon's own two paths.  Both default to /run/imud, which the shipped
# unit creates through RuntimeDirectory=imud — so root running under systemd
# needs neither key.  Name them somewhere writable to run unprivileged, or on a
# host with no /run at all.  imud-status reads no config file, so a moved
# socket must be passed to it as --socket.
#pid_file      = ""              # "" = /run/imud/imud.pid
#status_socket = ""              # "" = /run/imud/imud.sock

[imu]
# [restart]
driver         = "ism330dhcx"
#bus           = "i2c"           # "i2c" (default) or "spi"
i2c_addr       = 0x6B            # 0x6A via SA0 jumper; I2C only

# SPI. Faster per transfer than I2C, which is what unlocks the high sample
# rates and shortens the FIFO drain. The chip select in the node name does the
# addressing, so i2c_addr is unused; wire the part to CE0 and enable the bus
# (`dtparam=spi=on` on a Raspberry Pi). Each sensor has its own node, so a SPI
# IMU alongside an I2C compass is a legal rig.
#bus           = "spi"
#spi_dev       = "/dev/spidev0.0" # required when bus = "spi"
#spi_speed_hz  = 0               # 0 = the driver's datasheet maximum
int_gpio       = 17              # BCM GPIO for FIFO watermark interrupt (pin 11)
odr_hz         = 833             # must be > 0; rounds UP to a supported rate.
                                 # A fraction is fine — the ladders are not all
                                 # whole numbers.  ism330dhcx runs the divider
                                 # chain 6664/2^n: 13.016/26.031/52.063/104.125/
                                 # 208.25/416.5/833/1666/3332/6664 — above 1666
                                 # needs bus = "spi".
                                 # Other drivers differ; see manual section 5.
accel_g        = 8               # full-scale: 2 | 4 | 8 | 16
gyro_dps       = 2000            # full-scale: 125 | 250 | 500 | 1000 | 2000 | 4000
fifo_wm        = 64              # watermark in sample-sets (~77 ms at 833 Hz)

# Synthetic driver — no hardware needed.  Set int_gpio = 0 on both sensors so
# the reader threads use their 10 ms timer fallback instead of GPIO edges.
# Simulates a small boat: heading increases ~6°/s, roll ±4° (6 s period),
# pitch ±2° (8 s period), rate_of_turn ~360 deg/min with wave-induced oscillation.
#
# driver       = "sim"
# i2c_addr     = 0x00
# int_gpio     = 0
# odr_hz       = 833

# How late the FIFO watermark interrupt may be, in SAMPLES, before the reader
# gives up and reads anyway.  The wait is fifo_wm + int_grace sample periods,
# so the fallback fires only when the line is genuinely late.  In samples, not
# milliseconds: a fixed time is thirteen samples at 6664 Hz and three
# hundredths of one at 13 Hz.  Ignored when int_gpio = 0.
int_grace      = 2

# Polling cadence in ms for an install with NO interrupt line.  0 derives it
# from odr_hz and fifo_wm, which is what you want -- a fixed interval
# under-polls at high ODR (the FIFO overflows and the delivered rate drops)
# and burns reads at low ODR.  IGNORED when int_gpio is set.
poll_ms        = 0

[mag]
# [restart]
driver         = "mmc5983ma"
#bus           = "i2c"           # "i2c" (default) or "spi"
i2c_addr       = 0x30            # fixed, no alternate; I2C only

# SPI, as for [imu] above — a second chip select, so usually CE1.
#bus           = "spi"
#spi_dev       = "/dev/spidev0.1" # required when bus = "spi"
#spi_speed_hz  = 0               # 0 = the driver's datasheet maximum
int_gpio       = 27              # BCM GPIO for measurement-done interrupt (pin 13)
odr_hz         = 100             # must be > 0; rounds UP to a supported rate:
                                 # 1/10/20/50/100/200/1000.  What the part then
                                 # DELIVERS differs — 100 gives about 106; the
                                 # daemon logs both at startup.
set_period_s   = 5.0             # degauss pulse interval, seconds (0 = disable)

# driver       = "sim"
# i2c_addr     = 0x00
# int_gpio     = 0
# odr_hz       = 100
# set_period_s = 0.0

# As [imu] int_grace, but these magnetometers have no FIFO: the line signals
# one finished conversion, so the wait is 1 + int_grace sample periods.
int_grace      = 2

# As [imu] poll_ms.  0 derives the cadence from odr_hz.  Ignored when
# int_gpio is set.
poll_ms        = 0

[fusion]
# MEKF noise densities. accel/mag/gyro-bias are datasheet-derived; mekf_gyro_noise
# is a tuned process noise (Q) held ABOVE the raw gyro spec so the filter stays
# responsive and the gyro bias observable — do NOT "correct" it down to the
# datasheet number (that degrades wave tracking; the test_fusion benchmark guards it).
# imud-cal characterize writes this unit's measured noise to cal.json's "noise"
# section. That is characterization for the record only — it never feeds the filter,
# and there is no config key to make it do so (driving Q from the raw sensor floor
# makes the filter too stiff).
mekf_gyro_noise     = 0.007      # rad/s/√Hz — tuned Q (raw sensor ≈ 1.2e-4 = 7 mdps/√Hz)
mekf_gyro_bias      = 0.00015   # rad/s      (in-run bias instability)
# mekf_accel_noise: do NOT hand-tune this upward "a little" to allow for waves.
# The 12-seed wave benchmark sweeps it from 0.0011 to 0.8; the datasheet value
# below is a sharp local optimum for the marine (yaw-only) default, and the
# range 0.003–0.03 is markedly WORSE than either side of it — attitude RMS more
# than quadruples. Raising it weakens the gravity correction, the filter leans
# harder on gyro integration, bias observability degrades, and the errors feed
# back. Seaway robustness is the Gauss-Markov wave state's job (mekf_wave_accel,
# below) - that is the knob to reach for when the sea is rough. This one should
# describe SENSOR noise only. If you think it needs changing, capture the seaway
# first and watch nis_accel on the wire (1.0 = the noise model matches reality),
# or run `imud-cal fit-ra` on the capture.
mekf_accel_noise    = 0.0022    # m/s²/√Hz  (ISM330DHCX: ~186 µg/√Hz × 9.81)
mekf_mag_noise      = 0.0004    # Gauss/√Hz (MMC5983MA: 0.4 mGauss RMS)

# Gauss-Markov wave-acceleration state (1.7). THIS is the knob for "the sea is
# rough", not mekf_accel_noise above.
#
# Wave-orbital acceleration contaminates the gravity measurement and is
# correlated over roughly a second, not white. Modelling it as a first-order
# Gauss-Markov process lets 833 correlated samples per second correctly stop
# adding information; without it the filter treats them as 833 independent
# measurements of gravity, collapses its own covariance and diverges.
#
#   mekf_wave_accel       steady-state sigma of the disturbance, m/s^2
#   mekf_wave_accel_tau_s its correlation time, s
#
# Either at 0 disables the state entirely and returns the pre-1.7 6-state
# filter. NOTE: unrelated to wave_tau_s below, which is the sea-state
# REPORTING window.
#
# The defaults were tuned over the 12-seed wave benchmark and agree with three
# independent measurements of the same seaway (docs/math.md 4.7.1). Measured
# effect vs 1.6: accel NIS 19.3/25.2 -> 1.01/0.69, NEES(trace) 18.3/7.8 ->
# 3.47/0.99, 3-D heading RMS 3.07 -> 0.83 deg. Run `imud-cal fit-ra` on a
# capture of YOUR worst conditions to check both values; it prints suggestions.
# Sigma too small is the failure mode that hurts, so round up. Long tau (> ~1 s)
# lets the state absorb genuine tilt error - the benchmark degrades sharply
# past 2 s.
mekf_wave_accel       = 0.8     # m/s^2  (RMS wave-orbital acceleration)
mekf_wave_accel_tau_s = 0.5     # s      (correlation time)

# Uncertainty of the magnetic reference's DIP angle, degrees.
#
# Only affects 3-D vector fusion (mag_yaw_only = false), where the field's dip
# constrains roll and pitch. The dip of the reference is fixed once, at
# alignment, from the tilt estimate available then; in a seaway that is wrong
# by around a degree, and the error becomes a permanent roll/pitch bias. It
# cannot be learned out at sea (the in-run reference healing is gated on the
# platform being calm, deliberately - learning from wave-correlated samples
# walks the reference away from truth, measured). So it is admitted into the
# covariance instead, as a rank-1 term along the one direction a dip error
# acts on.
#
# The default is the measured residual after a 5 s alignment window, rounded
# up. Set to 0 if a position source supplies WMM field invariants: that removes
# the dip error at the source, which is strictly better. Raising it trades
# roll/pitch confidence for consistency; it also lowers the nis_mag wire field
# in 3-D mode by design, since the dip channel is trusted less.
mekf_mag_dip_sigma_deg = 1.0    # degrees (0 = dip reference is exact)

# Tuning knobs.
# Fine-grained measurement consistency is handled internally by chi-squared
# innovation gates (self-scaling with filter confidence); mag_reject_gauss is
# only the strong-anomaly cutoff for nearby iron/magnets.
mag_reject_gauss    = 0.05      # reject mag if residual > 0.05 Gauss (~10% of Earth field)
accel_skip_thresh   = 0.05      # skip accel update if ||a| - 1g| > 5% of g

# Magnetometer fusion mode. true (default) = heading-only: the mag corrects
# heading and never pulls on roll/pitch. Right choice for marine installs —
# the swing-circle calibration is 2D, so the field's vertical (dip) channel
# is the least calibrated and must not steer the horizon. Set false (full 3D
# vector fusion) only for magnetically clean installs with a true 3D cal.
mag_yaw_only        = true

# What to do with the magnetometer when there is no calibration file.
#
# true (default) = fuse it anyway, heading-only. The uncorrected hard iron
# offsets the heading by a deviation that varies with heading, but it is
# BOUNDED and REPEATABLE - a heading-hold consumer can work with that. The
# alternative is gyro dead reckoning, which is unbounded: measured on a static
# bench, heading walked 220 degrees in 24 minutes while pitch and roll stayed
# correct to a tenth of a degree. Heading-only is forced here regardless of
# mag_yaw_only above, so the uncorrected dip cannot reach roll or pitch.
# On the wire this state is FLAG_MAG_UNCAL (bit 15). FLAG_MAG_VALID keeps its
# original "calibrated and healthy" meaning and stays CLEAR here, so an
# existing consumer that only tests it is unaffected by this default.
#
# Run `imud-cal mag` for a heading you can navigate on. This is a floor, not
# a substitute.
mag_fuse_uncal      = true

# Withdrawal threshold for an uncalibrated mag, as a fraction of the reference
# horizontal/total field ratio |H|/|B|.
#
# There is a point past which an uncalibrated compass stops being merely
# offset and becomes actively misleading: once the horizontal hard iron
# exceeds the horizontal field, two true headings read the same and the SENSE
# of the error inverts over half the rose, so an autopilot holding on it
# diverges instead of degrading. This gate approximates that boundary from the
# mag_anomaly field-magnitude EMA and drops back to dead reckoning above it,
# with a warning.
#
# Coarse on purpose: the EMA is a mean rather than a peak (under-reads a
# constant-rate turn by ~2/pi) and a mostly-vertical offset inflates it
# without harming heading-only fusion. A backstop against gross iron - an
# alternator, a speaker magnet, a steel bulkhead - not a precise boundary.
# Re-admission is hysteretic at 0.8x. 0 = never withdraw.
mag_uncal_reject_frac = 0.4

# Heave estimator: vertical displacement from band-passed double integration
# of vertical acceleration. Feeds the $PASHR heave field and the binary
# packet's heave_m.
# tau sets the filter corner: passband covers ~2-15 s wave periods at 12 s.
# Allow ~2 min settling after startup. 0 = disabled (heave reads 0.0).
heave_tau_s         = 12.0

# Sea-state statistics from the heave/roll/pitch oscillations: significant
# wave height (Hs = 4·sigma(heave)), mean zero-crossing wave period, and the
# vessel's roll and pitch periods and significant single amplitudes (2·sigma).
# tau is the averaging window; stats settle ~2·tau after heave itself
# settles. Needs heave_tau_s > 0. 0 = disabled (fields read 0.0).
wave_tau_s          = 120.0

# Engine vibration detection (software, no MLC required).
# Computes an exponential moving average of (|a| - g)² over the accel stream.
# When the EMA exceeds engine_vibration_g2, accel updates switch to the wider
# engine_accel_skip_thresh (so the filter isn't starved) while the accel noise
# is inflated 4x (so vibration-contaminated samples are trusted less).
# Set engine_vibration_g2 = 0 to disable (default).
engine_vibration_g2      = 0.0  # m²/s⁴ EMA threshold; 0 = disabled
engine_accel_skip_thresh = 0.20 # skip threshold override when engine is on

[calibration]
file               = "/etc/imud/cal.json"  # written by imud-cal; for in-repo dev runs
                                            # point this at config/cal.json instead
startup_settle_sec = 5.0               # ISM330DHCX gyro drifts ~0.02 rad/s for ~5 s after power-on;
                                       # discard this many seconds before bias estimation or cal collection
gyro_bias_sec      = 2.0               # stationary averaging window at startup (skipped if cal.json has gyro)

# Seconds of accel + mag averaging used for the one-shot initial attitude
# alignment. Whatever tilt error survives this window is baked permanently into
# the magnetic reference's dip, so in a seaway it matters: 1 s is about a fifth
# of a roll period and aligns to an arbitrary point in the cycle (measured
# attitude RMS in the marine default: 47.7 deg at 1 s, 2.19 deg at 5 s, flat
# beyond). Longer is better for 3-D vector fusion specifically (NEES-strict
# 5.7 at 5 s, 1.7 at 15 s); the only cost is startup latency before the filter
# produces usable attitude. Worth raising at a mooring, not underway.
align_window_sec   = 5.0

[nmea]
# [restart]: enabled, dest_addr, dest_port, tcp_*
# [hot]:     rate_hz
# Off by default (matching the built-in default since 1.6): a stock daemon
# emits only on the local [stream] socket below, and nothing touches the
# network until an output is enabled here.  Two transports, independently
# enabled — most chartplotter apps (OpenCPN, Navionics, iOS/Android nav
# apps) connect as TCP clients, so tcp_enabled is usually the one you want;
# UDP broadcast serves listen-only consumers.
enabled        = false
rate_hz        = 10              # NMEA sentence rate; must be > 0
dest_addr      = "255.255.255.255"
dest_port      = 10110

# NMEA-over-TCP listener: plotters connect to tcp://<host>:10110 and each
# connected client receives every sentence burst.  Slow clients skip bursts
# (never stall the daemon); at most 8 clients.
tcp_enabled    = false
tcp_bind_addr  = "0.0.0.0"       # set 127.0.0.1 to keep it host-local
tcp_port       = 10110           # the de-facto NMEA-over-TCP port

[highrate]
# [restart]: enabled, dest_addr, dest_port
# [hot]:     rate_hz
# Secondary stream — disabled by default. Enable for machine-vision pipelines,
# ROS2, or any consumer that needs quaternion + covariance at 500 Hz.
enabled        = false
rate_hz        = 500             # UDP output rate, > 0; MEKF runs at full 833 Hz internally
dest_addr      = "239.255.0.1"   # IPv4 multicast group (224.0.0.0/4); TTL=1, link-local
                                 # consumers: setsockopt(IP_ADD_MEMBERSHIP) to subscribe
                                 # use 255.255.255.255 for broadcast, or a unicast IP
dest_port      = 10111
coord_frame    = "NED"           # "NED" or "ENU"

[stream]
# [restart]: enabled, socket, tcp_*
# [hot]:     rate_hz
# Local AF_UNIX subscription stream — same 276-byte binary packets as the
# high-rate UDP stream, but over a SOCK_STREAM socket: no datagram loss for
# same-host consumers, and clients subscribe by connecting.  Fixed frame
# size + magic + CRC make it self-framing; lib/imud_client.h validation
# works unchanged on 276-byte reads.  Slow consumers get dropped packets
# (gap visible in imu_seq), never a stalled daemon.
# The one output enabled by default (also the built-in default since 1.6) —
# the bridges (Signal K, MQTT, InfluxDB, MAVLink, Prometheus) and libimud
# consumers all read this socket.  Because of that it is also the one output
# whose thread failing to start is fatal: imud exits 1 rather than run and
# report active while producing nothing.  The optional outputs below warn and
# carry on, closing whatever they had bound.
enabled        = true
socket         = "/run/imud/imud-stream.sock"
rate_hz        = 100             # per-subscriber packet rate; must be > 0

# TCP listener carrying the same framed packets to remote consumers — a
# laptop's imud-mon/Python client, or a bridge running on another machine
# (libimud imud_connect_tcp / ImudClient.connect_tcp).  Lossless like the
# AF_UNIX socket; slow clients drop packets, never stall the daemon.
tcp_enabled    = false
tcp_bind_addr  = "0.0.0.0"       # set 127.0.0.1 to keep it host-local
tcp_port       = 10112

# The imud-signalk bridge (Signal K delta over UDP) is a separate, optional
# daemon with its OWN config file: /etc/imud/imud-signalk.conf. It reads only
# the stream socket above — see config/imud-signalk.conf. Requires enabled = true.

# ── Black-box capture ─────────────────────────────────────────────────────
# Record every raw sample from both sensors to rotating .imucap files —
# replayable with `imud --replay`, analyzable with `imud-cal characterize` /
# `fit-temp`.  See docs/capture.md.  ~25 MB/hour at 104 Hz.  All [restart].
[capture]
enabled   = false
dir       = "/var/lib/imud"      # imud-YYYYMMDD-HHMMSS.imucap (UTC)
max_mb    = 256                  # rotate at this size; 0 = unlimited
max_files = 8                    # ring of newest N files; 0 = keep all
flush_s   = 5                    # flush-to-disk interval, seconds

[mount]
# Board → body rotation expressed as Euler angles [roll, pitch, yaw] in degrees.
# R = Rz(yaw) * Ry(pitch) * Rx(roll).
#
# All drivers (ISM330DHCX, ICM-20948, MMC5983MA, AK09916) output in a
# NED-compatible board frame:  X = chip X, Y = starboard, Z = down.
#
# For a component-up installation with the chip X axis pointing toward the bow:
#   rotation_euler_deg = [0.0, 0.0, 0.0]   ← no rotation needed
#
# Only the yaw component should be non-zero in normal use; it trims the
# compass heading to correct for the angle between chip X and true bow.
# Yaw = clockwise degrees from bow to chip X. Chip X points to stern → 180°.
# Exactly three values are required.
rotation_euler_deg = [0.0, 0.0, 180.0]
#
# If the installation rotation is already known as a matrix, give it directly
# instead (row-major, v_body = R * v_board). Validated at load against
# R^T R = I and det(R) = +1 — a non-orthonormal matrix or a reflection
# (sign-flipped axis) stops the daemon rather than silently biasing samples.
#   rotation_matrix = [1,0,0, 0,1,0, 0,0,1]
#
# Or name one of the eight quarter-turn shortcuts instead of spelling the
# angles out. An unrecognised name stops the daemon — starting with a
# silently wrong mount rotation would bias every sample.
#   identity   yaw_90   yaw_180   yaw_270
#              roll_90  roll_270  pitch_90  pitch_270
# (the aliases board_forward, rot_z_90/180/270, rot_x_90/270 and
#  rot_y_90/270 are accepted for the same eight)
#   preset = "yaw_180"
#
# Whichever of the three mount keys appears last wins.

[logging]
# [hot]: level, stats_hz.  [restart]: file (path change; reopened on reload).
# Repeated identical messages are logged once + "last message repeated N times".
level          = "warn"          # "debug" | "info" | "warn" | "error"
                                 # warn = only errors and warnings (default; safe for SD cards)
                                 # info = adds lifecycle lines + [stats] heartbeat
file           = ""              # empty = stderr; journald gets real priorities
                                 # set a path for a timestamped log file — reopened on
                                 # SIGHUP, so logrotate works (postrotate: reload)
stats_hz       = 1               # stats heartbeat rate (only shown at level = "info" or "debug")

[position]
# [hot]:     declination_deg, lat_deg, lon_deg, wmm_file (declination + WMM
#            field reference recomputed on SIGHUP; a live position source —
#            gpsd/SignalK — owns declination while enabled)
# [restart]: gpsd_*, signalk_*, fix_max_age_h
# Magnetic declination → true heading.  Three modes (highest priority wins):
#
#   1. WMM auto-compute: set lat_deg + lon_deg (both non-zero).
#      imud loads wmm_file, computes declination at startup and on SIGHUP.
#      Accurate to ±0.5° for a fixed installation.
#
#   2. Static override: set declination_deg (used only when lat/lon = 0).
#      Find your value at https://www.ngdc.noaa.gov/geomag/calculators/magcalc.shtml
#      Positive = East (+), negative = West (-).  Example: Seattle WA ≈ +14.5
#
#   3. Disabled (default): all three values at zero → no true heading output.
#
# When active, imud emits $HCHDT and fills the $HCHDG variation fields in NMEA,
# and fills the declination_deg field in the binary packet
# (FLAG_DECLINATION_VALID).
#
# WMM model: WMM2025, valid 2025.0–2030.0 (packaged as imud-wmm-data /
# `make install-wmm-data` → /usr/share/imud/WMM.COF).  When WMM2030 lands
# (expected late 2029), update that package — or drop the new file in as an
# override, which imud prefers over the packaged data:
#   sudo cp WMM2030.COF /etc/imud/WMM.COF && sudo systemctl reload imud
declination_deg  = 0.0           # degrees; 0.0 = static disabled (ignored when lat/lon set)
lat_deg          = 0.0           # geodetic latitude  (+N / -S); 0 = WMM disabled
lon_deg          = 0.0           # geodetic longitude (+E / -W); 0 = WMM disabled
#wmm_file        = ""            # empty = auto: /etc/imud/WMM.COF if present,
                                 # else /usr/share/imud/WMM.COF (package data)

# Live position sources — enable one to get automatic GPS-driven WMM updates.
# When connected, position updates override the static lat_deg/lon_deg above.
# gpsd is preferred; SignalK is polled as fallback when gpsd is enabled but down.
#
# gpsd (NMEA daemon — port 2947):
gpsd_enabled     = false
gpsd_host        = "localhost"
gpsd_port        = 2947

# SignalK (navigation server — HTTP REST poll every 30 s):
signalk_enabled  = false
signalk_host     = "localhost"
signalk_port     = 3000
signalk_path     = "/signalk/v1/api/vessels/self/navigation/position"

# Stale-fix TTL: once a live GPS fix updates the declination, keep using it for
# this many hours without a new fix.  After the window expires, FLAG_DECLINATION_VALID
# clears and true-heading output stops.  Set to 0 to never expire (static-like behaviour).
fix_max_age_h    = 24.0
