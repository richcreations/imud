# imud sim config — no hardware required
# Simulates a small boat under way: constant yaw + wave-induced roll/pitch/heave.
# Expected: heading increases ~6°/s, roll ±4° (6 s), pitch ±2° (8 s),
#           rate_of_turn ~360 deg/min with small wave-induced oscillation.

[device]
i2c_bus   = "/dev/null"     # sim driver ignores fd; /dev/null is always openable
gpio_chip = "gpiochip0"     # not opened when int_gpio = 0 for both sensors

[imu]
driver    = "sim"
i2c_addr  = 0x00
int_gpio  = 0
odr_hz    = 833

[mag]
driver       = "sim"
i2c_addr     = 0x00
int_gpio     = 0
odr_hz       = 100
set_period_s = 0.0

[fusion]
mekf_gyro_noise          = 0.007
mekf_gyro_bias           = 0.00015
mekf_accel_noise         = 0.0022
mekf_mag_noise           = 0.0004
mag_reject_gauss         = 0.0008
accel_skip_thresh        = 0.05
engine_vibration_g2      = 0.0
engine_accel_skip_thresh = 0.20

[calibration]
file               = "config/sim-cal.json"
startup_settle_sec = 0.0  # sim driver has no thermal transient
gyro_bias_sec      = 0.0  # sim gyro is noiseless; bias estimation would read 0

[nmea]
enabled   = true
rate_hz   = 1
dest_addr = "127.0.0.1"
dest_port = 10110

[highrate]
enabled = true
rate_hz = 500

[mount]
rotation_euler_deg = [0.0, 0.0, 0.0]

[logging]
level    = "info"
file     = ""
stats_hz = 1

[position]
# [restart]
# Set declination_deg (static) or lat_deg+lon_deg (WMM auto) to enable true heading.
# Example — test with Seattle's ~14.5°E declination:
#   declination_deg = 14.5
# Or test WMM auto-compute:
#   lat_deg = 47.6
#   lon_deg = -122.3
declination_deg  = 0.0           # degrees; 0.0 = disabled
lat_deg          = 0.0           # geodetic latitude  (+N / -S); 0 = WMM disabled
lon_deg          = 0.0           # geodetic longitude (+E / -W); 0 = WMM disabled
wmm_file         = "data/WMM.COF"   # dev path; installed to /etc/imud/WMM.COF
gpsd_enabled     = false
gpsd_host        = "localhost"
gpsd_port        = 2947
signalk_enabled  = false
signalk_host     = "localhost"
signalk_port     = 3000
signalk_path     = "/signalk/v1/api/vessels/self/navigation/position"
fix_max_age_h    = 24.0
