# imud-prometheus.conf — Prometheus exporter configuration
# Copy to /etc/imud/imud-prometheus.conf (installed there by `make install-prometheus`).
#
# The imud-prometheus exporter is a standalone daemon: it reads ONLY this
# file, never imud.conf. It connects to imud's binary stream socket and
# serves the latest fused state as Prometheus text-format gauges on
# GET /metrics — for Prometheus/Grafana alerting and dashboards.
# Requires imud's [stream] output enabled (imud.conf: [stream] enabled = true).
#
# All gauges are base SI units (radians, metres, seconds, °C); heading is
# additionally exported in degrees (imud_heading_degrees). Flag bits are 0/1
# gauges (imud_mag_valid, imud_converged, imud_heave_valid, imud_wave_valid,
# imud_engine_on); imud_up reports whether a live packet is held.
#
# Prometheus scrape config:
#   - job_name: imud
#     static_configs: [{ targets: ["<host>:9815"] }]
#
# Keys marked [restart] require a service restart.

[imud-prometheus]
# The daemon runs whenever enabled = true and stays healthy under systemd; it
# does not bind the /metrics port until http_enabled = true.
enabled      = true                          # [restart] run the exporter daemon
http_enabled = false                         # [restart] serve the /metrics listener
socket       = "/run/imud/imud-stream.sock"  # [restart] imud [stream] socket to read
listen_addr  = "127.0.0.1"                   # [restart] HTTP bind address
                                             #   (0.0.0.0 to scrape from another host)
listen_port  = 9815                          # [restart] HTTP port

[logging]
level = "info"                               # error | warn | info | debug
