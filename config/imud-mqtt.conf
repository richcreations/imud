# imud-mqtt.conf — MQTT bridge configuration
# Copy to /etc/imud/imud-mqtt.conf (installed there by `make install-mqtt`).
#
# The imud-mqtt bridge is a standalone daemon: it reads ONLY this file, never
# imud.conf. It connects to imud's binary stream socket and publishes scalar
# telemetry topics (one value per topic) to an MQTT broker, plus Home Assistant
# MQTT-discovery configs so the sensors self-register as one "imud" device.
# Requires imud's [stream] output enabled (imud.conf: [stream] enabled = true).
#
# Topics (default prefix "imud"; degrees / metres / °C):
#   imud/navigation/headingMagnetic     imud/navigation/headingTrue *
#   imud/navigation/magneticVariation * imud/navigation/rateOfTurn
#   imud/attitude/{roll,pitch,yaw}      imud/environment/heave **
#   imud/environment/heaveRate **       imud/imu/temperature
#   imud/status/online   (retained)
#   (*  published only when magnetic declination is known)
#   (** heave/heaveRate (heaveRate in m/s) published only once the heave
#       estimator has settled; discovery is advertised on publish_heave alone)
#
# Keys marked [restart] require a service restart; [hot] reload with SIGHUP
# (systemctl reload imud-mqtt).

[imud-mqtt]
# The daemon runs whenever enabled = true and stays healthy under systemd; it
# publishes nothing until broker_enabled = true. This keeps a fresh install from
# repeatedly dialing a broker that isn't configured yet.
enabled        = true                         # [restart] run the bridge daemon
socket         = "/run/imud/imud-stream.sock" # [restart] imud [stream] socket to read
                                              #   (match imud.conf if you changed it)

# Broker connection — the bridge's only output.
broker_enabled = false                        # [restart] connect and publish
broker_addr    = "127.0.0.1"                  # [restart] broker host (name or IP)
broker_port    = 1883                         # [restart] broker TCP port
client_id      = "imud"                       # [restart] MQTT client id; also the
                                              #   Home Assistant device/node id
keepalive_s    = 30                           # [restart] MQTT keepalive interval, s

# Publishing.
topic_prefix   = "imud"                       # [restart] prefix for all topics
rate_hz        = 5                            # [hot] publish rate
qos            = 0                            # [hot] publish QoS (0|1|2)
retain         = true                         # [hot] retain values so late
                                              #   subscribers / HA see the current value
units          = "deg"                        # [hot] "deg" (degrees, °/min, m, °C)
                                              #   or "rad" (SI: radians, rad/s)
publish_heave  = true                         # [hot] publish environment/heave
                                              #   (set false if the heave estimator is off)

# Home Assistant MQTT discovery — auto-registers the sensors as one "imud" device.
ha_discovery   = true                         # [restart]
ha_prefix      = "homeassistant"              # [restart] HA discovery topic prefix

# Authentication (optional).
# SECURITY: a password here is stored in plaintext — if you set one, restrict
# this file (e.g. chmod 640 and a group the service user can read).
username       = ""                           # [restart] "" = anonymous
password       = ""                           # [restart]

# TLS (optional). When enabled with an empty tls_cafile the system CA store is used.
tls            = false                        # [restart] enable TLS
tls_cafile     = ""                           # [restart] CA cert path ("" = system store)
