# imud-mavlink.conf — MAVLink bridge configuration
# Copy to /etc/imud/imud-mavlink.conf (installed there by `make install-mavlink`).
#
# The imud-mavlink bridge is a standalone daemon: it reads ONLY this file, never
# imud.conf. It connects to imud's binary stream socket and emits MAVLink
# (v1 or v2) HEARTBEAT (1 Hz) + ATTITUDE/ATTITUDE_QUATERNION over UDP and/or
# serial — for ArduPilot, PX4, or a ground station (QGroundControl / Mission
# Planner). Requires imud's [stream] output enabled (imud.conf: [stream] enabled = true).
#
# Angles/rates are SI radians in MAVLink's FRD/NED body frame (matches imud, so
# roll/pitch/yaw and the quaternion pass through directly).
#
# Keys marked [restart] require a service restart; [hot] reload with SIGHUP
# (systemctl reload imud-mavlink).

[imud-mavlink]
enabled        = false                        # [restart] start the bridge
socket         = "/run/imud/imud-stream.sock" # [restart] imud [stream] socket to read

version        = 2                            # [hot] MAVLink protocol version: 1 or 2
system_id      = 1                            # [restart] MAVLink system id
component_id   = 1                            # [restart] MAVLink component id
                                              #   (raise, e.g. 191, when sharing a bus with
                                              #    a real autopilot, to avoid an id clash)
rate_hz        = 10                           # [hot] ATTITUDE/quaternion rate (heartbeat is 1 Hz)
send_attitude             = true              # [hot] emit ATTITUDE (#30)
send_attitude_quaternion  = true              # [hot] emit ATTITUDE_QUATERNION (#31)

# ── UDP output ─────────────────────────────────────────────────────────────
udp_enabled    = false                        # [restart]
udp_addr       = "127.0.0.1"                  # [hot] destination host (e.g. a GCS)
udp_port       = 14550                        # [hot] destination UDP port (QGC default 14550)

# ── Serial output ──────────────────────────────────────────────────────────
# The service user needs access to the serial device; the shipped unit adds the
# dialout group and permits tty devices.
serial_enabled = false                        # [restart]
serial_device  = "/dev/serial0"               # [restart] e.g. /dev/serial0, /dev/ttyAMA0, /dev/ttyUSB0
serial_baud    = 57600                        # [restart] 9600..921600 (common: 57600, 115200)

# ── TCP listener output ────────────────────────────────────────────────────
# Ground stations connect as TCP clients (QGroundControl / Mission Planner:
# tcp://<host>:5760); every connected client receives the same frames.
# Can run alongside UDP and serial.
tcp_enabled    = false                        # [restart]
tcp_bind_addr  = "0.0.0.0"                    # [restart] 127.0.0.1 = host-local only
tcp_port       = 5760                         # [restart] de-facto MAVLink TCP port
