# imud-influxdb.conf — InfluxDB bridge configuration
# Copy to /etc/imud/imud-influxdb.conf (installed there by `make install-influxdb`).
#
# The imud-influxdb bridge is a standalone daemon: it reads ONLY this file, never
# imud.conf. It connects to imud's binary stream socket and writes one InfluxDB
# line-protocol point per tick — over UDP and/or HTTP (both off until enabled) —
# for time-series storage and Grafana dashboards (fusion tuning, sea-trial logging).
# Requires imud's [stream] output enabled (imud.conf: [stream] enabled = true).
#
# One line-protocol point per tick, e.g. (units = deg):
#   imud,source=imud qw=..,qx=..,qy=..,qz=..,roll=..,pitch=..,yaw=..,heading=..,
#     heading_true=..,variation=..,rate_of_turn=..,heave=..,heave_rate=..,
#     heave_valid=t,gbias_x=..,gbias_y=..,gbias_z=..,gbias_var_x=..,gbias_var_y=..,
#     gbias_var_z=..,quiescence=..,temp=..,seq=Ni <ts_ns>
#   (heading_true/variation only when declination is known; heave/heave_rate/
#    heave_valid when publish_heave is set. This is the diagnostics sink, so heave
#    is emitted from t=0 and heave_valid flags whether it has settled. The gyro-bias
#    and quiescence diagnostics are always SI, unaffected by units=deg/rad.)
#
# Keys marked [restart] require a service restart; [hot] reload with SIGHUP
# (systemctl reload imud-influxdb).

[imud-influxdb]
# The daemon runs whenever enabled = true and stays healthy under systemd; it
# writes nothing until you turn on an output below. Both are off by default —
# enable udp_enabled and/or http_enabled (both may run at once).
enabled        = true                         # [restart] run the bridge daemon
socket         = "/run/imud/imud-stream.sock" # [restart] imud [stream] socket to read
# transport is DEPRECATED — kept only for old configs (transport = "udp"|"http"
# maps to udp_enabled/http_enabled when neither is set). Prefer the enables below.

rate_hz        = 10                           # [hot] point emit rate (> 0)
measurement    = "imud"                       # [hot] line-protocol measurement name
source_label   = "imud"                       # [hot] value of the source= tag
units          = "deg"                        # [hot] "deg" (degrees, °/min) or "rad" (SI)
publish_heave  = true                         # [hot] include the heave field

# ── UDP transport ──────────────────────────────────────────────────────────
# Works with InfluxDB 1.x's UDP listener or Telegraf's socket_listener (the
# usual path into InfluxDB 2.x/3.x). Configure the listener's precision = ns.
udp_enabled    = false                        # [restart] write points over UDP
udp_addr       = "127.0.0.1"                  # [hot] InfluxDB / Telegraf host
udp_port       = 8089                         # [hot] UDP port

# ── HTTP transport ─────────────────────────────────────────────────────────
# Plaintext HTTP only (no TLS) — for a TLS/cloud endpoint, front it with a local
# proxy. One POST per point (Connection: close).
http_enabled   = false                        # [restart] write points over HTTP
http_host      = "127.0.0.1"                  # [restart] InfluxDB host
http_port      = 8086                         # [restart] InfluxDB HTTP port
# InfluxDB 1.x:  /write?db=<db>&precision=ns
# InfluxDB 2.x:  /api/v2/write?org=<org>&bucket=<bucket>&precision=ns
http_path      = "/write?db=imud&precision=ns"  # [restart]
# InfluxDB 2.x API token. SECURITY: stored in plaintext, so the installed copy
# at /etc/imud/imud-influxdb.conf is mode 0640 owned root:imud — readable only
# by root and by the imud user the bridge runs as, not by every local account.
# Keep it that way if you edit or replace the file.
http_token     = ""                           # [restart] "" = no Authorization header
