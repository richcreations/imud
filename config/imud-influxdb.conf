# imud-influxdb.conf — InfluxDB bridge configuration
# Copy to /etc/imud/imud-influxdb.conf (installed there by `make install-influxdb`).
#
# The imud-influxdb bridge is a standalone daemon: it reads ONLY this file, never
# imud.conf. It connects to imud's binary stream socket and writes one InfluxDB
# line-protocol point per tick — over UDP (default) or HTTP — for time-series
# storage and Grafana dashboards (fusion tuning, sea-trial logging).
# Requires imud's [stream] output enabled (imud.conf: [stream] enabled = true).
#
# One line-protocol point per tick, e.g. (units = deg):
#   imud,source=imud qw=..,qx=..,qy=..,qz=..,roll=..,pitch=..,yaw=..,heading=..,
#     heading_true=..,variation=..,rate_of_turn=..,heave=..,temp=..,seq=Ni <ts_ns>
#   (heading_true/variation only when declination is known; heave when enabled)
#
# Keys marked [restart] require a service restart; [hot] reload with SIGHUP
# (systemctl reload imud-influxdb).

[imud-influxdb]
enabled        = false                        # [restart] start the bridge
socket         = "/run/imud/imud-stream.sock" # [restart] imud [stream] socket to read
transport      = "udp"                         # [restart] "udp" or "http"

rate_hz        = 10                           # [hot] point emit rate
measurement    = "imud"                       # [hot] line-protocol measurement name
source_label   = "imud"                       # [hot] value of the source= tag
units          = "deg"                        # [hot] "deg" (degrees, °/min) or "rad" (SI)
publish_heave  = true                         # [hot] include the heave field

# ── UDP transport (transport = "udp") ──────────────────────────────────────
# Works with InfluxDB 1.x's UDP listener or Telegraf's socket_listener (the
# usual path into InfluxDB 2.x/3.x). Configure the listener's precision = ns.
udp_addr       = "127.0.0.1"                  # [hot] InfluxDB / Telegraf host
udp_port       = 8089                         # [hot] UDP port

# ── HTTP transport (transport = "http") ────────────────────────────────────
# Plaintext HTTP only (no TLS) — for a TLS/cloud endpoint, front it with a local
# proxy. One POST per point (Connection: close).
http_host      = "127.0.0.1"                  # [restart] InfluxDB host
http_port      = 8086                         # [restart] InfluxDB HTTP port
# InfluxDB 1.x:  /write?db=<db>&precision=ns
# InfluxDB 2.x:  /api/v2/write?org=<org>&bucket=<bucket>&precision=ns
http_path      = "/write?db=imud&precision=ns"  # [restart]
# InfluxDB 2.x API token. SECURITY: stored in plaintext — if set, restrict this
# file's permissions (e.g. chmod 640 and a group the service user can read).
http_token     = ""                           # [restart] "" = no Authorization header
