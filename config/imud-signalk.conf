# imud-signalk.conf — Signal K bridge configuration
# Copy to /etc/imud/imud-signalk.conf (installed there by `make install-signalk`).
#
# The imud-signalk bridge is a standalone daemon: it reads ONLY this file, never
# imud.conf. It connects to imud's binary stream socket and emits Signal K delta
# JSON for every field with a standard Signal K path:
#   navigation.headingMagnetic / headingTrue / magneticVariation / rateOfTurn,
#   navigation.attitude {roll,pitch,yaw}, and environment.heave.
# Requires imud's [stream] output enabled (imud.conf: [stream] enabled = true).
# Enable an output below: turn on udp_enabled and add a UDP connection on the
# Signal K server listening on dest_port, and/or turn on tcp_enabled and add a
# TCP client data connection (the server dials the bridge; deltas are
# newline-framed JSON).
#
# Keys marked [restart] require a service restart; [hot] reload with SIGHUP
# (systemctl reload imud-signalk).

[imud-signalk]
# The daemon runs whenever enabled = true and stays healthy under systemd; it
# emits nothing until you turn on an output below. Both outputs are off by
# default — enable udp_enabled and/or tcp_enabled as your Signal K server needs.
enabled        = true                         # [restart] run the bridge daemon
socket         = "/run/imud/imud-stream.sock" # [restart] imud [stream] socket to read
                                              #   (match imud.conf if you changed it)
rate_hz        = 10                           # [hot] delta emit rate
source_label   = "imud"                       # [hot] Signal K delta source.label
publish_heave  = true                         # [hot] emit environment.heave
                                              #   (set false if imud's heave estimator is off)

# UDP delta output — the Signal K server adds a UDP connection on dest_port.
udp_enabled    = false                        # [restart] emit deltas over UDP
dest_addr      = "127.0.0.1"                  # [hot] SK host: name or numeric IP
dest_port      = 10113                        # [hot] must match the SK server's UDP input port

# TCP listener serving the same deltas (newline-framed) to connecting
# clients — for a Signal K server here or on another machine using a TCP
# data connection.  Independent of udp_enabled; enable either or both.
tcp_enabled    = false                        # [restart] serve deltas over TCP
tcp_bind_addr  = "0.0.0.0"                    # [restart] 127.0.0.1 = host-local only
tcp_port       = 10113                        # [restart] TCP namespace of the UDP port
